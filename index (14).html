<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF1F6;
    --panel:#FFFFFF;
    --ink:#171E2B;
    --sub:#6B7684;
    --faint:#9AA3B0;
    --line:#E7EAEF;
    --line-soft:#F0F2F5;
    --accent:#2952CC;
    --accent-soft:#E7EDFC;
    --danger:#DC2626;
    --navy-1:#0B2A5B;
    --navy-2:#1B4FA0;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .wrap{max-width:1600px;margin:0 auto;padding:0 0 90px;}

  /* ---------- banner ---------- */
  .banner{
    background:linear-gradient(120deg,var(--navy-1),var(--navy-2));
    color:#fff;
    padding:20px 28px 16px;
  }
  .banner-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:18px;
    flex-wrap:wrap;
  }
  .banner-title{display:flex;align-items:flex-start;gap:12px;}
  .banner-icon{
    font-size:26px;line-height:1;margin-top:2px;cursor:pointer;
    border-radius:8px;padding:2px 4px;
  }
  .banner-icon:hover{background:rgba(255,255,255,0.12);}
  .banner-title h1{
    font-size:21px;font-weight:800;margin:0 0 4px;letter-spacing:-.01em;
    outline:none;border-radius:6px;padding:1px 4px;
  }
  .banner-title h1:hover, .banner-title p:hover{background:rgba(255,255,255,0.08);}
  .banner-title h1:focus, .banner-title p:focus{background:rgba(255,255,255,0.14);outline:none;}
  .banner-title p{
    margin:0;font-size:12.5px;color:rgba(255,255,255,0.72);font-weight:500;
    outline:none;border-radius:6px;padding:1px 4px;
  }
  .banner-title h1:empty:before, .banner-title p:empty:before{
    content:attr(data-placeholder);opacity:.55;
  }
  .banner-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .banner-actions button{
    font-family:inherit;font-size:12.5px;font-weight:600;
    border-radius:8px;border:1px solid rgba(255,255,255,0.25);
    background:rgba(255,255,255,0.08);color:#fff;
    padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  .banner-actions button:hover{background:rgba(255,255,255,0.18);}
  .banner-actions button:active{transform:scale(0.96);}
  .banner-actions button.solid-accent{background:#2FAE60;border-color:#2FAE60;}
  .banner-actions button.solid-accent:hover{background:#279650;}
  .banner-actions button.solid-warn{background:#D98E1B;border-color:#D98E1B;}
  .banner-actions button.solid-warn:hover{background:#BE7A14;}
  .save-indicator{
    font-size:11.5px;color:rgba(255,255,255,0.65);display:flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;opacity:0;transition:opacity .4s ease;
  }
  .save-indicator.show{opacity:1;}
  .save-indicator .dot{width:6px;height:6px;border-radius:50%;background:#4ADE80;}

  /* ---------- project tabs ---------- */
  .tabbar{
    display:flex;align-items:flex-end;gap:4px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    padding:0 28px;
    flex-wrap:wrap;
  }
  .tab{
    position:relative;display:flex;align-items:center;gap:8px;
    padding:11px 18px;border-radius:10px 10px 0 0;cursor:pointer;
    color:var(--sub);font-weight:600;font-size:13.5px;
    border:1px solid transparent;border-bottom:none;background:transparent;
    transition:background .15s ease,color .15s ease;
  }
  .tab:hover{background:#F2F4F8;color:var(--ink);}
  .tab.active{background:var(--panel);color:var(--ink);border-color:var(--line);}
  .tab .dot-chip{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .tab .tab-name{outline:none;min-width:16px;white-space:nowrap;}
  .tab .remove-tab{
    color:var(--faint);font-weight:700;font-size:13px;line-height:1;
    padding:2px;border-radius:4px;opacity:0;transition:opacity .15s ease;
  }
  .tab:hover .remove-tab{opacity:1;}
  .tab .remove-tab:hover{color:var(--danger);background:#FCE9E9;}
  .add-tab{padding:11px 14px;color:var(--faint);font-weight:700;cursor:pointer;font-size:15px;border-radius:8px;}
  .add-tab:hover{color:var(--accent);background:#F2F4F8;}

  /* ---------- view switcher ---------- */
  .viewbar{
    display:flex;gap:4px;flex-wrap:wrap;padding:10px 28px;background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .view-btn{
    font-family:inherit;font-size:12.5px;font-weight:600;color:var(--sub);
    background:transparent;border:1px solid transparent;border-radius:20px;
    padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:background .15s ease,color .15s ease;
  }
  .view-btn:hover{background:var(--line-soft);color:var(--ink);}
  .view-btn.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft);}

  .view-container{padding:20px 28px 10px;}
  .view-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .view-header h2{font-size:16px;font-weight:800;margin:0 0 3px;}
  .view-header .view-sub{font-size:12px;color:var(--sub);margin:0;}
  .view-note{
    font-size:11.5px;color:var(--sub);background:#F7F9FC;border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;margin-bottom:16px;
  }
  .panel-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,30,45,0.04);
  }
  .panel-card h3{font-size:13px;font-weight:700;margin:0 0 12px;}

  /* ---------- timeline view ---------- */
  .tl-legend{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .tl-legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--sub);}
  .tl-legend-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
  .tl-avg-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .tl-avg-label{width:110px;flex-shrink:0;font-size:12px;font-weight:600;}
  .tl-avg-track{flex:1;height:10px;background:var(--line-soft);border-radius:6px;overflow:hidden;position:relative;}
  .tl-avg-fill{height:100%;border-radius:6px;}
  .tl-avg-days{width:52px;flex-shrink:0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--sub);}
  .tl-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-soft);}
  .tl-row:last-child{border-bottom:none;}
  .tl-row-name{width:230px;flex-shrink:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tl-row-bar{flex:1;display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--line-soft);}
  .tl-seg{height:100%;position:relative;}
  .tl-seg.ongoing{background-image:repeating-linear-gradient(45deg, rgba(255,255,255,0.35) 0, rgba(255,255,255,0.35) 4px, transparent 4px, transparent 8px);}
  .tl-row-total{width:70px;flex-shrink:0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--sub);}

  /* ---------- SLA view ---------- */
  .sla-flex{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;}
  .donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .donut{width:160px;height:160px;border-radius:50%;flex-shrink:0;position:relative;}
  .donut-center{
    position:absolute;inset:26px;background:var(--panel);border-radius:50%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .donut-center .num{font-size:22px;font-weight:800;line-height:1;}
  .donut-center .lbl{font-size:9.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .donut-legend{display:flex;flex-direction:column;gap:8px;}
  .donut-legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;}
  .donut-legend-swatch{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
  .donut-legend-count{font-family:'IBM Plex Mono',monospace;font-weight:700;margin-left:2px;}
  .sla-targets{display:flex;gap:10px;flex-wrap:wrap;}
  .sla-target-item{display:flex;align-items:center;gap:6px;background:var(--line-soft);border-radius:8px;padding:6px 10px;}
  .sla-target-item label{font-size:11.5px;font-weight:700;color:var(--sub);}
  .sla-target-item input{
    width:42px;border:1px solid var(--line);border-radius:5px;padding:3px 5px;font-family:'IBM Plex Mono',monospace;
    font-size:12px;text-align:center;
  }
  .sla-table{width:100%;border-collapse:collapse;}
  .sla-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);padding:6px 8px;border-bottom:1px solid var(--line);}
  .sla-table td{padding:7px 8px;font-size:12.5px;border-bottom:1px solid var(--line-soft);}
  .sla-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;display:inline-block;}
  .sla-badge.ok{background:#DFF5E7;color:#1E8A4C;}
  .sla-badge.risk{background:#FFF1D6;color:#9A6A00;}
  .sla-badge.breach{background:#FCE4E4;color:#B12525;}

  /* ---------- resources view ---------- */
  .res-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .res-toolbar select{
    font-family:inherit;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:9px;
    background:var(--panel);color:var(--ink);padding:8px 10px;cursor:pointer;
  }
  .team-table{width:100%;border-collapse:collapse;}
  .team-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);padding:6px 8px;border-bottom:1px solid var(--line);}
  .team-table td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  .team-table input[type="text"]{
    width:100%;border:1px solid transparent;background:transparent;font-family:inherit;font-size:12.5px;
    padding:5px 6px;border-radius:6px;
  }
  .team-table input[type="text"]:hover{border-color:var(--line);}
  .team-table input[type="text"]:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft);}
  .team-table input[type="number"]{
    width:56px;border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:right;
  }
  .cap-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);}
  .cap-row:last-child{border-bottom:none;}
  .cap-name{width:190px;flex-shrink:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cap-role{font-size:10.5px;color:var(--sub);font-weight:500;}
  .cap-track{flex:1;height:14px;background:var(--line-soft);border-radius:7px;overflow:hidden;position:relative;}
  .cap-fill{height:100%;border-radius:7px;background:var(--accent);}
  .cap-fill.over{background:var(--danger);}
  .cap-nums{width:90px;flex-shrink:0;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--sub);}
  .cap-nums.over{color:var(--danger);font-weight:700;}

  /* ---------- gantt view ---------- */
  .gantt-scroll{overflow-x:auto;}
  .gantt-grid{min-width:900px;}
  .gantt-axis{display:flex;font-size:10.5px;color:var(--sub);border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:10px;padding-left:190px;}
  .gantt-axis span{flex:1;text-align:left;font-family:'IBM Plex Mono',monospace;}
  .gantt-row{display:flex;align-items:center;gap:0;padding:8px 0;border-bottom:1px solid var(--line-soft);}
  .gantt-row-label{width:190px;flex-shrink:0;font-size:12.5px;font-weight:700;}
  .gantt-track{flex:1;position:relative;height:26px;background:var(--line-soft);border-radius:6px;}
  .gantt-bar{
    position:absolute;top:3px;height:20px;border-radius:5px;background:var(--accent);
    display:flex;align-items:center;padding:0 8px;font-size:10.5px;color:#fff;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 3px rgba(20,30,45,0.15);
  }
  .gantt-dates{display:flex;align-items:center;gap:6px;margin-left:12px;flex-shrink:0;}
  .gantt-dates input[type="date"]{
    font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid var(--line);border-radius:6px;padding:4px 5px;
  }
  .gantt-empty{padding:30px;text-align:center;color:var(--faint);font-size:13px;}

  /* ---------- stat cards ---------- */
  .stats-row{
    display:grid;grid-template-columns:repeat(6,1fr);gap:14px;
    padding:18px 28px 4px;
  }
  .stat-card{
    background:var(--panel);border-radius:var(--radius);
    border-top:3px solid var(--accent);
    padding:14px 16px;box-shadow:0 1px 2px rgba(20,30,45,0.04);
  }
  .stat-card .num{font-size:26px;font-weight:800;line-height:1;}
  .stat-card .label{margin-top:6px;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--sub);text-transform:uppercase;}
  .stat-card.c-total{border-top-color:#2952CC;}
  .stat-card.c-inprogress{border-top-color:#1D5FA8;}
  .stat-card.c-blocked{border-top-color:#DC2626;}
  .stat-card.c-prod{border-top-color:#15803D;}
  .stat-card.c-uat{border-top-color:#D98E1B;}
  .stat-card.c-closed{border-top-color:#0D9488;}

  @media (max-width:1100px){ .stats-row{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:640px){ .stats-row{grid-template-columns:repeat(2,1fr);} }

  /* ---------- filter bar ---------- */
  .filter-bar{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:14px 28px;
  }
  .filter-bar .search-wrap{
    flex:1 1 220px;min-width:180px;position:relative;
  }
  .filter-bar input[type="text"].search-input{
    width:100%;padding:9px 12px 9px 30px;border-radius:9px;border:1px solid var(--line);
    background:var(--panel);font-family:inherit;font-size:13px;color:var(--ink);
  }
  .filter-bar input[type="text"].search-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .filter-bar .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:13px;}
  .filter-bar select.filter-select{
    font-family:inherit;font-size:12.5px;font-weight:500;
    border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);
    padding:8px 10px;cursor:pointer;
  }
  .filter-bar select.filter-select:focus{outline:none;border-color:var(--accent);}
  .filter-clear{
    font-family:inherit;font-size:12.5px;font-weight:600;color:var(--sub);
    background:transparent;border:none;cursor:pointer;padding:8px 6px;display:flex;align-items:center;gap:4px;
  }
  .filter-clear:hover{color:var(--danger);}
  .filter-count{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:'IBM Plex Mono',monospace;}

  /* ---------- columns popover ---------- */
  .columns-popover{
    position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;
    box-shadow:0 12px 30px rgba(10,20,40,0.18);padding:10px 12px;z-index:50;min-width:190px;
  }
  .columns-popover label{
    display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 2px;cursor:pointer;color:var(--ink);
  }
  .columns-popover .cp-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;margin:2px 0 6px;}

  /* ---------- project toolbar / sprint controls ---------- */
  .project-toolbar{display:flex;gap:10px;margin:0 28px 16px;flex-wrap:wrap;}
  button.btn{
    font-family:inherit;font-size:13px;font-weight:600;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);padding:9px 15px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:border-color .15s ease, transform .1s ease;
  }
  button.btn:hover{border-color:var(--accent);color:var(--accent);}
  button.btn:active{transform:scale(0.97);}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.btn.primary:hover{background:#2145AD;border-color:#2145AD;color:#fff;}

  #sprintsContainer{padding:0 28px;}

  /* ---------- sprint card ---------- */
  .sprint{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:18px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,45,0.04);
  }
  .sprint-header{
    display:flex;align-items:center;gap:10px;padding:13px 16px;
    background:#F7F9FC;border-bottom:1px solid var(--line);
  }
  .collapse-toggle{
    width:22px;height:22px;border:none;background:transparent;color:var(--sub);cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:11px;border-radius:6px;
    flex-shrink:0;transition:transform .15s ease;
  }
  .collapse-toggle:hover{background:var(--line-soft);}
  .collapse-toggle.collapsed{transform:rotate(-90deg);}
  .sprint-name{font-weight:700;font-size:14px;outline:none;padding:3px 6px;border-radius:6px;min-width:20px;}
  .sprint-name:hover{background:var(--line-soft);}
  .sprint-name:focus{background:#fff;box-shadow:0 0 0 2px var(--accent-soft);}
  .task-count{
    font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sub);
    background:var(--line-soft);padding:2px 8px;border-radius:20px;
  }
  .sprint-header-actions{margin-left:auto;display:flex;gap:6px;align-items:center;}
  .icon-btn{
    width:28px;height:28px;border:none;background:transparent;border-radius:7px;color:var(--sub);
    cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;
  }
  .icon-btn:hover{background:#EEF1F5;color:var(--ink);}
  .icon-btn.delete:hover{background:#FCE9E9;color:var(--danger);}
  .icon-btn:disabled{opacity:.25;cursor:default;}
  .icon-btn:disabled:hover{background:transparent;color:var(--sub);}

  /* ---------- table ---------- */
  .table-scroll{overflow:auto;}
  table{border-collapse:collapse;width:100%;min-width:1700px;}
  thead th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:#fff;font-weight:700;padding:10px 10px;white-space:nowrap;
    background:var(--navy-1);
  }
  thead th:first-child{border-radius:0;}
  th .col-head{display:flex;align-items:center;gap:6px;}
  th .col-label{outline:none;border-radius:4px;padding:2px 3px;}
  th .col-label:hover{background:rgba(255,255,255,0.12);}
  th .col-label:focus{background:rgba(255,255,255,0.2);color:#fff;}
  th .remove-col{cursor:pointer;color:rgba(255,255,255,0.5);font-weight:700;font-size:13px;line-height:1;}
  th .remove-col:hover{color:#FCA5A5;}

  tbody tr{border-bottom:1px solid var(--line-soft);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:#FAFBFD;}
  tbody tr.row-hidden{display:none;}
  td{padding:7px 8px;vertical-align:top;font-size:13px;}
  td.order-cell{white-space:nowrap;padding-left:12px;}
  .ticket-no-row{display:flex;align-items:center;gap:1px;}
  .ticket-hash{font-family:'IBM Plex Mono',monospace;font-weight:700;color:var(--accent);font-size:12.5px;}
  input.ticket-no-input{
    width:58px;border:1px solid transparent;background:transparent;font-family:'IBM Plex Mono',monospace;
    font-weight:700;color:var(--accent);font-size:12.5px;padding:3px 3px;border-radius:5px;
  }
  input.ticket-no-input:hover{border-color:var(--line);}
  input.ticket-no-input:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft);}
  .order-btns{display:inline-flex;gap:1px;margin-top:2px;}

  input[type="text"].cell-input, textarea.cell-input, input[type="number"].cell-input{
    width:100%;border:1px solid transparent;background:transparent;font-family:inherit;
    font-size:13px;color:var(--ink);padding:6px 7px;border-radius:7px;resize:none;
  }
  textarea.cell-input{min-height:34px;overflow:hidden;white-space:pre-wrap;word-break:break-word;}
  input[type="text"].cell-input:hover, textarea.cell-input:hover, input[type="number"].cell-input:hover{border-color:var(--line);}
  input[type="text"].cell-input:focus, textarea.cell-input:focus, input[type="number"].cell-input:focus{

<script>
const PRIORITY_OPTIONS = [
  {v:'P1', label:'P1 - Critical', cls:'pr-p1'},
  {v:'P2', label:'P2 - High', cls:'pr-p2'},
  {v:'P3', label:'P3 - Medium', cls:'pr-p3'},
  {v:'P4', label:'P4 - Low', cls:'pr-p4'},
];
const STAGE_OPTIONS = [
  {v:'BR', label:'Business Req', cls:'sg-br'},
  {v:'DSN', label:'Design', cls:'sg-dsn'},
  {v:'DEV', label:'Dev', cls:'sg-dev'},
  {v:'UAT', label:'UAT', cls:'sg-uat'},
  {v:'PROD', label:'Prod', cls:'sg-prod'},
];
const TRACKER_STATUS_OPTIONS = [
  {v:'New', label:'New', cls:'ts-new'},
  {v:'In Progress', label:'In Progress', cls:'ts-inprogress'},
  {v:'Feedback', label:'Feedback', cls:'ts-feedback'},
  {v:'Blocked', label:'Blocked', cls:'ts-blocked'},
  {v:'Done', label:'Done', cls:'ts-done'},
  {v:'Closed', label:'Closed', cls:'ts-closed'},
];
const STAGE_COLORS = { BR:'#3346B8', DSN:'#B02D80', DEV:'#D98E1B', UAT:'#0D9488', PROD:'#1E8A4C' };
function stageColor(stage){ return STAGE_COLORS[stage] || '#9AA3B0'; }
const RAG_CYCLE = ['', 'green', 'amber', 'red'];
const PROJECT_COLORS = ['#2952CC','#0D9488','#B02D80','#C2410C','#1D4ED8','#7C3AED'];

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

function newRow(ticketNo){
  const now = new Date().toISOString();
  return {
    id: uid('row'), ticketNo: ticketNo,
    task:'', priority:'P3', assignee:'', stage:'BR',
    stageHistory:[{stage:'BR', at: now}],
    receivedDate:'', delivery:'', deliveryHistory:null, effort:'', trackerStatus:'New',
    highlight:'', blocker:'', comment:'', custom:{}
  };
}
function newSprint(name){
  return { id: uid('sprint'), name: name || 'New sprint', collapsed:false, startDate:'', endDate:'', rows:[] };
}
function defaultSlaTargets(){
  return { BR:3, DSN:5, DEV:10, UAT:5, PROD:2 };
}
function newProject(name, colorIdx){
  const n = name || 'New project';
  return {
    id: uid('proj'), name: n,
    bannerTitle: `${n} — PM Roadmap Dashboard`,
    subtitle: 'Product Management · Roadmap Dashboard',
    icon: '🚀',
    color: PROJECT_COLORS[colorIdx % PROJECT_COLORS.length],
    slaTargets: defaultSlaTargets(),
    team: [],
    sprints:[ newSprint('Sprint 1') ]
  };
}
function teamMember(name, role, capacity){
  return { id: uid('member'), name, role, capacity: (capacity == null ? 10 : capacity) };
}
function defaultLabels(){
  return {
    task:'Ticket Subject', priority:'Priority', assignee:'Assignee', stage:'Stage',
    receivedDate:'Received', delivery:'Est. Date / Revised', effort:'Effort (days)', trackerStatus:'Tracker Status',
    highlight:'Highlight / RAG', blocker:'Blocker', comment:'Comment'
  };
}
function defaultData(){
  const zainmart = newProject('Zainmart', 0);
  const oodi = newProject('Oodi', 1);

  zainmart.team = [
    teamMember('Amal Ayyash', 'Tech Lead', 10),
    teamMember('Saif', 'Backend Dev', 10),
    teamMember('Aya Maitham', 'Backend Dev', 10),
    teamMember('Itimad', 'Mobile Dev', 10),
    teamMember('Fatih', 'Mobile Dev', 10),
    teamMember('Abdallah Rzyqat', 'Mobile Dev', 10),
    teamMember('Ahmed Sobhy', 'Frontend Dev', 10),
    teamMember('Khaled', 'Frontend Dev', 10),
    teamMember('Athraa Akram', 'PMO', 10),
    teamMember('Salman', 'QA', 10),
    teamMember('Ilyas', 'Designer', 10),
  ];
  oodi.team = [
    teamMember('Bogdan', 'Tech Lead', 10),
    teamMember('Emilia', 'Backend Dev', 10),
    teamMember('Bouziane', 'Mobile Dev', 10),
    teamMember('Reza', 'Mobile Dev', 10),
    teamMember('Fethi', 'Mobile Dev', 10),
    teamMember('Saad', 'Backend Dev', 10),
    teamMember('Mehedi', 'Backend Dev', 10),
    teamMember('Merah', 'Backend Dev', 10),
    teamMember('Mohammad Hassan', 'Frontend Dev', 10),
    teamMember('Salman', 'QA', 10),
    teamMember('Ilyas', 'Designer', 10),
  ];

  return {
    labels: defaultLabels(),
    customColumns: [],
    columnVisibility: { assignee:true, effort:true, highlight:true, blocker:true, comment:true, receivedDate:true },
    nextTicketNo: 6501,
    activeProjectId: zainmart.id,
    projects: [zainmart, oodi]
  };
}

let data = defaultData();
let saveTimer = null;
let dataVersion = 0;
let lastSavedVersion = 0;
let lastRenderedSignature = '';
let filters = { search:'', stage:'', priority:'', assignee:'', highlight:'' };
let activeView = 'tickets'; // local UI state, not synced — 'tickets' | 'timeline' | 'sla' | 'resources' | 'gantt'
let ganttSelectedSprintId = null;
let resourcesSelectedSprintId = null;

/* ---------------- migration ---------------- */
function migrateData(d){
  if(!d || !Array.isArray(d.projects) || !d.projects.length) return defaultData();
  if(!d.labels) d.labels = defaultLabels();
  else d.labels = Object.assign(defaultLabels(), d.labels);
  if(!Array.isArray(d.customColumns)) d.customColumns = [];
  if(!d.columnVisibility) d.columnVisibility = { assignee:true, effort:true, highlight:true, blocker:true, comment:true, receivedDate:true };
  if(d.columnVisibility.receivedDate == null) d.columnVisibility.receivedDate = true;
  if(typeof d.nextTicketNo !== 'number') d.nextTicketNo = 6501;

  const nowIso = new Date().toISOString();
  d.projects.forEach(proj => {
    if(proj.bannerTitle == null) proj.bannerTitle = `${proj.name} — PM Roadmap Dashboard`;
    if(proj.subtitle == null) proj.subtitle = 'Product Management · Roadmap Dashboard';
    if(!proj.icon) proj.icon = '🚀';
    if(!proj.slaTargets) proj.slaTargets = defaultSlaTargets();
    else proj.slaTargets = Object.assign(defaultSlaTargets(), proj.slaTargets);
    if(!Array.isArray(proj.team)) proj.team = [];
    (proj.sprints || []).forEach(sprint => {
      if(sprint.startDate == null) sprint.startDate = '';
      if(sprint.endDate == null) sprint.endDate = '';
      (sprint.rows || []).forEach(row => {
        if(row.ticketNo == null){ row.ticketNo = d.nextTicketNo++; }
        if(row.priority == null) row.priority = 'P3';
        if(row.assignee == null) row.assignee = '';
        if(row.stage === 'UIUX') row.stage = 'DSN';
        if(!row.stage) row.stage = 'BR';
        if(row.receivedDate == null) row.receivedDate = '';
        if(row.effort == null) row.effort = '';
        if(row.trackerStatus == null){
          const legacyMap = {'not-started':'New','in-progress':'In Progress','blocked':'Blocked','done':'Done'};
          row.trackerStatus = legacyMap[row.status] || 'New';
        }
        if(row.highlight == null) row.highlight = '';
        if(row.blocker == null) row.blocker = '';
        if(row.comment == null) row.comment = '';
        if(!row.custom) row.custom = {};
        if(!Array.isArray(row.stageHistory) || !row.stageHistory.length){
          // No history yet — start tracking from now. Time already spent in the
          // current stage before today can't be known, so durations count from here.
          row.stageHistory = [{stage: row.stage, at: nowIso}];
        }
      });
    });
  });
  if(!d.projects.find(p => p.id === d.activeProjectId)) d.activeProjectId = d.projects[0].id;
  return d;
}

/* ---------------- persistence ---------------- */
async function loadData(){
  try{
    const res = await fetch('/api/data');
    const json = await res.json();
    if(json && json.data && Array.isArray(json.data.projects) && json.data.projects.length){
      data = migrateData(json.data);
    } else {
      await saveData();
    }
  }catch(e){
    console.error('Load failed, using local defaults', e);
  }
  render();
}
function scheduleSave(){
  dataVersion++;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveData, 500);
}
async function saveData(){
  const versionAtStart = dataVersion;
  try{
    await fetch('/api/data', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    if(versionAtStart === dataVersion){ lastSavedVersion = versionAtStart; }
    flashSaved();
  }catch(e){ console.error('Save failed', e); }
}
setInterval(async () => {
  const active = document.activeElement;
  const isEditing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
  if(isEditing) return;
  if(dataVersion !== lastSavedVersion) return; // unsaved local edits pending — don't clobber them
  try{
    const res = await fetch('/api/data');
    const json = await res.json();
    if(json && json.data && Array.isArray(json.data.projects) && json.data.projects.length){
      const migrated = migrateData(json.data);
      const keepActiveId = data.activeProjectId;
      migrated.activeProjectId = migrated.projects.find(p => p.id === keepActiveId) ? keepActiveId : migrated.projects[0].id;
      const newSig = JSON.stringify(migrated);
      if(newSig === lastRenderedSignature) return; // nothing changed on the server — skip the rebuild
      data = migrated;
      render();
    }
  }catch(e){}
}, 5000);
function flashSaved(){
  const el = document.getElementById('saveIndicator');
  el.classList.add('show');
  clearTimeout(flashSaved._t);
  flashSaved._t = setTimeout(()=> el.classList.remove('show'), 1300);
}

/* ---------------- helpers ---------------- */
function autoGrow(el){
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function fmtDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = String(d.getFullYear()).slice(-2);
  return `${dd}/${mm}/${yy}`;
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function setRowStage(row, newStage){
  if(row.stage === newStage) return;
  row.stage = newStage;
  if(!Array.isArray(row.stageHistory)) row.stageHistory = [];
  row.stageHistory.push({ stage: newStage, at: new Date().toISOString() });
}
function stageDurations(row){
  const hist = Array.isArray(row.stageHistory) ? row.stageHistory : [];
  const segments = [];
  for(let i=0;i<hist.length;i++){
    const start = new Date(hist[i].at);
    const end = i+1 < hist.length ? new Date(hist[i+1].at) : new Date();
    const days = Math.max(0, (end - start) / 86400000);
    segments.push({ stage: hist[i].stage, days, ongoing: i === hist.length-1 });
  }
  return segments;
}
function currentStageDays(row){
  const segs = stageDurations(row);
  const last = segs[segs.length-1];
  return last ? last.days : 0;
}
function fmtDays(n){
  if(n < 1) return `${Math.round(n*24)}h`;
  return `${n.toFixed(1)}d`;
}
function getActiveProject(){ return data.projects.find(p => p.id === data.activeProjectId) || data.projects[0]; }
function findSprintInActive(sprintId){ return getActiveProject().sprints.find(s => s.id === sprintId); }
function allRowsInActive(){
  const rows = [];
  getActiveProject().sprints.forEach(s => s.rows.forEach(r => rows.push(r)));
  return rows;
}
function rowMatchesFilter(row){
  if(filters.search && !row.task.toLowerCase().includes(filters.search.toLowerCase())) return false;
  if(filters.stage && row.stage !== filters.stage) return false;
  if(filters.priority && row.priority !== filters.priority) return false;
  if(filters.assignee && row.assignee !== filters.assignee) return false;
  if(filters.highlight){
    if(filters.highlight === 'none' && row.highlight) return false;
    if(filters.highlight !== 'none' && row.highlight !== filters.highlight) return false;
  }
  return true;
}

/* ---------------- render root ---------------- */
const VIEWS = [
  {v:'tickets', label:'📋 Tickets'},
  {v:'timeline', label:'⏱ Timeline'},
  {v:'sla', label:'🎯 SLA'},
  {v:'resources', label:'👥 Resources'},
  {v:'gantt', label:'📅 Gantt'},
];
function render(){
  renderBanner();
  renderTabs();
  renderViewbar();
  renderStats();
  renderFilterBar();
  renderSprints();
  renderActiveView();
  lastRenderedSignature = JSON.stringify(data);
}

function renderViewbar(){
  const bar = document.getElementById('viewbar');
  bar.innerHTML = VIEWS.map(v => `<button class="view-btn ${activeView===v.v?'active':''}" data-view="${v.v}">${v.label}</button>`).join('');
  bar.querySelectorAll('[data-view]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeView = btn.getAttribute('data-view');
      renderViewbar();
      renderActiveView();
    });
  });
}

function renderActiveView(){
  const ticketsView = document.getElementById('ticketsView');
  const containers = {
    timeline: document.getElementById('timelineContainer'),
    sla: document.getElementById('slaContainer'),
    resources: document.getElementById('resourcesContainer'),
    gantt: document.getElementById('ganttContainer'),
  };
  ticketsView.style.display = activeView === 'tickets' ? '' : 'none';
  Object.keys(containers).forEach(key => { containers[key].style.display = activeView === key ? '' : 'none'; });

  if(activeView === 'timeline') renderTimelineView();
  else if(activeView === 'sla') renderSLAView();
  else if(activeView === 'resources') renderResourcesView();
  else if(activeView === 'gantt') renderGanttView();
}

function renderBanner(){
  const proj = getActiveProject();
  const iconEl = document.getElementById('bannerIcon');
  const titleEl = document.getElementById('bannerTitle');
  const subEl = document.getElementById('bannerSubtitle');
  if(document.activeElement !== iconEl) iconEl.textContent = proj.icon;
  if(document.activeElement !== titleEl) titleEl.textContent = proj.bannerTitle || '';
  if(document.activeElement !== subEl) subEl.textContent = proj.subtitle || '';

  iconEl.oninput = () => { proj.icon = iconEl.textContent.trim().slice(0,4) || '🚀'; scheduleSave(); };
  titleEl.oninput = () => { proj.bannerTitle = titleEl.textContent; scheduleSave(); };
  subEl.oninput = () => { proj.subtitle = subEl.textContent; scheduleSave(); };
  [iconEl, titleEl, subEl].forEach(el => {
    el.onkeydown = (e) => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } };
  });
}

function renderTabs(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = '';
  data.projects.forEach(proj => {
    const tab = document.createElement('div');
    tab.className = 'tab' + (proj.id === data.activeProjectId ? ' active' : '');
    tab.innerHTML = `
      <span class="dot-chip" style="background:${proj.color}"></span>
      <span class="tab-name" contenteditable="true" spellcheck="false" data-proj-id="${proj.id}">${escapeHtml(proj.name)}</span>
      <span class="remove-tab" data-remove-proj="${proj.id}" title="Delete project">&times;</span>
    `;
    tab.addEventListener('click', (e) => {
      if(e.target.closest('[data-remove-proj]') || e.target.closest('.tab-name')) return;
      data.activeProjectId = proj.id; render();
    });
    const nameEl = tab.querySelector('.tab-name');
    nameEl.addEventListener('click', () => {
      if(data.activeProjectId !== proj.id){
        data.activeProjectId = proj.id;
        render();
        const freshEl = document.querySelector(`.tab-name[data-proj-id="${proj.id}"]`);
        if(freshEl){ freshEl.focus(); document.execCommand('selectAll', false, null); }
      } else {
        nameEl.focus();
      }
    });
    nameEl.addEventListener('keydown', (e) => { if(e.key==='Enter'){ e.preventDefault(); nameEl.blur(); } });
    nameEl.addEventListener('blur', () => { proj.name = nameEl.textContent.trim() || 'Untitled project'; scheduleSave(); render(); });
    tab.querySelector('[data-remove-proj]').addEventListener('click', (e) => {
      e.stopPropagation();
      if(data.projects.length <= 1){ alert('You need at least one project.'); return; }
      if(confirm(`Delete project "${proj.name}" and all its sprints/tasks?`)){
        data.projects = data.projects.filter(p => p.id !== proj.id);
        if(data.activeProjectId === proj.id) data.activeProjectId = data.projects[0].id;
        render(); scheduleSave();
      }
    });
    bar.appendChild(tab);
  });
  const addTab = document.createElement('div');
  addTab.className = 'add-tab'; addTab.textContent = '+'; addTab.title = 'Add project';
  addTab.addEventListener('click', () => {
    const proj = newProject('New project', data.projects.length);
    data.projects.push(proj); data.activeProjectId = proj.id;
    render(); scheduleSave();
    const el = document.querySelector(`.tab-name[data-proj-id="${proj.id}"]`);
    if(el){ el.focus(); document.execCommand('selectAll', false, null); }
  });
  bar.appendChild(addTab);
}

function renderStats(){
  const rows = allRowsInActive();
  const total = rows.length;
  const inProgress = rows.filter(r => r.trackerStatus === 'In Progress').length;
  const blocked = rows.filter(r => (r.blocker && r.blocker.trim()) || r.trackerStatus === 'Blocked').length;
  const inProd = rows.filter(r => r.stage === 'PROD').length;
  const inUat = rows.filter(r => r.stage === 'UAT').length;
  const closed = rows.filter(r => r.trackerStatus === 'Closed' || r.trackerStatus === 'Done').length;
  const cards = [
    {n:total, l:'Total tickets', c:'c-total'},
    {n:inProgress, l:'In Progress', c:'c-inprogress'},
    {n:blocked, l:'Blocked', c:'c-blocked'},
    {n:inProd, l:'In Prod', c:'c-prod'},
    {n:inUat, l:'In UAT', c:'c-uat'},
    {n:closed, l:'Closed', c:'c-closed'},
  ];
  document.getElementById('statsRow').innerHTML = cards.map(c => `
    <div class="stat-card ${c.c}"><div class="num">${c.n}</div><div class="label">${c.l}</div></div>
  `).join('');
}

function renderFilterBar(){
  const rows = allRowsInActive();
  const stageSel = document.getElementById('filterStage');
  const prioSel = document.getElementById('filterPriority');
  const assigneeSel = document.getElementById('filterAssignee');
  const highlightSel = document.getElementById('filterHighlight');
  const searchInput = document.getElementById('searchInput');

  stageSel.innerHTML = `<option value="">Stage: All</option>` + STAGE_OPTIONS.map(o => `<option value="${o.v}" ${filters.stage===o.v?'selected':''}>${o.label}</option>`).join('');
  prioSel.innerHTML = `<option value="">Priority: All</option>` + PRIORITY_OPTIONS.map(o => `<option value="${o.v}" ${filters.priority===o.v?'selected':''}>${o.label}</option>`).join('');
  const assignees = Array.from(new Set(rows.map(r => r.assignee).filter(Boolean))).sort();
  assigneeSel.innerHTML = `<option value="">Assignee: All</option>` + assignees.map(a => `<option value="${escapeHtml(a)}" ${filters.assignee===a?'selected':''}>${escapeHtml(a)}</option>`).join('');
  highlightSel.innerHTML = `
    <option value="">Highlight: All</option>
    <option value="none" ${filters.highlight==='none'?'selected':''}>None</option>
    <option value="green" ${filters.highlight==='green'?'selected':''}>Green</option>
    <option value="amber" ${filters.highlight==='amber'?'selected':''}>Amber</option>
    <option value="red" ${filters.highlight==='red'?'selected':''}>Red</option>
  `;
  if(searchInput.value !== filters.search) searchInput.value = filters.search;

  searchInput.oninput = () => { filters.search = searchInput.value; renderSprints(); updateFilterCount(); };
  stageSel.onchange = () => { filters.stage = stageSel.value; renderSprints(); updateFilterCount(); };
  prioSel.onchange = () => { filters.priority = prioSel.value; renderSprints(); updateFilterCount(); };
  assigneeSel.onchange = () => { filters.assignee = assigneeSel.value; renderSprints(); updateFilterCount(); };
  highlightSel.onchange = () => { filters.highlight = highlightSel.value; renderSprints(); updateFilterCount(); };
  document.getElementById('filterClearBtn').onclick = () => {
    filters = { search:'', stage:'', priority:'', assignee:'', highlight:'' };
    renderFilterBar(); renderSprints(); updateFilterCount();
  };
  updateFilterCount();
}
function updateFilterCount(){
  const rows = allRowsInActive();
  const shown = rows.filter(rowMatchesFilter).length;
  const active = filters.search || filters.stage || filters.priority || filters.assignee || filters.highlight;
  document.getElementById('filterCount').textContent = active ? `${shown} of ${rows.length} shown` : '';
}

/* ---------------- sprints / table ---------------- */
function renderSprints(){
  const scrollX = window.scrollX, scrollY = window.scrollY;
  const container = document.getElementById('sprintsContainer');
  const proj = getActiveProject();
  container.innerHTML = '';

  if(proj.sprints.length === 0){
    container.innerHTML = `<div class="sprint"><div class="empty-sprint">No sprints yet in "${escapeHtml(proj.name)}" — add one above.</div></div>`;
    window.scrollTo(scrollX, scrollY);
    return;
  }

  proj.sprints.forEach(sprint => {
    const card = document.createElement('div');
    card.className = 'sprint';
    const header = document.createElement('div');
    header.className = 'sprint-header';
    header.innerHTML = `
      <button class="collapse-toggle ${sprint.collapsed?'collapsed':''}" data-toggle="${sprint.id}" title="Collapse/expand">&#9660;</button>
      <span class="sprint-name" contenteditable="true" spellcheck="false" data-sprint-name="${sprint.id}">${escapeHtml(sprint.name)}</span>
      <span class="task-count">${sprint.rows.length} ticket${sprint.rows.length===1?'':'s'}</span>
      <div class="sprint-header-actions">
        <button class="icon-btn" data-add-task="${sprint.id}" title="Add ticket">+ Ticket</button>
        <button class="icon-btn delete" data-delete-sprint="${sprint.id}" title="Delete sprint">&#128465;</button>
      </div>
    `;
    card.appendChild(header);

    if(!sprint.collapsed){
      const scroll = document.createElement('div');
      scroll.className = 'table-scroll';
      const table = document.createElement('table');
      table.innerHTML = `<thead><tr id="head-${sprint.id}"></tr></thead><tbody id="body-${sprint.id}"></tbody>`;
      scroll.appendChild(table);
      card.appendChild(scroll);
    }
    container.appendChild(card);
    if(!sprint.collapsed){ renderHead(sprint); renderBody(sprint); }
  });

  attachSprintHeaderEvents();
  window.scrollTo(scrollX, scrollY);
}

function colCount(){
  const vis = data.columnVisibility;
  let n = 6; // order, task, priority, assignee, stage+progress(2), delivery
  if(vis.receivedDate) n += 1;
  if(vis.effort) n += 1;
  n += 1; // tracker status
  if(vis.highlight) n += 1;
  if(vis.blocker) n += 1;
  if(vis.comment) n += 1;
  n += data.customColumns.length;
  n += 1; // actions
  return n;
}

function renderHead(sprint){
  const headRow = document.getElementById(`head-${sprint.id}`);
  if(!headRow) return;
  const vis = data.columnVisibility;
  let html = `
    <th style="width:80px;">#</th>
    <th><span class="col-label" contenteditable="true" spellcheck="false" data-label="task">${escapeHtml(data.labels.task)}</span></th>
    <th><span class="col-label" contenteditable="true" spellcheck="false" data-label="priority">${escapeHtml(data.labels.priority)}</span></th>
    ${vis.assignee ? `<th><span class="col-label" contenteditable="true" spellcheck="false" data-label="assignee">${escapeHtml(data.labels.assignee)}</span></th>` : ''}
    ${vis.receivedDate ? `<th class="date-field"><span class="col-label" contenteditable="true" spellcheck="false" data-label="receivedDate">${escapeHtml(data.labels.receivedDate)}</span></th>` : ''}
    <th><span class="col-label" contenteditable="true" spellcheck="false" data-label="stage">${escapeHtml(data.labels.stage)}</span></th>
    <th>Progress Steps</th>
    <th class="date-field"><span class="col-label" contenteditable="true" spellcheck="false" data-label="delivery">${escapeHtml(data.labels.delivery)}</span></th>
    ${vis.effort ? `<th><span class="col-label" contenteditable="true" spellcheck="false" data-label="effort">${escapeHtml(data.labels.effort)}</span></th>` : ''}
    <th><span class="col-label" contenteditable="true" spellcheck="false" data-label="trackerStatus">${escapeHtml(data.labels.trackerStatus)}</span></th>
    ${vis.highlight ? `<th><span class="col-label" contenteditable="true" spellcheck="false" data-label="highlight">${escapeHtml(data.labels.highlight)}</span></th>` : ''}
    ${vis.blocker ? `<th><span class="col-label" contenteditable="true" spellcheck="false" data-label="blocker">${escapeHtml(data.labels.blocker)}</span></th>` : ''}
    ${vis.comment ? `<th style="min-width:220px;"><span class="col-label" contenteditable="true" spellcheck="false" data-label="comment">${escapeHtml(data.labels.comment)}</span></th>` : ''}
  `;
  data.customColumns.forEach(col => {
    html += `<th data-col-id="${col.id}">
      <div class="col-head">
        <span class="col-label" contenteditable="true" spellcheck="false" data-custom-label="${col.id}">${escapeHtml(col.label)}</span>
        <span class="remove-col" data-remove-col="${col.id}" title="Remove column">&times;</span>
      </div>
    </th>`;
  });
  html += `<th style="width:190px;">Actions</th>`;
  headRow.innerHTML = html;

  headRow.querySelectorAll('[data-label]').forEach(el => {
    el.addEventListener('keydown', (e) => { if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
    el.addEventListener('blur', () => {
      const key = el.getAttribute('data-label');
      data.labels[key] = el.textContent.trim() || data.labels[key];
      scheduleSave(); render();
    });
  });
  headRow.querySelectorAll('[data-custom-label]').forEach(el => {
    el.addEventListener('keydown', (e) => { if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
    el.addEventListener('blur', () => {
      const colId = el.getAttribute('data-custom-label');
      const col = data.customColumns.find(c => c.id === colId);
      if(col){ col.label = el.textContent.trim() || col.label; scheduleSave(); render(); }
    });
  });
  headRow.querySelectorAll('[data-remove-col]').forEach(el => {
    el.addEventListener('click', () => {
      const colId = el.getAttribute('data-remove-col');
      if(confirm('Remove this column? This deletes its values for every ticket in every project.')){
        data.customColumns = data.customColumns.filter(c => c.id !== colId);
        data.projects.forEach(p => p.sprints.forEach(s => s.rows.forEach(r => { delete r.custom[colId]; })));
        render(); scheduleSave();
      }
    });
  });
}

function buildSelect(field, current, options){
  const currentOpt = options.find(o => o.v === current) || options[0];
  let html = `<select class="cell-select ${currentOpt.cls}" data-field="${field}">`;
  options.forEach(o => { html += `<option value="${o.v}" ${o.v===current?'selected':''}>${o.label}</option>`; });
  html += `</select>`;
  return html;
}
function buildProgressSteps(currentStage){
  const idx = STAGE_OPTIONS.findIndex(o => o.v === currentStage);
  return `<div class="progress-steps">` + STAGE_OPTIONS.map((o, i) => {
    let cls = '';
    if(i < idx) cls = 'done'; else if(i === idx) cls = 'current';
    return `<span class="pstep ${cls}" data-pstep="${o.v}" title="Set stage to ${o.label}">${o.v}</span>`;
  }).join('') + `</div>`;
}

function renderBody(sprint){
  const tbody = document.getElementById(`body-${sprint.id}`);
  if(!tbody) return;
  const vis = data.columnVisibility;
  const proj = getActiveProject();

  if(sprint.rows.length === 0){
    tbody.innerHTML = `<tr class="empty-tasks-row"><td colspan="${colCount()}">No tickets in this sprint yet — click "+ Ticket" above.</td></tr>`;
    return;
  }

  tbody.innerHTML = '';
  sprint.rows.forEach((row, idx) => {
    const tr = document.createElement('tr');
    tr.dataset.rowId = row.id;
    if(!rowMatchesFilter(row)) tr.classList.add('row-hidden');

    const orderTd = document.createElement('td');
    orderTd.className = 'order-cell';
    orderTd.innerHTML = `
      <div class="ticket-no-row">
        <span class="ticket-hash">#</span>
        <input type="text" class="ticket-no-input" data-field="ticketNo" value="${escapeHtml(String(row.ticketNo))}" title="Ticket number (editable)">
      </div>
      <span class="order-btns">
        <button class="icon-btn" data-action="up" ${idx===0?'disabled':''} title="Move up">&uarr;</button>
        <button class="icon-btn" data-action="down" ${idx===sprint.rows.length-1?'disabled':''} title="Move down">&darr;</button>
      </span>
    `;
    tr.appendChild(orderTd);

    const taskTd = document.createElement('td');
    taskTd.innerHTML = `<input type="text" class="cell-input task-name" data-field="task" value="${escapeHtml(row.task)}" placeholder="Ticket subject">`;
    tr.appendChild(taskTd);

    const prioTd = document.createElement('td');
    prioTd.innerHTML = buildSelect('priority', row.priority, PRIORITY_OPTIONS);
    tr.appendChild(prioTd);

    if(vis.assignee){
      const assigneeTd = document.createElement('td');
      assigneeTd.innerHTML = `<input type="text" class="cell-input assignee-field" data-field="assignee" value="${escapeHtml(row.assignee)}" placeholder="Unassigned">`;
      tr.appendChild(assigneeTd);
    }

    if(vis.receivedDate){
      const recTd = document.createElement('td');
      recTd.className = 'date-field';
      recTd.innerHTML = `<input type="date" class="cell-input" data-field="receivedDate" value="${row.receivedDate || ''}">`;
      tr.appendChild(recTd);
    }

    const stageTd = document.createElement('td');
    stageTd.innerHTML = buildSelect('stage', row.stage, STAGE_OPTIONS);
    tr.appendChild(stageTd);

    const stepsTd = document.createElement('td');
    stepsTd.innerHTML = buildProgressSteps(row.stage);
    tr.appendChild(stepsTd);

    const dateTd = document.createElement('td');
    dateTd.className = 'date-field';
    let oldRow = '', noteRow = '', arrow = '';
    if(row.deliveryHistory){
      oldRow = `<div class="date-old-row"><span class="old">${fmtDate(row.deliveryHistory.old)}</span></div>`;
      arrow = `<span class="revise-arrow">&#8618;</span>`;
      noteRow = `<div class="date-note-row">
        <span class="note" contenteditable="true" spellcheck="false" data-placeholder="Add a reason..." data-note-for="${row.id}">${escapeHtml(row.deliveryHistory.note || '')}</span>
        <span class="clear-history" data-clear-history="${row.id}" title="Remove old date">&times;</span>
      </div>`;
    }
    dateTd.innerHTML = `
      ${oldRow}
      <div class="date-input-row">
        ${arrow}
        <input type="date" class="cell-input" data-field="delivery" value="${row.delivery || ''}">
        ${row.delivery ? `<span class="clear-date" data-clear-date="${row.id}" title="Clear delivery date">&times;</span>` : ''}
      </div>
      ${noteRow}`;
    tr.appendChild(dateTd);

    if(vis.effort){
      const effortTd = document.createElement('td');
      effortTd.innerHTML = `<div class="effort-row"><input type="number" min="0" class="cell-input" data-field="effort" value="${escapeHtml(row.effort)}"><span class="unit">d</span></div>`;
      tr.appendChild(effortTd);
    }

    const tsTd = document.createElement('td');
    tsTd.innerHTML = buildSelect('trackerStatus', row.trackerStatus, TRACKER_STATUS_OPTIONS);
    tr.appendChild(tsTd);

    if(vis.highlight){
      const hlTd = document.createElement('td');
      const ragCls = row.highlight ? `rag-${row.highlight}` : '';
      hlTd.innerHTML = `<span class="rag-dot ${ragCls}" data-rag="${row.id}" title="Click to change RAG status">${row.highlight ? '' : '—'}</span>`;
      tr.appendChild(hlTd);
    }

    if(vis.blocker){
      const blockerTd = document.createElement('td');
      blockerTd.className = 'blocker-field';
      blockerTd.innerHTML = `<textarea class="cell-input ${row.blocker ? 'has-value' : ''}" data-field="blocker" placeholder="—">${escapeHtml(row.blocker)}</textarea>`;
      tr.appendChild(blockerTd);
    }

    if(vis.comment){
      const commentTd = document.createElement('td');
      commentTd.innerHTML = `<textarea class="cell-input" data-field="comment">${escapeHtml(row.comment)}</textarea>`;
      tr.appendChild(commentTd);
    }

    data.customColumns.forEach(col => {
      const td = document.createElement('td');
      const val = row.custom[col.id] || '';
      td.innerHTML = `<input type="text" class="cell-input" data-custom-col="${col.id}" value="${escapeHtml(val)}">`;
      tr.appendChild(td);
    });

    const actionsTd = document.createElement('td');
    let moveOptions = `<option value="">Move to…</option>`;
    proj.sprints.forEach(s => {
      if(s.id !== sprint.id) moveOptions += `<option value="${s.id}">${escapeHtml(s.name)}</option>`;
    });
    actionsTd.innerHTML = `
      <span class="row-actions">
        <button class="icon-btn" data-action="duplicate" title="Duplicate ticket">&#10064;</button>
        <select class="move-select" data-move-select title="Move to another sprint">${moveOptions}</select>
        <button class="icon-btn delete" data-action="delete" title="Delete ticket">&#10005;</button>
      </span>
    `;
    tr.appendChild(actionsTd);

    tbody.appendChild(tr);
  });

  attachRowEvents(sprint, tbody);
}

function attachRowEvents(sprint, tbody){
  tbody.querySelectorAll('tr').forEach(tr => {
    const rowId = tr.dataset.rowId;
    const row = sprint.rows.find(r => r.id === rowId);
    if(!row) return;

    tr.querySelectorAll('textarea.cell-input').forEach(ta => {
      autoGrow(ta);
      ta.addEventListener('input', () => autoGrow(ta));
    });

    tr.querySelectorAll('[data-field]').forEach(input => {
      const field = input.getAttribute('data-field');
      if(field === 'delivery'){
        input.addEventListener('change', () => {
          const oldVal = row.delivery;
          const newVal = input.value;
          if(oldVal && oldVal !== newVal){ row.deliveryHistory = { old: oldVal, note: '' }; }
          row.delivery = newVal;
          scheduleSave(); renderBody(sprint);
        });
        return;
      }
      if(input.tagName === 'SELECT'){
        input.addEventListener('change', () => {
          if(field === 'stage'){ setRowStage(row, input.value); }
          else { row[field] = input.value; }
          scheduleSave(); renderBody(sprint); renderStats();
        });
      } else {
        input.addEventListener('input', () => {
          row[field] = input.value; scheduleSave();
          if(field === 'blocker') input.classList.toggle('has-value', !!input.value);
        });
      }
    });

    tr.querySelectorAll('[data-pstep]').forEach(el => {
      el.addEventListener('click', () => {
        setRowStage(row, el.getAttribute('data-pstep'));
        scheduleSave(); renderBody(sprint); renderStats();
      });
    });

    tr.querySelectorAll('[data-rag]').forEach(el => {
      el.addEventListener('click', () => {
        const cur = RAG_CYCLE.indexOf(row.highlight);
        row.highlight = RAG_CYCLE[(cur + 1) % RAG_CYCLE.length];
        scheduleSave(); renderBody(sprint);
      });
    });

    tr.querySelectorAll('[data-note-for]').forEach(el => {
      el.addEventListener('input', () => {
        if(row.deliveryHistory){ row.deliveryHistory.note = el.textContent; scheduleSave(); }
      });
    });

    tr.querySelectorAll('[data-clear-history]').forEach(el => {
      el.addEventListener('click', () => { row.deliveryHistory = null; scheduleSave(); renderBody(sprint); });
    });

    tr.querySelectorAll('[data-clear-date]').forEach(el => {
      el.addEventListener('click', () => {
        row.delivery = ''; row.deliveryHistory = null; scheduleSave(); renderBody(sprint);
      });
    });

    tr.querySelectorAll('[data-custom-col]').forEach(input => {
      const colId = input.getAttribute('data-custom-col');
      input.addEventListener('input', () => { row.custom[colId] = input.value; scheduleSave(); });
    });

    tr.querySelectorAll('[data-action]').forEach(btn => {
      const action = btn.getAttribute('data-action');
      btn.addEventListener('click', () => {
        const idx = sprint.rows.findIndex(r => r.id === rowId);
        if(action === 'up' && idx > 0){
          [sprint.rows[idx-1], sprint.rows[idx]] = [sprint.rows[idx], sprint.rows[idx-1]];
        } else if(action === 'down' && idx < sprint.rows.length - 1){
          [sprint.rows[idx+1], sprint.rows[idx]] = [sprint.rows[idx], sprint.rows[idx+1]];
        } else if(action === 'delete'){
          if(confirm('Delete this ticket?')) sprint.rows.splice(idx, 1);
        } else if(action === 'duplicate'){
          const clone = JSON.parse(JSON.stringify(row));
          clone.id = uid('row');
          clone.ticketNo = data.nextTicketNo++;
          clone.stageHistory = [{ stage: clone.stage, at: new Date().toISOString() }];
          sprint.rows.splice(idx + 1, 0, clone);
        }
        renderSprints(); renderStats(); scheduleSave();
      });
    });

    tr.querySelectorAll('[data-move-select]').forEach(sel => {
      sel.addEventListener('change', () => {
        const targetSprintId = sel.value;
        if(!targetSprintId) return;
        const proj = getActiveProject();
        const targetSprint = proj.sprints.find(s => s.id === targetSprintId);
        if(!targetSprint) return;
        const idx = sprint.rows.findIndex(r => r.id === rowId);
        if(idx === -1) return;
        const [movedRow] = sprint.rows.splice(idx, 1);
        targetSprint.rows.push(movedRow);
        renderSprints(); scheduleSave();
      });
    });
  });
}

function attachSprintHeaderEvents(){
  document.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sprint = findSprintInActive(btn.getAttribute('data-toggle'));
      if(sprint){ sprint.collapsed = !sprint.collapsed; renderSprints(); scheduleSave(); }
    });
  });
  document.querySelectorAll('[data-sprint-name]').forEach(el => {
    el.addEventListener('keydown', (e) => { if(e.key==='Enter'){ e.preventDefault(); el.blur(); } });
    el.addEventListener('blur', () => {
      const sprint = findSprintInActive(el.getAttribute('data-sprint-name'));
      if(sprint){ sprint.name = el.textContent.trim() || 'Untitled sprint'; scheduleSave(); }
    });
  });
  document.querySelectorAll('[data-add-task]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sprint = findSprintInActive(btn.getAttribute('data-add-task'));
      if(sprint){
        sprint.rows.push(newRow(data.nextTicketNo++));
        renderSprints(); renderStats(); scheduleSave();
        const inputs = document.querySelectorAll(`#body-${sprint.id} .task-name`);
        if(inputs.length) inputs[inputs.length-1].focus();
      }
    });
  });
  document.querySelectorAll('[data-delete-sprint]').forEach(btn => {
    btn.addEventListener('click', () => {
      const proj = getActiveProject();
      const sprintId = btn.getAttribute('data-delete-sprint');
      const sprint = proj.sprints.find(s => s.id === sprintId);
      if(sprint && confirm(`Delete sprint "${sprint.name}" and all its tickets?`)){
        proj.sprints = proj.sprints.filter(s => s.id !== sprintId);
        renderSprints(); renderStats(); scheduleSave();
      }
    });
  });
}

/* ---------------- Timeline view ---------------- */
function renderTimelineView(){
  const container = document.getElementById('timelineContainer');
  const proj = getActiveProject();
  const rows = allRowsInActive();

  const stageAgg = {}; STAGE_OPTIONS.forEach(o => stageAgg[o.v] = {sum:0,count:0});
  rows.forEach(row => {
    stageDurations(row).forEach(seg => {
      if(!seg.ongoing && stageAgg[seg.stage]){ stageAgg[seg.stage].sum += seg.days; stageAgg[seg.stage].count++; }
    });
  });
  const avgs = STAGE_OPTIONS.map(o => stageAgg[o.v].count ? stageAgg[o.v].sum/stageAgg[o.v].count : 0);
  const maxAvg = Math.max(1, ...avgs);

  let html = `
    <div class="view-header">
      <div><h2>Stage Timeline — ${escapeHtml(proj.name)}</h2><p class="view-sub">How long tickets are spending in each stage (BR → DSN → DEV → UAT → PROD)</p></div>
    </div>
    <div class="view-note">⏱ Stage tracking starts the moment this feature was turned on — tickets that were already sitting in a stage before today show that stage as freshly entered. From now on every stage change is timestamped automatically, so durations become accurate going forward.</div>
    <div class="panel-card">
      <h3>Average time per stage (completed transitions only)</h3>
      ${STAGE_OPTIONS.map((o,i) => {
        const agg = stageAgg[o.v];
        const avg = avgs[i];
        const pct = maxAvg ? (avg/maxAvg*100) : 0;
        return `<div class="tl-avg-row">
          <div class="tl-avg-label">${o.label}</div>
          <div class="tl-avg-track"><div class="tl-avg-fill" style="width:${pct}%;background:${stageColor(o.v)}"></div></div>
          <div class="tl-avg-days">${agg.count ? fmtDays(avg) : '—'}</div>
        </div>`;
      }).join('')}
    </div>
    <div class="panel-card">
      <h3>Per-ticket breakdown</h3>
      <div class="tl-legend">${STAGE_OPTIONS.map(o => `<div class="tl-legend-item"><span class="tl-legend-swatch" style="background:${stageColor(o.v)}"></span>${o.label}</div>`).join('')}</div>
      ${rows.length === 0 ? `<div class="empty-sprint">No tickets in this project yet.</div>` : rows.map(row => {
        const segs = stageDurations(row);
        const total = segs.reduce((s,seg)=>s+seg.days,0) || 0.0001;
        return `<div class="tl-row">
          <div class="tl-row-name" title="${escapeHtml(row.task)}">#${row.ticketNo} ${escapeHtml(row.task || 'Untitled')}</div>
          <div class="tl-row-bar">${segs.map(seg => `<div class="tl-seg ${seg.ongoing?'ongoing':''}" style="width:${(seg.days/total*100)}%;background:${stageColor(seg.stage)}" title="${seg.stage}: ${fmtDays(seg.days)}${seg.ongoing?' (ongoing)':''}"></div>`).join('')}</div>
          <div class="tl-row-total">${fmtDays(total)}</div>
        </div>`;
      }).join('')}
    </div>
  `;
  container.innerHTML = html;
}

/* ---------------- SLA view ---------------- */
function renderSLAView(){
  const container = document.getElementById('slaContainer');
  const proj = getActiveProject();
  const rows = allRowsInActive();
  const sla = proj.slaTargets;

  const buckets = {ok:[], risk:[], breach:[]};
  rows.forEach(row => {
    const days = currentStageDays(row);
    const target = sla[row.stage] != null ? sla[row.stage] : 5;
    if(days <= target) buckets.ok.push(row);
    else if(days <= target*1.5) buckets.risk.push(row);
    else buckets.breach.push(row);
  });
  const total = rows.length || 1;
  const okPct = buckets.ok.length/total*100;
  const riskPct = buckets.risk.length/total*100;
  const gradient = `conic-gradient(#22C55E 0 ${okPct}%, #F59E0B ${okPct}% ${okPct+riskPct}%, #EF4444 ${okPct+riskPct}% 100%)`;

  let html = `
    <div class="view-header">
      <div><h2>SLA Analysis — ${escapeHtml(proj.name)}</h2><p class="view-sub">Time spent in the current stage vs. each stage's target</p></div>
    </div>
    <div class="view-note">🎯 A ticket is "At Risk" once it passes its stage's target, and "Breached" past 1.5× the target. Adjust targets (in days) below — they apply to this project.</div>
    <div class="panel-card">
      <h3>SLA targets per stage (days)</h3>
      <div class="sla-targets">
        ${STAGE_OPTIONS.map(o => `<div class="sla-target-item"><label>${o.v}</label><input type="number" min="0" step="0.5" data-sla-stage="${o.v}" value="${sla[o.v]}"></div>`).join('')}
      </div>
    </div>
    <div class="panel-card">
      <div class="sla-flex">
        <div class="donut-wrap">
          <div class="donut" style="background:${rows.length ? gradient : '#EEF0F3'}"><div class="donut-center"><div class="num">${rows.length}</div><div class="lbl">tickets</div></div></div>
          <div class="donut-legend">
            <div class="donut-legend-item"><span class="donut-legend-swatch" style="background:#22C55E"></span>On Track<span class="donut-legend-count">${buckets.ok.length}</span></div>
            <div class="donut-legend-item"><span class="donut-legend-swatch" style="background:#F59E0B"></span>At Risk<span class="donut-legend-count">${buckets.risk.length}</span></div>
            <div class="donut-legend-item"><span class="donut-legend-swatch" style="background:#EF4444"></span>Breached<span class="donut-legend-count">${buckets.breach.length}</span></div>
          </div>
        </div>
      </div>
    </div>
    <div class="panel-card">
      <h3>At Risk / Breached tickets</h3>
      ${(buckets.risk.length+buckets.breach.length)===0 ? `<div class="empty-sprint">Nothing at risk — every ticket is within its stage's SLA.</div>` : `
      <table class="sla-table">
        <thead><tr><th>#</th><th>Ticket</th><th>Stage</th><th>Days in stage</th><th>Target</th><th>Status</th></tr></thead>
        <tbody>
          ${[...buckets.breach, ...buckets.risk].map(row => {
            const days = currentStageDays(row);
            const target = sla[row.stage] != null ? sla[row.stage] : 5;
            const isBreach = days > target*1.5;
            return `<tr>
              <td>#${row.ticketNo}</td>
              <td>${escapeHtml(row.task || 'Untitled')}</td>
              <td>${row.stage}</td>
              <td>${fmtDays(days)}</td>
              <td>${target}d</td>
              <td><span class="sla-badge ${isBreach?'breach':'risk'}">${isBreach?'Breached':'At Risk'}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`}
    </div>
  `;
  container.innerHTML = html;

  container.querySelectorAll('[data-sla-stage]').forEach(input => {
    input.addEventListener('change', () => {
      const stage = input.getAttribute('data-sla-stage');
      const val = parseFloat(input.value);
      proj.slaTargets[stage] = isNaN(val) ? proj.slaTargets[stage] : val;
      scheduleSave(); renderSLAView();
    });
  });
}

/* ---------------- Resources view ---------------- */
function renderResourcesView(){
  const container = document.getElementById('resourcesContainer');
  const proj = getActiveProject();
  if(!proj.sprints.find(s => s.id === resourcesSelectedSprintId)){
    resourcesSelectedSprintId = proj.sprints.length ? proj.sprints[proj.sprints.length-1].id : null;
  }
  const sprint = proj.sprints.find(s => s.id === resourcesSelectedSprintId);

  const demandByName = {};
  if(sprint){
    sprint.rows.forEach(row => {
      const name = (row.assignee || '').trim();
      if(!name) return;
      demandByName[name] = (demandByName[name] || 0) + (parseFloat(row.effort) || 0);
    });
  }
  const totalCapacity = proj.team.reduce((s,m) => s + (parseFloat(m.capacity) || 0), 0);
  const totalDemand = Object.values(demandByName).reduce((s,v) => s+v, 0);
  const unmatched = Object.keys(demandByName).filter(n => !proj.team.find(m => m.name.trim().toLowerCase() === n.toLowerCase()));

  let html = `
    <div class="view-header">
      <div><h2>Resources — ${escapeHtml(proj.name)}</h2><p class="view-sub">Team capacity vs. ticket effort, per sprint</p></div>
    </div>
    <div class="res-toolbar">
      <label style="font-size:12.5px;font-weight:600;color:var(--sub);">Sprint:</label>
      <select id="resSprintSelect">
        ${proj.sprints.map(s => `<option value="${s.id}" ${s.id===resourcesSelectedSprintId?'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
      </select>
      <span style="margin-left:auto;font-size:12px;color:var(--sub);font-family:'IBM Plex Mono',monospace;">
        Total capacity: <b>${totalCapacity}d</b> &nbsp;·&nbsp; Total demand: <b style="color:${totalDemand>totalCapacity?'var(--danger)':'var(--ink)'}">${totalDemand}d</b>
      </span>
    </div>
    <div class="panel-card">
      <h3>Capacity vs. demand this sprint</h3>
      ${proj.team.length===0 ? `<div class="empty-sprint">No team members added yet — add your roster below.</div>` : proj.team.map(m => {
        const demand = demandByName[Object.keys(demandByName).find(n => n.toLowerCase()===m.name.trim().toLowerCase())] || 0;
        const cap = parseFloat(m.capacity) || 0;
        const pct = cap>0 ? Math.min(100, demand/cap*100) : (demand>0?100:0);
        const over = cap>0 && demand>cap;
        return `<div class="cap-row">
          <div class="cap-name">${escapeHtml(m.name)}<br><span class="cap-role">${escapeHtml(m.role||'')}</span></div>
          <div class="cap-track"><div class="cap-fill ${over?'over':''}" style="width:${pct}%"></div></div>
          <div class="cap-nums ${over?'over':''}">${demand}d / ${cap}d</div>
        </div>`;
      }).join('')}
      ${unmatched.length ? `<div class="view-note" style="margin-top:12px;">Assignees with tickets in this sprint but not on the roster: ${unmatched.map(escapeHtml).join(', ')} — add them below so their workload counts.</div>` : ''}
    </div>
    <div class="panel-card">
      <h3>Team roster &nbsp;<button class="btn" id="addMemberBtn" style="padding:5px 10px;font-size:11.5px;">+ Add person</button></h3>
      <table class="team-table">
        <thead><tr><th>Name</th><th>Role</th><th>Capacity (days/sprint)</th><th></th></tr></thead>
        <tbody>
          ${proj.team.map(m => `<tr data-member-id="${m.id}">
            <td><input type="text" data-member-field="name" value="${escapeHtml(m.name)}" placeholder="Name"></td>
            <td><input type="text" data-member-field="role" value="${escapeHtml(m.role)}" placeholder="Role"></td>
            <td><input type="number" min="0" data-member-field="capacity" value="${m.capacity}"></td>
            <td><button class="icon-btn delete" data-remove-member="${m.id}" title="Remove">&#10005;</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
  container.innerHTML = html;

  const sel = document.getElementById('resSprintSelect');
  if(sel) sel.addEventListener('change', () => { resourcesSelectedSprintId = sel.value; renderResourcesView(); });

  container.querySelectorAll('[data-member-field]').forEach(input => {
    input.addEventListener('input', () => {
      const tr = input.closest('[data-member-id]');
      const member = proj.team.find(m => m.id === tr.getAttribute('data-member-id'));
      if(!member) return;
      const field = input.getAttribute('data-member-field');
      member[field] = field === 'capacity' ? (parseFloat(input.value) || 0) : input.value;
      scheduleSave();
    });
    input.addEventListener('blur', () => renderResourcesView());
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter'){ e.preventDefault(); input.blur(); } });
  });
  container.querySelectorAll('[data-remove-member]').forEach(btn => {
    btn.addEventListener('click', () => {
      if(confirm('Remove this person from the roster?')){
        proj.team = proj.team.filter(m => m.id !== btn.getAttribute('data-remove-member'));
        scheduleSave(); renderResourcesView();
      }
    });
  });
  const addBtn = document.getElementById('addMemberBtn');
  if(addBtn) addBtn.addEventListener('click', () => {
    proj.team.push(teamMember('New person', '', 10));
    scheduleSave(); renderResourcesView();
    const inputs = container.querySelectorAll('[data-member-field="name"]');
    if(inputs.length){ inputs[inputs.length-1].focus(); inputs[inputs.length-1].select(); }
  });
}

/* ---------------- Gantt view ---------------- */
function renderGanttView(){
  const container = document.getElementById('ganttContainer');
  const proj = getActiveProject();

  const sprintsWithDates = proj.sprints.filter(s => s.startDate && s.endDate);
  let minDate, maxDate;
  if(sprintsWithDates.length){
    minDate = new Date(Math.min(...sprintsWithDates.map(s => new Date(s.startDate).getTime())));
    maxDate = new Date(Math.max(...sprintsWithDates.map(s => new Date(s.endDate).getTime())));
  } else {
    minDate = new Date(); maxDate = new Date(Date.now() + 30*86400000);
  }
  minDate = new Date(minDate.getTime() - 2*86400000);
  maxDate = new Date(maxDate.getTime() + 2*86400000);
  const rangeMs = Math.max(1, maxDate - minDate);
  function pctOf(dateStr){
    const d = new Date(dateStr);
    return Math.max(0, Math.min(100, (d - minDate) / rangeMs * 100));
  }
  const midDate = new Date((minDate.getTime() + maxDate.getTime()) / 2);

  let html = `
    <div class="view-header">
      <div><h2>Gantt — ${escapeHtml(proj.name)}</h2><p class="view-sub">Sprint timeline — set each sprint's start and end date to place it on the chart</p></div>
    </div>
  `;
  if(proj.sprints.length === 0){
    html += `<div class="panel-card"><div class="gantt-empty">No sprints in this project yet.</div></div>`;
  } else {
    html += `<div class="panel-card"><div class="gantt-scroll"><div class="gantt-grid">`;
    html += `<div class="gantt-axis"><span>${fmtDate(minDate.toISOString().slice(0,10))}</span><span style="text-align:center;">${fmtDate(midDate.toISOString().slice(0,10))}</span><span style="text-align:right;">${fmtDate(maxDate.toISOString().slice(0,10))}</span></div>`;
    proj.sprints.forEach(sprint => {
      let bar = '';
      if(sprint.startDate && sprint.endDate){
        const startPct = pctOf(sprint.startDate);
        const endPct = pctOf(sprint.endDate);
        if(endPct > startPct){
          bar = `<div class="gantt-bar" style="left:${startPct}%;width:${endPct-startPct}%;" title="${escapeHtml(sprint.name)}: ${fmtDate(sprint.startDate)} – ${fmtDate(sprint.endDate)}">${escapeHtml(sprint.name)}</div>`;
        }
      }
      html += `<div class="gantt-row">
        <div class="gantt-row-label">${escapeHtml(sprint.name)}</div>
        <div class="gantt-track">${bar}</div>
        <div class="gantt-dates">
          <input type="date" data-gantt-sprint="${sprint.id}" data-gantt-field="startDate" value="${sprint.startDate||''}">
          <span style="color:var(--faint);font-size:11px;">to</span>
          <input type="date" data-gantt-sprint="${sprint.id}" data-gantt-field="endDate" value="${sprint.endDate||''}">
        </div>
      </div>`;
    });
    html += `</div></div></div>`;
  }
  container.innerHTML = html;

  container.querySelectorAll('[data-gantt-sprint]').forEach(input => {
    input.addEventListener('change', () => {
      const sprint = proj.sprints.find(s => s.id === input.getAttribute('data-gantt-sprint'));
      if(!sprint) return;
      sprint[input.getAttribute('data-gantt-field')] = input.value;
      scheduleSave(); renderGanttView();
    });
  });
}

/* ---------------- columns visibility popover ---------------- */
document.getElementById('columnsBtn').addEventListener('click', (e) => {
  const existing = document.getElementById('columnsPopover');
  if(existing){ existing.remove(); return; }
  const btn = e.currentTarget;
  const rect = btn.getBoundingClientRect();
  const pop = document.createElement('div');
  pop.className = 'columns-popover';
  pop.id = 'columnsPopover';
  pop.style.top = (rect.bottom + window.scrollY + 6) + 'px';
  pop.style.left = Math.max(8, rect.right - 200 + window.scrollX) + 'px';
  const vis = data.columnVisibility;
  const items = [
    ['assignee','Assignee'], ['receivedDate','Received Date'], ['effort','Effort (days)'], ['highlight','Highlight / RAG'],
    ['blocker','Blocker'], ['comment','Comment']
  ];
  pop.innerHTML = `<div class="cp-title">Show columns</div>` + items.map(([key,label]) => `
    <label><input type="checkbox" data-col-vis="${key}" ${vis[key] ? 'checked' : ''}> ${label}</label>
  `).join('');
  document.body.appendChild(pop);
  pop.querySelectorAll('[data-col-vis]').forEach(cb => {
    cb.addEventListener('change', () => {
      data.columnVisibility[cb.getAttribute('data-col-vis')] = cb.checked;
      renderSprints(); scheduleSave();
    });
  });
  setTimeout(() => {
    document.addEventListener('click', function closePop(ev){
      if(!pop.contains(ev.target) && ev.target !== btn){ pop.remove(); document.removeEventListener('click', closePop); }
    });
  }, 0);
});

/* ---------------- export / import ---------------- */
function closeModal(){ const overlay = document.getElementById('modalOverlay'); if(overlay) overlay.remove(); }
function showModal({title, description, value, readOnly, primaryLabel, onPrimary}){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay'; overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>${escapeHtml(title)}</h3>
      <p>${escapeHtml(description)}</p>
      <textarea ${readOnly ? 'readonly' : ''} spellcheck="false"></textarea>
      <div class="modal-actions">
        <button class="btn" id="modalCancel">Cancel</button>
        <button class="btn primary" id="modalPrimary">${escapeHtml(primaryLabel)}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const ta = overlay.querySelector('textarea');
  ta.value = value;
  if(readOnly){ ta.focus(); ta.select(); }
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeModal(); });
  overlay.querySelector('#modalCancel').addEventListener('click', closeModal);
  overlay.querySelector('#modalPrimary').addEventListener('click', () => onPrimary(ta));
}
function showExportModal(){
  const text = JSON.stringify(data, null, 2);
  showModal({
    title:'Export data', description:'This is your full dashboard data as text. Select all and copy it somewhere safe, or use the button below.',
    value:text, readOnly:true, primaryLabel:'Copy to clipboard',
    onPrimary: async (ta) => {
      try{ await navigator.clipboard.writeText(text); }catch(e){ ta.select(); document.execCommand('copy'); }
      const btn = document.getElementById('modalPrimary'); if(btn) btn.textContent = 'Copied!';
    }
  });
}
function showImportModal(){
  showModal({
    title:'Import data', description:'Paste previously exported data below. This will replace everything currently shown for everyone.',
    value:'', readOnly:false, primaryLabel:'Import',
    onPrimary: (ta) => {
      let parsed;
      try{ parsed = JSON.parse(ta.value); }
      catch(e){ alert("That doesn't look like valid exported data (couldn't be read as JSON). Please check and try again."); return; }
      if(!parsed || !Array.isArray(parsed.projects) || !parsed.projects.length){
        alert("That doesn't look like valid exported data (missing projects). Please check and try again."); return;
      }
      if(!confirm('This will replace all current data for everyone viewing this dashboard. Continue?')) return;
      data = migrateData(parsed);
      render(); scheduleSave(); closeModal();
    }
  });
}
document.getElementById('exportBtn').addEventListener('click', showExportModal);
document.getElementById('importBtn').addEventListener('click', showImportModal);

loadData();

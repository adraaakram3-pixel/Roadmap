const VIEWS = [
  {v:'tickets', label:'Roadmap', icon:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>`},
  {v:'gantt', label:'Gantt', icon:`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h8M8 12h10M6 18h7"/></svg>`},
];
function render(){
  renderBanner(); renderTabs(); renderViewbar(); renderActiveView();
  lastRenderedSignature = JSON.stringify(data);
}
function refreshTickets(){ renderStats(); renderInsights(); renderFilterBar(); renderSprints(); lastRenderedSignature = JSON.stringify(data); }
function renderActiveView(){
  $('#ticketsView').style.display = activeView === 'tickets' ? '' : 'none';
  $('#ganttContainer').style.display = activeView === 'gantt' ? '' : 'none';
  if(activeView === 'tickets') refreshTickets(); else renderGanttView();
}
function renderViewbar(){
  const bar = $('#viewbar');
  bar.innerHTML = VIEWS.map(v => `<button class="${activeView===v.v?'active':''}" data-view="${v.v}">${v.icon}<span class="lbl">${v.label}</span></button>`).join('');
  bar.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { activeView = b.dataset.view; renderViewbar(); renderActiveView(); });
}
function renderBanner(){
  const proj = getActiveProject();
  const iconEl = $('#bannerIcon'), titleEl = $('#bannerTitle'), subEl = $('#bannerSubtitle');
  if(document.activeElement !== iconEl) iconEl.textContent = proj.icon;
  if(document.activeElement !== titleEl) titleEl.textContent = proj.bannerTitle || '';
  if(document.activeElement !== subEl) subEl.textContent = proj.subtitle || '';
  $('#asOf').textContent = `Product roadmap · As of ${fmtDate(todayISO())}`;
  iconEl.oninput = () => { proj.icon = iconEl.textContent.trim().slice(0,4) || '🚀'; scheduleSave(); };
  titleEl.oninput = () => { proj.bannerTitle = titleEl.textContent; scheduleSave(); };
  subEl.oninput = () => { proj.subtitle = subEl.textContent; scheduleSave(); };
  [iconEl, titleEl, subEl].forEach(el => el.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
}
function renderTabs(){
  const bar = $('#tabbar');
  bar.innerHTML = '';
  data.projects.forEach(proj => {
    const tab = document.createElement('div');
    tab.className = 'ptab' + (proj.id === data.activeProjectId ? ' active' : '');
    tab.title = 'Double-click the name to rename';
    tab.innerHTML = `<span class="dot-chip" style="background:${proj.color}"></span><span class="tab-name" spellcheck="false" data-proj-id="${proj.id}">${escapeHtml(proj.name)}</span><span class="remove-tab edit-only" title="Delete project">&times;</span>`;
    const nameEl = tab.querySelector('.tab-name');
    tab.addEventListener('click', e => {
      if(e.target.closest('.remove-tab') || nameEl.isContentEditable) return;
      if(data.activeProjectId !== proj.id){ data.activeProjectId = proj.id; filters = emptyFilters(); render(); }
    });
    nameEl.addEventListener('dblclick', () => {
      if(document.body.classList.contains('present')) return;
      nameEl.contentEditable = 'true'; nameEl.focus(); document.execCommand('selectAll', false, null);
    });
    nameEl.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); nameEl.blur(); } });
    nameEl.addEventListener('blur', () => {
      if(!nameEl.isContentEditable) return;
      nameEl.contentEditable = 'false';
      const v = nameEl.textContent.trim() || 'Untitled project';
      if(v !== proj.name){ proj.name = v; scheduleSave(); }
      render();
    });
    tab.querySelector('.remove-tab').addEventListener('click', e => {
      e.stopPropagation();
      if(data.projects.length <= 1){ toast('You need at least one project'); return; }
      if(confirm(`Delete project "${proj.name}" and all its sprints and tickets?`)){
        data.projects = data.projects.filter(p => p.id !== proj.id);
        if(data.activeProjectId === proj.id) data.activeProjectId = data.projects[0].id;
        render(); scheduleSave();
      }
    });
    bar.appendChild(tab);
  });
  const add = document.createElement('div');
  add.className = 'add-tab edit-only'; add.textContent = '+'; add.title = 'Add project';
  add.onclick = () => {
    const proj = newProject('New project', data.projects.length);
    data.projects.push(proj); data.activeProjectId = proj.id;
    render(); scheduleSave();
    const el = document.querySelector(`.tab-name[data-proj-id="${proj.id}"]`);
    if(el) el.dispatchEvent(new MouseEvent('dblclick'));
  };
  bar.appendChild(add);
}

/* ---------------- KPI cards ---------------- */
function renderStats(){
  const rows = allRowsInActive(), n = rows.length;
  const sc = rows.map(rowSchedule);
  const count = k => sc.filter(s => s.state === k).length;
  const delayed = sc.filter(s => s.state === 'delayed');
  const avgLate = delayed.length ? Math.round(delayed.reduce((a, s) => a + s.lateBy, 0) / delayed.length) : 0;
  const blocked = rows.filter(r => (r.blocker && r.blocker.trim()) || r.trackerStatus === 'Blocked').length;
  const pct = x => n ? Math.round(x / n * 100) : 0;
  const unclassified = delayed.filter(s => !s.reason).length;
  const shipped = sc.filter(s => s.delivered);
  const late = sc.filter(s => s.state === 'late');
  const avgLateShip = late.length ? Math.round(late.reduce((a, s) => a + s.lateBy, 0) / late.length) : 0;
  const shipPct = x => shipped.length ? Math.round(x / shipped.length * 100) : 0;
  // The percentage is shown ONCE (the sub-line under the number); sub2 holds extra context
  const card = (k, label, num, sub, p, color, sub2 = '') => ({k, label, num, sub, sub2, p, color: color || SCHEDULE[k].color});
  const portfolio = k => `${pct(count(k))}% of portfolio`;
  const ofShipped = k => `${shipPct(count(k))}% of shipped`;
  const groups = [
    {title:'Portfolio', cards:[
      card('', 'Total features', n, plural(getActiveProject().sprints.length,'sprint'), 100, '#0B1F44', `${shipped.length} shipped`),
      card('blocked', 'Blocked', blocked, `${pct(blocked)}% of portfolio`, pct(blocked), '#B45309', 'open blockers'),
    ]},
    {title:'In progress — vs. original plan', cards:[
      card('ontrack', 'On track', count('ontrack'), portfolio('ontrack'), pct(count('ontrack'))),
      card('delayed', 'Delayed', count('delayed'), portfolio('delayed'), pct(count('delayed')), null,
        delayed.length ? `avg ${avgLate}d late${unclassified ? ` · ${unclassified} unclassified` : ''}` : ''),
      card('ahead', 'Ahead of plan', count('ahead'), portfolio('ahead'), pct(count('ahead')), null, 'date pulled in'),
    ]},
    {title:`Delivered — ${shipped.length} shipped`, cards:[
      card('early', 'Delivered early', count('early'), ofShipped('early'), shipPct(count('early'))),
      card('ontime', 'Delivered on time', count('ontime'), ofShipped('ontime'), shipPct(count('ontime'))),
      card('late', 'Delivered late', count('late'), ofShipped('late'), shipPct(count('late')), null, late.length ? `avg ${avgLateShip}d late` : ''),
    ]},
  ];
  const el = $('#statsRow');
  el.innerHTML = groups.map(g => `<div class="kpi-group"><div class="kpi-group-h">${escapeHtml(g.title)}</div><div class="kpi-grid" style="--n:${g.cards.length}">${g.cards.map(c => {
    const active = c.k === 'blocked' ? filters.blocked : (c.k && filters.schedule === c.k);
    return `<button class="kpi ${active ? 'active' : ''}" style="--k:${c.color}" data-kpi="${c.k}" title="${c.k ? 'Click to filter' : 'Click to clear filters'}">
      <div class="kpi-label"><span class="kd"></span>${c.label}</div>
      <div class="kpi-num">${c.num}</div>
      <div class="kpi-sub">${escapeHtml(c.sub)}</div>
      <div class="kpi-sub2">${c.sub2 ? escapeHtml(c.sub2) : '&nbsp;'}</div>
      <div class="kpi-bar"><span style="width:${c.p}%"></span></div></button>`;
  }).join('')}</div></div>`).join('');
  el.querySelectorAll('[data-kpi]').forEach(b => b.onclick = () => {
    const k = b.dataset.kpi;
    if(!k){ filters = emptyFilters(); }
    else if(k === 'blocked'){ filters.blocked = !filters.blocked; }
    else { filters.schedule = filters.schedule === k ? '' : k; filters.reason = ''; }
    refreshTickets();
  });
}

/* ---------------- insight cards ---------------- */
function renderInsights(){
  const rows = allRowsInActive(), n = rows.length;
  const sc = rows.map(rowSchedule);
  // 1. delivery health
  const counts = SCHEDULE_ORDER.map(k => ({k, n: sc.filter(s => s.state === k).length}));
  const health = `<div class="card">
    <div class="card-h"><h3>Delivery health</h3><span class="card-sub">${plural(n,'feature')} · vs. original plan</span></div>
    <div class="health-bar">${n ? counts.filter(c => c.n).map(c => `<div class="health-seg" data-sched="${c.k}" title="${SCHEDULE[c.k].label}: ${c.n}" style="flex-grow:${c.n};background:${SCHEDULE[c.k].color}"></div>`).join('') : ''}</div>
    <div class="legend">${counts.map(c => `<div class="legend-item ${filters.schedule===c.k?'active':''}" data-sched="${c.k}"><span class="sw" style="background:${SCHEDULE[c.k].color}"></span>${SCHEDULE[c.k].label}<b>${c.n}</b><span class="pct">${n ? Math.round(c.n/n*100) : 0}%</span></div>`).join('')}</div>
  </div>`;
  // 2. delay reasons
  const delayed = rows.map((r,i) => ({r, s:sc[i]})).filter(x => SLIPPED(x.s.state));
  const groups = {};
  delayed.forEach(({s}) => { const k = s.reason || 'none'; (groups[k] = groups[k] || {n:0, days:0}); groups[k].n++; groups[k].days += s.lateBy; });
  const list = Object.entries(groups).sort((a,b) => b[1].n - a[1].n || b[1].days - a[1].days);
  const max = Math.max(1, ...list.map(x => x[1].n));
  const reasons = `<div class="card">
    <div class="card-h"><h3>Why features slipped</h3><span class="card-sub">${delayed.length} delayed or late · <button class="link-btn edit-only" id="addReasonBtn" title="Add a new delay reason to the list">+ Add reason</button></span></div>
    ${list.length ? list.map(([k, g]) => { const ri = reasonInfo(k === 'none' ? '' : k); return `
      <div class="reason-row ${filters.reason===k?'active':''}" data-reason-filter="${k}" title="Click to show these features">
        <span class="reason-name" title="${escapeHtml(ri.label)}"><span class="sw" style="background:${ri.color}"></span>${escapeHtml(ri.label)}</span>
        <div class="reason-track"><div class="reason-fill" style="width:${g.n/max*100}%;background:${ri.color}"></div></div>
        <span class="reason-val"><b>${g.n}</b> · ${g.days}d</span></div>`; }).join('')
      : `<div class="empty-insight"><span class="big">✓</span>No delayed or late features</div>`}
  </div>`;
  // 3. pipeline
  const stageCounts = STAGE_OPTIONS.map(o => ({o, n: rows.filter(r => r.stage === o.v).length}));
  const smax = Math.max(1, ...stageCounts.map(x => x.n));
  const pipe = `<div class="card">
    <div class="card-h"><h3>Pipeline by stage</h3><span class="card-sub">click a bar to filter</span></div>
    <div class="pipe">${stageCounts.map(({o, n}) => `<div class="pipe-col ${filters.stage===o.v?'active':''}" data-stage-filter="${o.v}" title="${o.label}: ${n}">
      <span class="pipe-n">${n}</span><div class="pipe-bar" style="height:${Math.max(4, n/smax*90)}px;background:${o.color}"></div><span class="pipe-l">${o.v}</span></div>`).join('')}</div>
  </div>`;
  const el = $('#insights');
  el.innerHTML = health + reasons + pipe;
  el.querySelectorAll('[data-sched]').forEach(x => x.onclick = () => { filters.schedule = filters.schedule === x.dataset.sched ? '' : x.dataset.sched; filters.reason = ''; refreshTickets(); });
  el.querySelectorAll('[data-reason-filter]').forEach(x => x.onclick = () => { const k = x.dataset.reasonFilter; filters.reason = filters.reason === k ? '' : k; filters.schedule = ''; refreshTickets(); });
  const arb = el.querySelector('#addReasonBtn');
  if(arb) arb.onclick = e => { e.stopPropagation(); askCustomReason(id => { if(id){ toast(`Added “${reasonInfo(id).label}” to the reason list`); refreshTickets(); } }, 'Add a delay reason', 'It will appear in every reason list and in this chart.'); };
  el.querySelectorAll('[data-stage-filter]').forEach(x => x.onclick = () => { filters.stage = filters.stage === x.dataset.stageFilter ? '' : x.dataset.stageFilter; refreshTickets(); });
}

/* ---------------- filter bar ---------------- */
function renderFilterBar(){
  const rows = allRowsInActive();
  const opt = (v, label, cur) => `<option value="${escapeHtml(v)}" ${cur===v?'selected':''}>${escapeHtml(label)}</option>`;
  const sel = (id, html, val) => { const el = $(id); el.innerHTML = html; el.classList.toggle('set', !!val); return el; };
  sel('#filterSchedule', opt('', 'Status: All', filters.schedule) + SCHEDULE_ORDER.map(k => opt(k, SCHEDULE[k].label, filters.schedule)).join(''), filters.schedule)
    .onchange = e => { filters.schedule = e.target.value; refreshTickets(); };
  sel('#filterReason', opt('', 'Delay reason: All', filters.reason) + allReasons().map(r => opt(r.v, r.label, filters.reason)).join('') + opt('none', 'Unclassified', filters.reason), filters.reason)
    .onchange = e => { filters.reason = e.target.value; refreshTickets(); };
  sel('#filterStage', opt('', 'Stage: All', filters.stage) + STAGE_OPTIONS.map(o => opt(o.v, o.label, filters.stage)).join(''), filters.stage)
    .onchange = e => { filters.stage = e.target.value; refreshTickets(); };
  sel('#filterPriority', opt('', 'Priority: All', filters.priority) + PRIORITY_OPTIONS.map(o => opt(o.v, o.label, filters.priority)).join(''), filters.priority)
    .onchange = e => { filters.priority = e.target.value; refreshTickets(); };
  const assignees = Array.from(new Set(rows.map(r => r.assignee).filter(Boolean))).sort();
  sel('#filterAssignee', opt('', 'Assignee: All', filters.assignee) + assignees.map(a => opt(a, a, filters.assignee)).join(''), filters.assignee)
    .onchange = e => { filters.assignee = e.target.value; refreshTickets(); };
  sel('#filterHighlight', opt('', 'RAG: All', filters.highlight) + [['none','No RAG'],['green','Green'],['amber','Amber'],['red','Red']].map(([v,l]) => opt(v, l, filters.highlight)).join(''), filters.highlight)
    .onchange = e => { filters.highlight = e.target.value; refreshTickets(); };
  const search = $('#searchInput');
  if(search.value !== filters.search) search.value = filters.search;
  search.oninput = () => { filters.search = search.value; renderSprints(); updateFilterCount(); };
  $('#filterClearBtn').style.display = anyFilter() ? '' : 'none';
  $('#filterClearBtn').onclick = () => { filters = emptyFilters(); refreshTickets(); };
  updateFilterCount();
  // history expand/collapse all
  const withHist = rows.filter(r => r.dateChanges.length);
  const anyOpen = withHist.some(r => expandedHistory.has(r.id));
  const hb = $('#historyAllBtn');
  hb.innerHTML = `${ICON.history} ${anyOpen ? 'Hide' : 'Show'} date history`;
  hb.disabled = !withHist.length;
  hb.style.opacity = withHist.length ? '' : '.5';
  hb.onclick = () => { if(anyOpen) expandedHistory.clear(); else withHist.forEach(r => expandedHistory.add(r.id)); renderFilterBar(); renderSprints(); };
}
function updateFilterCount(){
  const rows = allRowsInActive();
  const shown = rows.filter(r => rowMatchesFilter(r)).length;
  $('#filterCount').textContent = anyFilter() ? `${shown} of ${rows.length} shown` : '';
  $('#filterClearBtn').style.display = anyFilter() ? '' : 'none';
}

/* ============================================================
   SPRINT TABLES
   ============================================================ */
function visibleCols(){
  const v = data.columnVisibility, cols = [{k:'no'}, {k:'task'}, {k:'priority'}];
  if(v.assignee) cols.push({k:'assignee'});
  cols.push({k:'stage'}, {k:'delivery'});
  if(v.schedule) cols.push({k:'schedule'});
  if(v.reasons) cols.push({k:'reasons'});
  if(v.effort) cols.push({k:'effort'});
  cols.push({k:'trackerStatus'});
  if(v.highlight) cols.push({k:'highlight'});
  if(v.blocker) cols.push({k:'blocker'});
  if(v.comment) cols.push({k:'comment'});
  data.customColumns.forEach(col => cols.push({k:'custom', col}));
  cols.push({k:'actions'});
  return cols;
}
function headHTML(cols){
  return cols.map(c => {
    if(c.k === 'no') return `<th style="width:92px">#</th>`;
    if(c.k === 'actions') return `<th class="edit-only" style="width:170px">Actions</th>`;
    if(c.k === 'custom') return `<th><div class="col-head"><span class="col-label" contenteditable="true" spellcheck="false" data-custom-label="${c.col.id}">${escapeHtml(c.col.label)}</span><span class="remove-col edit-only" data-remove-col="${c.col.id}" title="Remove column">&times;</span></div></th>`;
    return `<th><span class="col-label" contenteditable="true" spellcheck="false" data-label="${c.k}">${escapeHtml(data.labels[c.k])}</span></th>`;
  }).join('');
}
function buildSelect(field, current, options, extraCls = ''){
  const cur = options.find(o => o.v === current) || options[0];
  return `<select class="cell-select ${cur.cls} ${extraCls}" data-field="${field}">` + options.map(o => `<option value="${o.v}" ${o.v===current?'selected':''}>${o.label}</option>`).join('') + `</select>`;
}
// Planned working days per stage, taken from the Gantt chart. A ticket is linked to the Gantt feature
// with the same name (latest "new requirements" line wins). Returns {} when there's no Gantt data.
const normName = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
function ganttDaysFor(row){
  const key = normName(row.task);
  const feats = (getActiveProject().ganttBoard && getActiveProject().ganttBoard.features) || [];
  if(!key || !feats.length) return {};
  const matches = feats.filter(f => normName(f.task) === key);
  const f = matches[matches.length - 1];
  if(!f || !f.gantt) return {};
  const out = {};
  ganttPlanSegments(f.gantt).forEach(seg => { if(seg.type === 'work') out[seg.stage] = (out[seg.stage] || 0) + seg.workingDays; });
  return out;
}
function stepsHTML(row){
  const idx = STAGE_OPTIONS.findIndex(o => o.v === row.stage);
  const cur = STAGE_OPTIONS[idx] || STAGE_OPTIONS[0];
  const plan = ganttDaysFor(row);
  const days = plan[cur.v];
  return `<div class="progress-steps">` + STAGE_OPTIONS.map((o, i) => {
    const cls = i < idx ? 'done' : i === idx ? 'current' : '';
    const pd = plan[o.v] ? ` · ${plural(plan[o.v], 'working day')} planned (Gantt)` : '';
    return `<span class="pstep ${cls}" data-pstep="${o.v}" title="${o.label}${pd}${cls==='current'?' — current':cls==='done'?' — completed':' — click to move here'}">${o.v}</span>`;
  }).join('') + `</div>${days ? `<div class="stage-meta" title="Planned duration from the Gantt chart">${cur.label} · ${plural(days, 'day')}</div>` : ''}`;
}
// Every reason list ends with "Other — type a reason…": picking it asks for free text,
// which is saved as a named reason (so the cell shows the typed text, never "Other").
function reasonOptions(selected, placeholder){
  const list = allReasons().slice();
  if(selected === 'other') list.push(LEGACY_OTHER);
  return `<option value="" ${!selected?'selected':''}>${placeholder}</option>` +
    list.map(r => `<option value="${r.v}" ${selected===r.v?'selected':''}>${escapeHtml(r.label)}</option>`).join('') +
    `<option value="${OTHER_OPTION}">✎ Other — type a reason…</option>`;
}
function askCustomReason(done, title = 'Other reason', sub = 'Type the reason. It will be saved to the reason list so you can reuse it.'){
  const o = openModal(`<h3>${escapeHtml(title)}</h3><p class="m-sub">${escapeHtml(sub)}</p>
    <input id="customReasonInput" class="modal-input" maxlength="60" placeholder="e.g. Waiting for legal approval" autocomplete="off">
    <div class="modal-actions"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mOk">Save reason</button></div>`);
  const inp = o.querySelector('#customReasonInput');
  const ok = () => { const v = inp.value.trim(); if(!v){ inp.focus(); return; } const id = ensureCustomReason(v); closeModal(); scheduleSave(); done(id); };
  o.querySelector('#mOk').onclick = ok;
  o.querySelector('#mCancel').onclick = () => { closeModal(); done(''); };
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); ok(); } });
  setTimeout(() => inp.focus(), 30);
}
function deliveryHTML(r, s){
  const changes = r.dateChanges;
  let h = `<div class="date-cell">${dpHTML(r.delivery, 'data-dp="delivery"', 'st-' + s.state)}`;
  if(changes.length){
    const open = expandedHistory.has(r.id);
    const cls = s.slip > 0 ? 'late' : s.slip < 0 ? 'early' : '';
    h += `<div><button class="hist-toggle ${cls} ${open?'open':''}" data-hist title="${open?'Hide':'Show'} every date change">${ICON.chev}${plural(changes.length,'change')}${s.base && r.delivery ? ` · ${signedDays(s.slip)} vs plan` : ''}</button></div>`;
    if(open){
      const base = baselineOf(r);
      h += `<ol class="hist"><li class="hist-item superseded"><div class="hist-row"><span class="hist-date">${fmtDate(base) || '—'}</span><span class="hist-tag">Original plan</span></div></li>`;
      changes.forEach((c, i) => {
        const sh = (c.from && c.to) ? diffDays(c.from, c.to) : 0;
        const cls2 = sh > 0 ? 'late' : sh < 0 ? 'early' : '';
        const last = i === changes.length - 1;
        h += `<li class="hist-item ${cls2} ${last?'current':'superseded'}">
          <div class="hist-row"><span class="hist-date">${fmtDate(c.to) || '—'}</span><span class="shift ${cls2}">${signedDays(sh)}</span>${c.at ? `<span class="hist-meta">changed ${fmtStamp(c.at)}</span>` : ''}<button class="hist-del edit-only" data-change-del="${c.id}" title="Remove this entry">&times;</button></div>
          <div class="hist-reason-wrap">${reasonPickerHTML(c.reason, 'chg:' + c.id, `data-change-reason="${c.id}"`, sh > 0 ? 'Select delay reason…' : 'Reason (optional)…')}</div>
          <input class="hist-note" data-change-note="${c.id}" placeholder="Note (optional)…" value="${escapeHtml(c.note || '')}">
          ${!c.reason && c.note && c.note.trim() ? `<button type="button" class="link-btn note-to-reason edit-only" data-note-to-reason="${c.id}" title="Save this note as the delay reason">↑ Use note as the reason</button>` : ''}
        </li>`;
      });
      h += `</ol>`;
    }
  } else if(r.delivery){
    h += `<div class="plan-tag">Original plan</div>`;
  }
  return h + `</div>`;
}
function scheduleHTML(r, s){
  const label = k => SCHEDULE[k].label;
  const opts = `<option value="" ${!r.scheduleOverride?'selected':''}>${label(s.auto)}</option>` +
    SCHEDULE_ORDER.filter(k => k !== 'nodate').map(k => `<option value="${k}" ${r.scheduleOverride===k?'selected':''}>✎ ${label(k)}</option>`).join('');
  let meta = '', late = false;
  const d = s.deliveredDelta;
  if(s.state === 'delayed'){
    late = true;
    if(s.overdue > 0) meta = `Overdue by ${s.overdue}d${s.slip > 0 ? ` · slipped ${signedDays(s.slip)}` : ''}`;
    else if(s.slip > 0) meta = `Slipped ${signedDays(s.slip)} vs original plan`;
    else meta = 'Marked delayed';
  } else if(s.state === 'ahead'){
    meta = s.slip < 0 ? `Pulled in ${signedDays(s.slip)} vs original plan` : 'Ahead of plan';
  } else if(s.state === 'ontrack'){
    if(r.delivery){ const dd = diffDays(todayISO(), r.delivery); meta = dd === 0 ? 'Due today' : `Due in ${dd}d`; }
  } else if(s.state === 'late'){
    late = true; meta = d > 0 ? `${d}d after original plan` : 'Shipped late';
  } else if(s.state === 'early'){
    meta = d < 0 ? `${Math.abs(d)}d before original plan` : 'Shipped early';
  } else if(s.state === 'ontime'){
    meta = 'Met the original plan';
  } else meta = 'Add a delivery date';
  let h = `<div class="sched"><select class="cell-select st-${s.state}" data-sched-override title="Calculated automatically against the ORIGINAL plan. Choose an option with ✎ to set it manually.">${opts}</select>`;
  if(meta) h += `<span class="sched-meta ${late?'late':''}">${meta}</span>`;
  return h + `</div>`;
}
// A chosen reason shows as a coloured chip; click it to change. The dropdown only appears when no reason is set.
function reasonPickerHTML(reason, key, attrs, placeholder){
  if(reason && reasonEditKey !== key){
    const ri = reasonInfo(reason);
    return `<button type="button" class="reason-chip" data-edit-reason="${key}" style="--rc:${ri.color}" title="Click to change the reason"><span class="sw"></span>${escapeHtml(ri.label)}</button>`;
  }
  return `<select class="reason-select ${reason ? '' : 'unset'}" ${attrs} data-reason-key="${key}" style="--rc:${reason ? reasonInfo(reason).color : '#F59E0B'}">${reasonOptions(reason, placeholder)}</select>`;
}
// "Delay Reasons" column: every push-out, numbered, oldest first
function reasonsHTML(r, s){
  const items = [];
  r.dateChanges.forEach(c => {
    const sh = (c.from && c.to) ? diffDays(c.from, c.to) : 0;
    if(sh > 0) items.push(`<li><span class="rl-main">${reasonPickerHTML(c.reason, 'chg:' + c.id, `data-change-reason="${c.id}"`, '⚠ Classify…')}</span><span class="shift late">${signedDays(sh)}</span></li>`);
  });
  const changeReasons = r.dateChanges.map(c => c.reason);
  if(r.delayReason && !changeReasons.includes(r.delayReason)){
    items.push(`<li><span class="rl-main">${reasonPickerHTML(r.delayReason, 'row:' + r.id, 'data-delay-reason', '⚠ Classify…')}</span>${s.overdue > 0 ? `<span class="shift late">overdue ${s.overdue}d</span>` : ''}</li>`);
  } else if(SLIPPED(s.state) && !items.length){
    items.push(`<li><span class="rl-main">${reasonPickerHTML('', 'row:' + r.id, 'data-delay-reason', '⚠ Classify…')}</span>${s.overdue > 0 ? `<span class="shift late">overdue ${s.overdue}d</span>` : ''}</li>`);
  }
  return items.length ? `<ol class="reason-list">${items.map((li, i) => li.replace('<li>', `<li><span class="rl-n">${i + 1}.</span>`)).join('')}</ol>` : '';
}
function rowHTML(row, idx, sprint, proj, s, cols){
  const hidden = !rowMatchesFilter(row, s);
  const tds = cols.map(c => {
    switch(c.k){
      case 'no': return `<td class="order-cell" style="--hc:${SCHEDULE[s.state].color}">
          <div class="ticket-no-row"><span class="ticket-hash">#</span><input type="text" class="ticket-no-input" data-field="ticketNo" value="${escapeHtml(String(row.ticketNo))}" title="Ticket number"></div>
          <span class="order-btns edit-only"><button class="icon-btn" data-action="up" ${idx===0?'disabled':''} title="Move up">&uarr;</button><button class="icon-btn" data-action="down" ${idx===sprint.rows.length-1?'disabled':''} title="Move down">&darr;</button></span></td>`;
      case 'task': return `<td><input type="text" class="cell-input task-name" data-field="task" value="${escapeHtml(row.task)}" placeholder="Ticket subject"></td>`;
      case 'priority': return `<td>${buildSelect('priority', row.priority, PRIORITY_OPTIONS)}</td>`;
      case 'assignee': return `<td><input type="text" class="cell-input assignee-field" data-field="assignee" list="teamList" value="${escapeHtml(row.assignee)}" placeholder="Unassigned"></td>`;
      case 'stage': return `<td>${stepsHTML(row)}</td>`;
      case 'delivery': return `<td>${deliveryHTML(row, s)}</td>`;
      case 'schedule': return `<td>${scheduleHTML(row, s)}</td>`;
      case 'effort': return `<td><div class="effort-row"><input type="number" min="0" class="cell-input" data-field="effort" value="${escapeHtml(row.effort)}"><span class="unit">d</span></div></td>`;
      case 'trackerStatus': return `<td>${buildSelect('trackerStatus', row.trackerStatus, TRACKER_STATUS_OPTIONS)}</td>`;
      case 'highlight': return `<td><span class="rag-dot ${row.highlight ? 'rag-' + row.highlight : ''}" data-rag title="RAG: ${row.highlight || 'not set'} — click to change">${row.highlight ? '' : '–'}</span></td>`;
      case 'blocker': return `<td class="blocker-field"><textarea class="cell-input ${row.blocker ? 'has-value' : ''}" data-field="blocker" placeholder="—">${escapeHtml(row.blocker)}</textarea></td>`;
      case 'comment': return `<td class="comment-field"><textarea class="cell-input" data-field="comment">${escapeHtml(row.comment)}</textarea></td>`;
      case 'reasons': return `<td class="reasons-field">${reasonsHTML(row, s)}</td>`;
      case 'custom': return `<td><input type="text" class="cell-input" data-custom-col="${c.col.id}" value="${escapeHtml(row.custom[c.col.id] || '')}"></td>`;
      case 'actions': {
        const moves = proj.sprints.filter(x => x.id !== sprint.id).map(x => `<option value="${x.id}">${escapeHtml(x.name)}</option>`).join('');
        return `<td class="edit-only"><span class="row-actions">
          <button class="icon-btn" data-action="duplicate" title="Duplicate">${ICON.copy}</button>
          ${moves ? `<select class="move-select" data-move-select title="Move to another sprint"><option value="">Move to…</option>${moves}</select>` : ''}
          <button class="icon-btn delete" data-action="delete" title="Delete ticket">${ICON.trash}</button></span></td>`;
      }
    }
  }).join('');
  return `<tr data-row-id="${row.id}" class="${hidden ? 'row-hidden' : ''}">${tds}</tr>`;
}
function sprintHTML(sprint, proj, cols){
  const sc = sprint.rows.map(rowSchedule);
  const n = sprint.rows.length;
  const shipped = sc.filter(s => s.delivered).length;
  const pct = n ? Math.round(shipped / n * 100) : 0;
  const minis = ['ontrack','delayed','ahead','early','ontime','late'].map(k => ({k, c: sc.filter(s => s.state === k).length})).filter(x => x.c);
  const visible = sprint.rows.filter((r, i) => rowMatchesFilter(r, sc[i])).length;
  let body;
  if(!n) body = `<tr class="empty-tasks-row"><td colspan="${cols.length}">No tickets in this sprint yet — click “+ Ticket”.</td></tr>`;
  else body = sprint.rows.map((r, i) => rowHTML(r, i, sprint, proj, sc[i], cols)).join('') +
    (visible === 0 ? `<tr class="empty-tasks-row"><td colspan="${cols.length}">No tickets in this sprint match the current filters.</td></tr>` : '');
  return `<section class="sprint" data-sprint-id="${sprint.id}">
    <div class="sprint-header">
      <button class="collapse-toggle ${sprint.collapsed?'collapsed':''}" data-toggle title="Collapse / expand">${ICON.down}</button>
      <span class="sprint-name" contenteditable="true" spellcheck="false" data-sprint-name>${escapeHtml(sprint.name)}</span>
      <span class="chip-count">${anyFilter() && n ? `${visible}/${n}` : n} ticket${n===1?'':'s'}</span>
      <span class="sprint-health">${minis.map(m => `<span class="mini"><span class="sw" style="background:${SCHEDULE[m.k].color}"></span>${m.c} ${SCHEDULE[m.k].label.toLowerCase()}</span>`).join('')}</span>
      <span class="sprint-progress" title="${shipped} of ${n} shipped"><span class="track"><span style="width:${pct}%"></span></span>${pct}% shipped</span>
      <span class="sprint-actions edit-only">
        <button class="icon-btn" data-add-task title="Add ticket">+ Ticket</button>
        <button class="icon-btn delete" data-delete-sprint title="Delete sprint">${ICON.trash}</button>
      </span>
    </div>
    ${sprint.collapsed ? '' : `<div class="table-scroll"><table><thead><tr>${headHTML(cols)}</tr></thead><tbody>${body}</tbody></table></div>`}
  </section>`;
}
function renderSprints(){
  const sx = window.scrollX, sy = window.scrollY;
  const c = $('#sprintsContainer'), proj = getActiveProject();
  // keep horizontal scroll position of each table
  const hs = {}; c.querySelectorAll('.sprint').forEach(s => { const t = s.querySelector('.table-scroll'); if(t) hs[s.dataset.sprintId] = t.scrollLeft; });
  const names = new Set([...(proj.team || []).map(m => m.name), ...allRowsInActive().map(r => r.assignee)].filter(Boolean));
  $('#teamList').innerHTML = [...names].sort().map(n => `<option value="${escapeHtml(n)}">`).join('');
  if(!proj.sprints.length){
    c.innerHTML = `<div class="empty-state">No sprints yet in “${escapeHtml(proj.name)}”. Click <b>+ Sprint</b> to start.</div>`;
  } else {
    const cols = visibleCols();
    c.innerHTML = proj.sprints.map(s => sprintHTML(s, proj, cols)).join('');
    c.querySelectorAll('.sprint').forEach(s => { const t = s.querySelector('.table-scroll'); if(t && hs[s.dataset.sprintId]) t.scrollLeft = hs[s.dataset.sprintId]; });
    c.querySelectorAll('textarea.cell-input').forEach(autoGrow);
  }
  window.scrollTo(sx, sy);
  updateSticky();
}

/* ---------- frozen navy header: sticks under the nav until the sprint ends ---------- */
let stickyRaf = 0;
function updateSticky(){
  stickyRaf = 0;
  const nav = $('#subnav');
  const navB = nav.getBoundingClientRect().bottom;
  nav.classList.toggle('scrolled', window.scrollY > 120);
  document.querySelectorAll('#sprintsContainer .sprint').forEach(card => {
    const head = card.querySelector('.sprint-header'), table = card.querySelector('table');
    head.classList.toggle('stuck', card.getBoundingClientRect().top < navB - 1);
    if(!table) return;
    const thead = table.tHead, tr = table.getBoundingClientRect();
    const top = navB + head.offsetHeight;
    const off = Math.max(0, Math.min(top - tr.top, tr.height - thead.offsetHeight));
    thead.style.transform = off > 0.5 ? `translate3d(0,${off}px,0)` : '';
    thead.classList.toggle('stuck', off > 0.5);
  });
}
const queueSticky = () => { if(!stickyRaf) stickyRaf = requestAnimationFrame(updateSticky); };
window.addEventListener('scroll', queueSticky, {passive:true});
window.addEventListener('resize', queueSticky);

/* ---------- delivery date change → full history + delay classification ---------- */
function handleDeliveryChange(row, iso){
  const prev = row.delivery || lastKnownDate(row);
  row.delivery = iso;
  if(!iso){ scheduleSave(); refreshTickets(); return; }
  if(!row.baselineDate && !row.dateChanges.length){
    row.baselineDate = iso;          // first date ever set = original plan
    scheduleSave(); refreshTickets(); return;
  }
  if(prev && prev !== iso){
    const ch = { id: uid('chg'), from: prev, to: iso, at: new Date().toISOString(), reason: '', note: '' };
    row.dateChanges.push(ch);
    scheduleSave(); refreshTickets();
    openReasonModal(row, ch);
  } else { scheduleSave(); refreshTickets(); }
}
function openReasonModal(row, ch){
  const sh = diffDays(ch.from, ch.to);
  let chosen = '';
  const o = openModal(`
    <h3>${sh > 0 ? 'Delivery date pushed out' : 'Delivery date pulled in'}</h3>
    <p class="m-sub">#${escapeHtml(row.ticketNo)} · ${escapeHtml(row.task || 'Untitled ticket')}</p>
    <div class="m-shift"><span class="old">${fmtDate(ch.from)}</span><span>→</span><span>${fmtDate(ch.to)}</span><span class="shift ${sh>0?'late':'early'}">${signedDays(sh)}</span></div>
    <div class="m-label">${sh > 0 ? 'Why was it delayed?' : 'Reason (optional)'}</div>
    <div class="chips">${allReasons().map(r => `<button class="chip" data-r="${r.v}" style="--rc:${r.color}"><span class="sw"></span>${escapeHtml(r.label)}</button>`).join('')}<button class="chip" data-r="${OTHER_OPTION}" style="--rc:#475569"><span class="sw"></span>✎ Other…</button></div>
    <input id="otherReason" class="modal-input" maxlength="60" placeholder="Type the reason — e.g. Waiting for legal approval" autocomplete="off" style="display:none;margin-bottom:12px">
    <div class="m-label">Note (optional)</div>
    <textarea id="reasonNote" placeholder="Extra context — e.g. waiting for CMC approval of the API contract"></textarea>
    <div class="modal-actions">
      <button class="btn left" id="mCorrection" title="Use this if you just fixed a typo — it won't be logged as a change">Just a correction</button>
      <button class="btn" id="mLater">Classify later</button>
      <button class="btn primary" id="mSave">Save</button>
    </div>`);
  o.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    chosen = chosen === b.dataset.r ? '' : b.dataset.r;
    o.querySelectorAll('.chip').forEach(x => x.classList.toggle('sel', x.dataset.r === chosen));
    const other = o.querySelector('#otherReason');
    other.style.display = chosen === OTHER_OPTION ? '' : 'none';
    if(chosen === OTHER_OPTION) other.focus();
  });
  o.querySelector('#mSave').onclick = () => {
    if(chosen === OTHER_OPTION){
      const txt = o.querySelector('#otherReason').value.trim();
      if(!txt){ o.querySelector('#otherReason').focus(); toast('Type the reason, or pick another one'); return; }
      chosen = ensureCustomReason(txt);
    }
    if(sh > 0 && !chosen){
      const chips = o.querySelector('.chips');
      chips.classList.remove('need'); void chips.offsetWidth; chips.classList.add('need');
      toast('Pick a reason (or “Other…” to type one) — or choose “Classify later”');
      return;
    }
    ch.reason = chosen; ch.note = o.querySelector('#reasonNote').value.trim();
    closeModal(); scheduleSave(); refreshTickets(); flashRow(row.id);
    toast(chosen ? `Logged: ${reasonInfo(chosen).label}` : 'Date change logged');
  };
  o.querySelector('#mLater').onclick = () => {
    const note = o.querySelector('#reasonNote').value.trim();
    if(note){ ch.note = note; scheduleSave(); refreshTickets(); }
    closeModal(); if(sh > 0) toast('Date change logged — reason marked unclassified');
  };
  o.querySelector('#mCorrection').onclick = () => {
    const i = row.dateChanges.indexOf(ch);
    if(i > -1) row.dateChanges.splice(i, 1);
    const prevCh = row.dateChanges[row.dateChanges.length - 1];
    if(prevCh) prevCh.to = ch.to; else row.baselineDate = ch.to;
    closeModal(); scheduleSave(); refreshTickets(); toast('Date corrected — not logged as a change');
  };
}
function flashRow(id){ const tr = document.querySelector(`tr[data-row-id="${id}"]`); if(tr){ tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash'); } }

/* ---------- delegated events for the sprint tables ---------- */
const sc$ = $('#sprintsContainer');
function ctx(el){
  const tr = el.closest('tr[data-row-id]'), sec = el.closest('.sprint');
  const sprint = sec ? findSprintInActive(sec.dataset.sprintId) : null;
  const row = tr && sprint ? sprint.rows.find(r => r.id === tr.dataset.rowId) : null;
  return { sprint, row, tr };
}
sc$.addEventListener('click', e => {
  const t = e.target;
  const { sprint, row } = ctx(t);
  if(!sprint) return;
  if(t.closest('[data-toggle]')){ sprint.collapsed = !sprint.collapsed; scheduleSave(); renderSprints(); return; }
  if(t.closest('[data-add-task]')){
    const r = newRow(data.nextTicketNo++); sprint.rows.push(r); sprint.collapsed = false;
    scheduleSave(); refreshTickets();
    const inp = document.querySelector(`tr[data-row-id="${r.id}"] .task-name`); if(inp) inp.focus();
    return;
  }
  if(t.closest('[data-delete-sprint]')){
    const proj = getActiveProject(), i = proj.sprints.indexOf(sprint);
    if(sprint.rows.length && !confirm(`Delete sprint "${sprint.name}" and its ${plural(sprint.rows.length,'ticket')}?`)) return;
    proj.sprints.splice(i, 1); scheduleSave(); refreshTickets();
    toast(`Sprint “${sprint.name}” deleted`, 'Undo', () => { getActiveProject().sprints.splice(i, 0, sprint); scheduleSave(); refreshTickets(); }, 7000);
    return;
  }
  if(!row) return;
  const act = t.closest('[data-action]');
  if(act){
    const a = act.dataset.action, idx = sprint.rows.indexOf(row);
    if(a === 'up' && idx > 0) [sprint.rows[idx-1], sprint.rows[idx]] = [sprint.rows[idx], sprint.rows[idx-1]];
    else if(a === 'down' && idx < sprint.rows.length - 1) [sprint.rows[idx+1], sprint.rows[idx]] = [sprint.rows[idx], sprint.rows[idx+1]];
    else if(a === 'duplicate'){
      const clone = JSON.parse(JSON.stringify(row));
      clone.id = uid('row'); clone.ticketNo = data.nextTicketNo++;
      clone.stageHistory = [{ stage: clone.stage, at: new Date().toISOString() }];
      clone.dateChanges.forEach(c => c.id = uid('chg'));
      sprint.rows.splice(idx + 1, 0, clone);
      toast(`Duplicated as #${clone.ticketNo}`);
    } else if(a === 'delete'){
      sprint.rows.splice(idx, 1);
      const sid = sprint.id;
      toast(`Ticket #${row.ticketNo} deleted`, 'Undo', () => { const s = findSprintInActive(sid); if(s){ s.rows.splice(idx, 0, row); scheduleSave(); refreshTickets(); } }, 7000);
    }
    scheduleSave(); refreshTickets(); return;
  }
  const ps = t.closest('[data-pstep]');
  if(ps){ trackDelivery(row, () => setRowStage(row, ps.dataset.pstep)); scheduleSave(); refreshTickets(); return; }
  if(t.closest('[data-rag]')){ row.highlight = RAG_CYCLE[(RAG_CYCLE.indexOf(row.highlight) + 1) % RAG_CYCLE.length]; scheduleSave(); refreshTickets(); return; }
  const er = t.closest('[data-edit-reason]');
  if(er){
    if(document.body.classList.contains('present')) return;
    reasonEditKey = er.dataset.editReason;
    renderSprints();
    const sel = document.querySelector(`tr[data-row-id="${row.id}"] select[data-reason-key="${reasonEditKey}"]`);
    if(sel){ sel.focus(); try{ sel.showPicker(); }catch(_){} }
    return;
  }
  const ntr = t.closest('[data-note-to-reason]');
  if(ntr){
    const c = row.dateChanges.find(c => c.id === ntr.dataset.noteToReason);
    if(c && c.note.trim()){ c.reason = ensureCustomReason(c.note); c.note = ''; scheduleSave(); refreshTickets(); toast(`Reason set: ${reasonInfo(c.reason).label}`); }
    return;
  }
  if(t.closest('[data-hist]')){ expandedHistory.has(row.id) ? expandedHistory.delete(row.id) : expandedHistory.add(row.id); renderSprints(); renderFilterBar(); return; }
  const del = t.closest('[data-change-del]');
  if(del){
    const i = row.dateChanges.findIndex(c => c.id === del.dataset.changeDel);
    if(i > -1){
      const [removed] = row.dateChanges.splice(i, 1);
      scheduleSave(); refreshTickets();
      toast('History entry removed', 'Undo', () => { row.dateChanges.splice(i, 0, removed); scheduleSave(); refreshTickets(); });
    }
  }
});
sc$.addEventListener('change', e => {
  const t = e.target;
  if(t.classList.contains('dp-native')) return;
  const { sprint, row } = ctx(t);
  if(!sprint || !row) return;
  if(t.matches('select[data-field]')){
    const f = t.dataset.field;
    trackDelivery(row, () => { row[f] = t.value; });
  } else if(t.matches('[data-sched-override]')){ row.scheduleOverride = t.value; }
  else if(t.matches('[data-delay-reason], [data-change-reason]')){
    const c = t.matches('[data-change-reason]') ? row.dateChanges.find(c => c.id === t.dataset.changeReason) : null;
    const apply = v => { if(c) c.reason = v; else row.delayReason = v; };
    reasonEditKey = null;
    if(t.value === OTHER_OPTION){
      askCustomReason(id => { if(id){ apply(id); scheduleSave(); toast(`Reason set: ${reasonInfo(id).label}`); } refreshTickets(); });
      return;
    }
    apply(t.value);
  }
  else if(t.matches('[data-move-select]')){
    const target = findSprintInActive(t.value); if(!target) return;
    sprint.rows.splice(sprint.rows.indexOf(row), 1); target.rows.push(row);
    toast(`Moved to ${target.name}`);
  } else return;
  scheduleSave(); refreshTickets();
});
sc$.addEventListener('input', e => {
  const t = e.target;
  if(t.classList.contains('dp-text')) return;
  if(t.tagName === 'TEXTAREA') autoGrow(t);
  const { row } = ctx(t);
  if(!row) return;
  if(t.matches('input[data-field], textarea[data-field]')){
    const f = t.dataset.field;
    row[f] = f === 'ticketNo' ? (t.value.trim() && !isNaN(t.value) ? Number(t.value) : t.value) : t.value;
    if(f === 'blocker') t.classList.toggle('has-value', !!t.value);
    scheduleSave();
  } else if(t.matches('[data-custom-col]')){ row.custom[t.dataset.customCol] = t.value; scheduleSave(); }
  else if(t.matches('[data-change-note]')){ const c = row.dateChanges.find(c => c.id === t.dataset.changeNote); if(c){ c.note = t.value; scheduleSave(); } }
});
sc$.addEventListener('focusout', e => {
  const t = e.target;
  if(t.matches('select[data-reason-key]') && reasonEditKey === t.dataset.reasonKey){
    // closed the dropdown without changing anything → back to the chip
    setTimeout(() => { if(reasonEditKey === t.dataset.reasonKey && !document.getElementById('modalOverlay')){ reasonEditKey = null; renderSprints(); } }, 150);
    return;
  }
  if(t.matches('[data-sprint-name]')){
    const { sprint } = ctx(t);
    if(sprint){ const v = t.textContent.trim() || 'Untitled sprint'; if(v !== sprint.name){ sprint.name = v; scheduleSave(); } }
  } else if(t.matches('[data-label]')){
    const k = t.dataset.label, v = t.textContent.trim();
    if(v && v !== data.labels[k]){ data.labels[k] = v; scheduleSave(); renderSprints(); }
  } else if(t.matches('[data-custom-label]')){
    const col = data.customColumns.find(c => c.id === t.dataset.customLabel), v = t.textContent.trim();
    if(col && v && v !== col.label){ col.label = v; scheduleSave(); renderSprints(); }
  } else if(t.matches('[data-field="assignee"], [data-field="blocker"]')){
    renderStats(); renderFilterBar();
  }
});
sc$.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('[contenteditable]')){ e.preventDefault(); e.target.blur(); }
});
sc$.addEventListener('mousedown', e => {
  const rc = e.target.closest('[data-remove-col]');
  if(!rc) return;
  const id = rc.dataset.removeCol;
  if(confirm('Remove this column? Its values are deleted for every ticket in every project.')){
    data.customColumns = data.customColumns.filter(c => c.id !== id);
    data.projects.forEach(p => p.sprints.forEach(s => s.rows.forEach(r => { delete r.custom[id]; })));
    scheduleSave(); renderSprints();
  }
});
sc$.addEventListener('dpcommit', e => {
  const w = e.target, iso = e.detail.iso, { sprint, row } = ctx(w);
  if(!sprint) return;
  if(w.dataset.dp === 'delivery' && row) handleDeliveryChange(row, iso);
});

/* ============================================================
   GANTT VIEW (unchanged logic, dates now dd/mm/yyyy)
   ============================================================ */
const GANTT_STAGES = [
  {v:'BR',label:'BR',color:'#419cd0'},
  {v:'DSN',label:'UI / UX',color:'#55b46b'},
  {v:'DEV',label:'DEV',color:'#e8ac28'},
  {v:'UAT',label:'UAT',color:'#de665e'},
  {v:'PROD',label:'PROD',color:'#9964bd'}
];
function ganttDefaultPlan(){ return {startDate:todayISO(),stages:GANTT_STAGES.map(s=>({stage:s.v,days:0,blocker:'',gapDays:0}))}; }
function countWorkingDays(start, end){
  let n = 0;
  for(let d=+start; d<+end; d+=86400000){ const dow = new Date(d).getUTCDay(); if(dow !== 5 && dow !== 6) n++; }
  return n;
}
function ganttPlanSegments(plan){
  if(!plan.startDate) return [];
  let cursor = new Date(plan.startDate+'T00:00:00Z');
  const segs = [];
  plan.stages.forEach(s=>{
    const days=Number(s.days)||0, gapDays=Number(s.gapDays)||0, blocker=(s.blocker||'').trim();
    if(days>0){ const start=new Date(cursor); cursor=new Date(+cursor+days*86400000); segs.push({type:'work',stage:s.stage,days,workingDays:countWorkingDays(start,cursor),start,end:new Date(cursor),blocker}); }
    if(gapDays>0){ const start=new Date(cursor); cursor=new Date(+cursor+gapDays*86400000); segs.push({type:'gap',stage:s.stage,days:gapDays,start,end:new Date(cursor),blocker}); }
  });
  return segs;
}
function ganttWeekendBg(start,count,dayPx){
  const stops=[];
  for(let i=0;i<count;i++){ const dow=new Date(+start+i*86400000).getUTCDay(); const c=(dow===5||dow===6)?'rgba(96,116,133,0.14)':'transparent'; stops.push(`${c} ${i*dayPx}px`,`${c} ${(i+1)*dayPx}px`); }
  return `linear-gradient(to right, ${stops.join(',')})`;
}
function ganttAddRevision(board, row){
  const rootId = row.revisionOf || row.id;
  const rev = { id: uid('gf'), task: row.task, revisionOf: rootId, revisionNote: '', gantt: ganttDefaultPlan() };
  rev.gantt.startDate = '';
  const idx = board.features.indexOf(row);
  let insertAt = idx;
  for(let i=idx+1;i<board.features.length;i++){ const f=board.features[i]; if(f.id===rootId || f.revisionOf===rootId) insertAt=i; else break; }
  board.features.splice(insertAt+1,0,rev);
  return rev;
}
function renderGanttView(){
  const container=$('#ganttContainer'), proj=getActiveProject();
  if(!proj.ganttBoard) proj.ganttBoard={start:'2026-09-15',end:'2026-12-31',features:[]};
  const board=proj.ganttBoard, rows=board.features;
  const start=new Date(board.start+'T00:00:00Z'), end=new Date(board.end+'T00:00:00Z');
  const count=Math.round((end-start)/86400000)+1;
  const dayPx=24, width=count*dayPx;
  const trackBg=`${ganttWeekendBg(start,count,dayPx)}, repeating-linear-gradient(to right,transparent 0,transparent 23px,#dde7ee 23px,#dde7ee 24px)`;
  const dmy=d=>fmtDate(d.toISOString().slice(0,10));
  const months=[],days=[];
  for(let i=0;i<count;){ const d=new Date(+start+i*86400000); const next=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)); const n=Math.min(count-i,Math.round((next-d)/86400000)); months.push({label:d.toLocaleDateString('en-GB',{month:'long',year:'numeric',timeZone:'UTC'}),days:n}); i+=n; }
  for(let i=0;i<count;i++){ const d=new Date(+start+i*86400000), dow=d.getUTCDay(); days.push({num:d.getUTCDate(),dow:d.toLocaleDateString('en-GB',{weekday:'short',timeZone:'UTC'}).slice(0,1),isWeekend:(dow===5||dow===6)}); }
  const editing=rows.find(r=>r.id===ganttEditingRowId);
  container.innerHTML=`
  <style>
    #ganttContainer .gantt-month-cell{background:var(--navy);color:#fff;font-size:12px;padding:9px 0}
    #ganttContainer .gantt-week-cell{background:#E8EEF6;color:#334155;border-bottom:1px solid #CBD5E1;border-left:1px solid #DDE5EE;font-size:10.5px;font-weight:700;}
    #ganttContainer .gantt-week-cell small{display:block;font-size:8px;font-weight:600;color:#64748B;}
    #ganttContainer .gantt-week-cell.weekend{background:#D5DEE8;}
    #ganttContainer .gantt-corner{background:#E8EEF6;color:#1E293B;}
    #ganttContainer .gantt-feature-row{min-height:72px;border-bottom:1px solid #E2E8F0}
    #ganttContainer .gantt-feature-label{background:#F8FAFC;border-left:5px solid #63a8ca;flex-wrap:wrap;row-gap:2px;}
    #ganttContainer .gantt-feature-label.is-revision{border-left-style:dashed;border-left-color:#8d64a5;background:#faf7fc;}
    #ganttContainer .gantt-seg{top:19px;height:27px;border:1px solid #0002;border-radius:7px;color:#132b3b;font-size:10px;cursor:pointer}
    #ganttContainer .gantt-seg.blocked{border:2px dashed #b91c1c;}
    #ganttContainer .gantt-seg.gap{background:repeating-linear-gradient(45deg,rgba(96,116,133,.16) 0,rgba(96,116,133,.16) 5px,transparent 5px,transparent 10px)!important;border:1.5px dashed #78899590;color:#4b5a66;box-shadow:none;}
    #ganttContainer .gantt-callout{position:absolute;top:49px;height:16px;display:flex;align-items:center;background:#b91c1c;color:#fff;font-size:9px;font-weight:700;border-radius:4px;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;}
    #ganttContainer .gantt-milestone{top:27px;background:#8d64a5}
    #ganttContainer .gantt-add-rev-btn{flex-shrink:0;width:20px;height:20px;border:none;background:transparent;border-radius:6px;color:#5b7889;cursor:pointer;font-size:12px;}
    #ganttContainer .gantt-add-rev-btn:hover{background:#dcebf2;}
    #ganttContainer .gantt-rev-badge{display:inline-flex;font-size:8.5px;font-weight:800;color:#8d64a5;background:#f1e8f8;border:1px solid #d9c3ee;border-radius:20px;padding:1px 6px;text-transform:uppercase;width:100%;}
    #ganttContainer .gantt-edit-field input:not([type=number]):not(.dp-text):not(.dp-native){padding:8px;border:1px solid var(--line);border-radius:7px;max-width:220px}
    #ganttContainer .gantt-feature-name{white-space:normal}
    #ganttContainer .gantt-outer{max-height:640px}
  </style>
  <div class="view-header"><div><h2>Feature delivery plan</h2><p class="view-sub">Enter each stage's length in calendar days (0 skips it). Bars show working days — Friday &amp; Saturday are excluded and greyed out. Add gap / hold days for holidays or approval waits.</p></div><button class="btn primary edit-only" id="ganttAddFeatureBtn">+ Add feature</button></div>
  <div class="gantt-card">
    <div class="gantt-title-block"><p class="gantt-eyebrow">${escapeHtml(proj.name)} · PRODUCT DELIVERY ROADMAP</p><h2>Project Gantt Chart</h2></div>
    <div class="gantt-toolbar">
      <div class="gantt-range">From ${dpHTML(board.start,'data-dp="ganttStart" data-required','boxed')} To ${dpHTML(board.end,'data-dp="ganttEnd" data-required','boxed')}</div>
      <div class="gantt-legend">${GANTT_STAGES.map(s=>`<span class="gantt-legend-item"><span class="gantt-legend-swatch" style="background:${s.color}"></span>${s.label}</span>`).join('')}<span class="gantt-legend-item">◆ Delivery</span><span class="gantt-legend-item"><span class="gantt-legend-swatch" style="background:rgba(96,116,133,.35)"></span>Weekend</span><span class="gantt-legend-item"><span class="gantt-legend-swatch" style="background:repeating-linear-gradient(45deg,#788995 0,#788995 2px,transparent 2px,transparent 4px)"></span>Gap / hold</span></div>
    </div>
    ${editing?`<div class="gantt-edit-panel"><h4>Edit feature &amp; stage durations</h4><div class="gantt-edit-fields">
      <div class="gantt-edit-field"><label for="ganttNameInput">Feature name</label><input id="ganttNameInput" value="${escapeHtml(editing.task)}"></div>
      <div class="gantt-edit-field"><label>Feature start</label>${dpHTML(editing.gantt.startDate,'data-dp="ganttFeatStart"','boxed')}</div>
      ${editing.revisionOf?`<div class="gantt-edit-field"><label for="ganttRevNoteInput">Reason for new requirements</label><input id="ganttRevNoteInput" placeholder="e.g. Scope changed — client added KYC step" value="${escapeHtml(editing.revisionNote||'')}"></div>`:''}
      ${GANTT_STAGES.map(s=>{ const st=editing.gantt.stages.find(x=>x.stage===s.v); return `<div class="gantt-edit-field gantt-stage-field" style="border-color:${s.color}">
          <label>${s.label} · days</label><input type="number" min="0" max="3650" step="1" data-gantt-stage-input="${s.v}" value="${st.days}">
          <label style="margin-top:2px">Gap / hold after</label><input type="number" min="0" max="3650" step="1" data-gantt-stage-gap="${s.v}" value="${st.gapDays||0}">
          <input placeholder="Reason e.g. waiting for approval" data-gantt-stage-blocker="${s.v}" value="${escapeHtml(st.blocker||'')}" style="font-size:11px;width:170px">
        </div>`; }).join('')}
      <button class="btn" id="ganttClosePanelBtn">Done</button>
      <button class="btn" id="ganttAddRevBtn">↻ New requirements line</button>
      <button class="btn" id="ganttDeleteBtn">Remove ${editing.revisionOf?'this line':'feature'}</button>
    </div></div>`:''}
    <div class="gantt-outer"><div class="gantt-table" style="width:${width+240}px">
      <div class="gantt-header-block">
        <div class="gantt-header-row"><div class="gantt-corner">Features / tasks</div>${months.map(m=>`<div class="gantt-month-cell" style="width:${m.days*dayPx}px">${m.label}</div>`).join('')}</div>
        <div class="gantt-header-row"><div class="gantt-corner">Days →</div>${days.map(d=>`<div class="gantt-week-cell${d.isWeekend?' weekend':''}" style="width:${dayPx}px">${d.num}<small>${d.dow}</small></div>`).join('')}</div>
      </div>
      ${rows.map(row=>{
        const segs=ganttPlanSegments(row.gantt);
        const bars=segs.map(seg=>{
          const left=Math.max(0,(seg.start-start)/86400000),right=Math.min(count,(seg.end-start)/86400000);
          if(right<=left) return '';
          const s=GANTT_STAGES.find(s=>s.v===seg.stage);
          const barLeft=left*dayPx, barWidth=Math.max(1,(right-left)*dayPx-2);
          const range=`${dmy(seg.start)} to ${dmy(new Date(+seg.end-86400000))}`;
          if(seg.type==='gap'){ const gl=seg.blocker||`Gap ${seg.days}d`; return `<button class="gantt-seg gap" data-gantt-edit="${row.id}" style="left:${barLeft}px;width:${barWidth}px" title="${escapeHtml(`${s.label} — paused: ${gl} · ${seg.days} day(s) · ${range}`)}">⏸ ${escapeHtml(gl)}</button>`; }
          const blocked=!!seg.blocker;
          const label=(blocked?'🚩 ':'')+s.label+' '+seg.workingDays+'d';
          const tt=`${s.label}: ${seg.workingDays} working day(s) (${seg.days} calendar) · ${range}`+(blocked?` · ⚠ ${seg.blocker}`:'');
          return `<button class="gantt-seg${blocked?' blocked':''}" data-gantt-edit="${row.id}" style="left:${barLeft}px;width:${barWidth}px;background:${s.color}" title="${escapeHtml(tt)}">${escapeHtml(label)}</button>`+
            (blocked?`<span class="gantt-callout" data-gantt-edit="${row.id}" style="left:${barLeft}px;max-width:${Math.max(barWidth,60)}px" title="${escapeHtml(seg.blocker)}">🚩 ${escapeHtml(seg.blocker)}</span>`:'');
        }).join('');
        const finish=segs.length?(segs[segs.length-1].end-start)/86400000:null;
        const milestone=finish!==null&&finish>=0&&finish<=count?`<span class="gantt-milestone" style="left:${Math.min(width-6,finish*dayPx)}px" title="Delivery: ${dmy(new Date(+segs[segs.length-1].end-86400000))}"></span>`:'';
        const revBadge=row.revisionOf?`<span class="gantt-rev-badge" title="New requirements received${row.revisionNote?': '+escapeHtml(row.revisionNote):''}">↻ New requirements${row.revisionNote?' — '+escapeHtml(row.revisionNote):''}</span>`:'';
        return `<div class="gantt-feature-row"><div class="gantt-feature-label${row.revisionOf?' is-revision':''}">${revBadge}<span class="gantt-feature-name">${escapeHtml(row.task)}</span><button class="gantt-add-rev-btn edit-only" data-gantt-addrev="${row.id}" title="New requirements received — add a new line">↻</button><button class="gantt-edit-btn edit-only" data-gantt-edit="${row.id}" title="Edit">✎</button></div><div class="gantt-feature-track" style="width:${width}px;background-image:${trackBg}">${bars||'<span class="gantt-unscheduled">'+(segs.length?'Outside displayed date range — edit dates':'Click ✎ to enter stage durations')+'</span>'}${milestone}</div></div>`;
      }).join('')}
    </div></div>
    ${rows.length?'':'<div class="gantt-empty"><strong>Your plan starts here.</strong><p>Add a feature, then enter its start date and stage durations.</p><p>Example: eKYC · BR 5 days · UI / UX 10 days</p></div>'}
  </div>`;
  const save=()=>{scheduleSave();renderGanttView();};
  container.querySelector('#ganttAddFeatureBtn').onclick=()=>{ const row={id:uid('gf'),task:'New feature',gantt:ganttDefaultPlan()}; rows.push(row); ganttEditingRowId=row.id; save(); container.querySelector('#ganttNameInput').focus(); };
  container.querySelectorAll('[data-gantt-edit]').forEach(b=>b.onclick=()=>{ if(document.body.classList.contains('present')) return; ganttEditingRowId=b.dataset.ganttEdit; renderGanttView(); });
  container.querySelectorAll('[data-gantt-addrev]').forEach(b=>b.onclick=()=>{ const src=rows.find(r=>r.id===b.dataset.ganttAddrev); if(!src) return; ganttEditingRowId=ganttAddRevision(board,src).id; save(); });
  if(editing){
    container.querySelector('#ganttNameInput').onchange=e=>{editing.task=e.target.value.trim()||'Untitled feature';save();};
    const rn=container.querySelector('#ganttRevNoteInput'); if(rn) rn.onchange=e=>{editing.revisionNote=e.target.value.trim();save();};
    container.querySelectorAll('[data-gantt-stage-input]').forEach(i=>i.onchange=()=>{ if(!i.checkValidity()){i.reportValidity();return;} editing.gantt.stages.find(s=>s.stage===i.dataset.ganttStageInput).days=Number(i.value)||0; save(); });
    container.querySelectorAll('[data-gantt-stage-gap]').forEach(i=>i.onchange=()=>{ if(!i.checkValidity()){i.reportValidity();return;} editing.gantt.stages.find(s=>s.stage===i.dataset.ganttStageGap).gapDays=Number(i.value)||0; save(); });
    container.querySelectorAll('[data-gantt-stage-blocker]').forEach(i=>i.onchange=()=>{ editing.gantt.stages.find(s=>s.stage===i.dataset.ganttStageBlocker).blocker=i.value.trim(); save(); });
    container.querySelector('#ganttClosePanelBtn').onclick=()=>{ganttEditingRowId=null;renderGanttView();};
    container.querySelector('#ganttAddRevBtn').onclick=()=>{ ganttEditingRowId=ganttAddRevision(board,editing).id; save(); };
    container.querySelector('#ganttDeleteBtn').onclick=()=>{ if(confirm('Remove this line from the Gantt plan?')){ rows.splice(rows.indexOf(editing),1); ganttEditingRowId=null; save(); } };
  }
}
$('#ganttContainer').addEventListener('dpcommit', e => {
  const k = e.target.dataset.dp, iso = e.detail.iso, board = getActiveProject().ganttBoard;
  if(k === 'ganttStart' || k === 'ganttEnd'){
    const a = k === 'ganttStart' ? iso : board.start, b = k === 'ganttEnd' ? iso : board.end;
    if(!a || !b || a > b || diffDays(a, b) > 730){ toast('Choose a valid range of up to 2 years'); renderGanttView(); return; }
    board.start = a; board.end = b;
  } else if(k === 'ganttFeatStart'){
    const ed = board.features.find(r => r.id === ganttEditingRowId); if(ed) ed.gantt.startDate = iso;
  }
  scheduleSave(); renderGanttView();
});

/* ============================================================

$('#addSprintBtn').onclick = () => {
  const proj = getActiveProject();
  proj.sprints.push(newSprint(`Sprint ${proj.sprints.length + 1}`));
  scheduleSave(); refreshTickets();
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
};
$('#addTicketBtn').onclick = () => {
  if(activeView !== 'tickets'){ activeView = 'tickets'; renderViewbar(); }
  const proj = getActiveProject();
  if(!proj.sprints.length) proj.sprints.push(newSprint('Sprint 1'));
  const sprint = proj.sprints[proj.sprints.length - 1];
  sprint.collapsed = false;
  const r = newRow(data.nextTicketNo++); sprint.rows.push(r);
  filters = emptyFilters();
  scheduleSave(); renderActiveView();
  const inp = document.querySelector(`tr[data-row-id="${r.id}"] .task-name`);
  if(inp){ inp.scrollIntoView({block:'center', behavior:'smooth'}); inp.focus({preventScroll:true}); }
};
function setPresent(on){
  document.body.classList.toggle('present', on);
  $('#presentBtn').classList.toggle('on', on);
  $('#presentLabel').textContent = on ? 'Exit presentation' : 'Present';
  const u = new URL(location.href);
  if(on) u.searchParams.set('view', 'exec'); else u.searchParams.delete('view');
  history.replaceState(null, '', u);
}
$('#presentBtn').onclick = () => setPresent(!document.body.classList.contains('present'));

$('#moreBtn').onclick = e => {
  const present = document.body.classList.contains('present');
  const m = openMenu(e.currentTarget, `
    ${present ? '' : `<button data-m="addcol">＋ Add custom column</button><button data-m="cols">☰ Show / hide columns</button><hr>`}
    <button data-m="link">🔗 Copy presentation link</button>
    <button data-m="print">🖨 Print / save as PDF</button><hr>
    <button data-m="export">⬆ Export data (backup)</button>
    ${present ? '' : `<button data-m="import">⬇ Import data</button>`}`);
  m.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const k = b.dataset.m; closeMenus();
    if(k === 'addcol'){
      const label = prompt('New column name (e.g. Owner, Module):');
      if(label && label.trim()){
        const col = { id: uid('col'), label: label.trim() };
        data.customColumns.push(col);
        data.projects.forEach(p => p.sprints.forEach(s => s.rows.forEach(r => { r.custom[col.id] = ''; })));
        scheduleSave(); renderSprints();
      }
    } else if(k === 'cols') openColumnsMenu();
    else if(k === 'link'){
      const u = new URL(location.href); u.searchParams.set('view', 'exec');
      navigator.clipboard.writeText(u.toString()).then(() => toast('Presentation link copied — opens in read-only view'), () => prompt('Copy this link:', u.toString()));
    }
    else if(k === 'print') window.print();
    else if(k === 'export') showExportModal();
    else if(k === 'import') showImportModal();
  });
};
function openColumnsMenu(){
  const vis = data.columnVisibility;
  const items = [['assignee','Assignee'],['schedule','Schedule status'],['reasons','Delay reasons'],['effort','Effort'],['highlight','RAG'],['blocker','Blocker'],['comment','Comment']];
  const m = openMenu($('#moreBtn'), `<div class="cp-title">Show columns</div>` + items.map(([k,l]) => `<label><input type="checkbox" data-col-vis="${k}" ${vis[k]?'checked':''}> ${l}</label>`).join(''));
  m.querySelectorAll('[data-col-vis]').forEach(cb => cb.onchange = () => { data.columnVisibility[cb.dataset.colVis] = cb.checked; scheduleSave(); renderSprints(); });
}
function showExportModal(){
  const text = JSON.stringify(data, null, 2);
  const o = openModal(`<h3>Export data</h3><p class="m-sub">Your full dashboard data. Keep a copy somewhere safe as a backup.</p><textarea class="code" readonly spellcheck="false"></textarea>
    <div class="modal-actions"><button class="btn" id="mDl">Download .json</button><button class="btn" id="mCancel">Close</button><button class="btn primary" id="mCopy">Copy to clipboard</button></div>`);
  const ta = o.querySelector('textarea'); ta.value = text;
  o.querySelector('#mCancel').onclick = closeModal;
  o.querySelector('#mCopy').onclick = async e => { try{ await navigator.clipboard.writeText(text); }catch(_){ ta.select(); document.execCommand('copy'); } e.target.textContent = 'Copied!'; };
  o.querySelector('#mDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'application/json'})); a.download = `roadmap-backup-${todayISO()}.json`; a.click(); };
}
function showImportModal(){
  const o = openModal(`<h3>Import data</h3><p class="m-sub">Paste previously exported data. This replaces everything for everyone viewing this dashboard.</p><textarea class="code" spellcheck="false"></textarea>
    <div class="modal-actions"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mImport">Import</button></div>`);
  o.querySelector('#mCancel').onclick = closeModal;
  o.querySelector('#mImport').onclick = () => {
    let parsed;
    try{ parsed = JSON.parse(o.querySelector('textarea').value); }catch(e){ alert("That isn't valid exported data (couldn't read it as JSON)."); return; }
    if(!parsed || !Array.isArray(parsed.projects) || !parsed.projects.length){ alert("That isn't valid exported data (no projects found)."); return; }
    if(!confirm('Replace all current data for everyone viewing this dashboard?')) return;
    data = migrateData(parsed); closeModal(); render(); scheduleSave();
  };
}

/* ---------------- start ---------------- */
if(new URLSearchParams(location.search).get('view') === 'exec') setPresent(true);
render();          // draw the empty shell immediately, then load shared data
loadData();

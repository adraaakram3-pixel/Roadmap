/* ---------------- KPI cards ---------------- */
const isBacklogSprint = sp => /backlog/i.test((sp && sp.name) || '');
function renderStats(){
  // Top cards count planned work only: sprints named "Backlog" are left out
  const plannedSprints = getActiveProject().sprints.filter(sp => !isBacklogSprint(sp));
  const rows = plannedSprints.flatMap(sp => sp.rows), n = rows.length;
  const backlogN = allRowsInActive().length - n;
  const sc = rows.map(rowSchedule);
  const count = k => sc.filter(s => s.state === k).length;
  const delayed = sc.filter(s => s.state === 'delayed');
  const avgLate = delayed.length ? Math.round(delayed.reduce((a, s) => a + s.lateBy, 0) / delayed.length) : 0;
  const blocked = rows.filter(r => (r.blocker && r.blocker.trim()) || r.trackerStatus === 'Blocked').length;
  const pct = x => n ? Math.round(x / n * 100) : 0;
  const unclassified = delayed.filter(s => !s.reason).length;
  const shipped = sc.filter(s => s.delivered);
  const late = sc.filter(s => s.state === 'late');
  const avgLateShip = late.length ? Math.round(late.reduce((a, s) => a + s.lateBy, 0) / late.length) : 0;
  const shipPct = x => shipped.length ? Math.round(x / shipped.length * 100) : 0;
  // The percentage is shown ONCE (the sub-line under the number); sub2 holds extra context
  const card = (k, label, num, sub, p, color, sub2 = '') => ({k, label, num, sub, sub2, p, color: color || SCHEDULE[k].color});
  const portfolio = k => `${pct(count(k))}% of portfolio`;
  const ofShipped = k => `${shipPct(count(k))}% of shipped`;
  const groups = [
    {title:'Portfolio', cards:[
      card('', 'Total features', n, `${plural(plannedSprints.length,'sprint')} · ${shipped.length} shipped`, 100, '#0B1F44', backlogN ? `${backlogN} in backlog, not counted` : ''),
      card('blocked', 'Blocked', blocked, `${pct(blocked)}% of portfolio`, pct(blocked), '#B45309', 'open blockers'),
    ]},
    {title:`Delivered — ${shipped.length} shipped`, cards:[
      card('early', 'Delivered early', count('early'), ofShipped('early'), shipPct(count('early'))),
      card('ontime', 'Delivered on time', count('ontime'), ofShipped('ontime'), shipPct(count('ontime'))),
      card('late', 'Delivered late', count('late'), ofShipped('late'), shipPct(count('late')), null, late.length ? `avg ${avgLateShip}d late` : ''),
    ]},
  ];
  const el = $('#statsRow');
  el.innerHTML = groups.map(g => `<div class="kpi-group"><div class="kpi-group-h">${escapeHtml(g.title)}</div><div class="kpi-grid" style="--n:${g.cards.length}">${g.cards.map(c => {
    const active = c.k === 'blocked' ? filters.blocked : (c.k && filters.schedule === c.k);
    return `<button class="kpi ${active ? 'active' : ''}" style="--k:${c.color}" data-kpi="${c.k}" title="${c.k ? 'Click to filter' : 'Click to clear filters'}">
      <div class="kpi-label"><span class="kd"></span>${c.label}</div>
      <div class="kpi-num">${c.num}</div>
      <div class="kpi-sub">${escapeHtml(c.sub)}</div>
      <div class="kpi-sub2">${c.sub2 ? escapeHtml(c.sub2) : '&nbsp;'}</div>
      <div class="kpi-bar"><span style="width:${c.p}%"></span></div></button>`;
  }).join('')}</div></div>`).join('');
  el.querySelectorAll('[data-kpi]').forEach(b => b.onclick = () => {
    const k = b.dataset.kpi;
    if(!k){ filters = emptyFilters(); }
    else if(k === 'blocked'){ filters.blocked = !filters.blocked; }
    else { filters.schedule = filters.schedule === k ? '' : k; filters.reason = ''; }
    refreshTickets();
  });
}

/* ---------------- insight cards ---------------- */
function renderInsights(){
  const rows = allRowsInActive(), n = rows.length;
  const sc = rows.map(rowSchedule);
  // 1. delivery health — backlog sprint(s) left out: those features aren't planned yet
  const hs = getActiveProject().sprints.filter(sp => !isBacklogSprint(sp)).flatMap(sp => sp.rows).map(rowSchedule);
  const hn = hs.length, hidden = n - hn;
  const counts = SCHEDULE_ORDER.map(k => ({k, n: hs.filter(s => s.state === k).length}));
  const health = `<div class="card">
    <div class="card-h"><h3>Delivery health</h3><span class="card-sub">${plural(hn,'feature')} · vs. original plan${hidden ? ` · backlog (${hidden}) not counted` : ''}</span></div>
    <div class="health-bar">${hn ? counts.filter(c => c.n).map(c => `<div class="health-seg" data-sched="${c.k}" title="${SCHEDULE[c.k].label}: ${c.n}" style="flex-grow:${c.n};background:${SCHEDULE[c.k].color}"></div>`).join('') : ''}</div>
    <div class="legend">${counts.map(c => `<div class="legend-item ${filters.schedule===c.k?'active':''}" data-sched="${c.k}"><span class="sw" style="background:${SCHEDULE[c.k].color}"></span>${SCHEDULE[c.k].label}<b>${c.n}</b><span class="pct">${hn ? Math.round(c.n/hn*100) : 0}%</span></div>`).join('')}</div>
  </div>`;
  // 2. delay reasons
  const delayed = rows.map((r,i) => ({r, s:sc[i]})).filter(x => SLIPPED(x.s.state));
  const groups = {};
  delayed.forEach(({s}) => { const k = reasonCat(s.reason) || 'none'; (groups[k] = groups[k] || {n:0, days:0}); groups[k].n++; groups[k].days += s.lateBy; });
  const list = Object.entries(groups).sort((a,b) => b[1].n - a[1].n || b[1].days - a[1].days);
  const max = Math.max(1, ...list.map(x => x[1].n));
  const reasons = `<div class="card">
    <div class="card-h"><h3>Why features slipped</h3><span class="card-sub">${delayed.length} delayed or late, by cause · <button class="link-btn edit-only" id="addReasonBtn" title="Add a new delay reason to the list">+ Add reason</button></span></div>
    ${list.length ? list.map(([k, g]) => { const ri = catInfo(k); return `
      <div class="reason-row ${filters.reason===k?'active':''}" data-reason-filter="${k}" title="Click to show these features">
        <span class="reason-name" title="${escapeHtml(ri.label)}"><span class="sw" style="background:${ri.color}"></span>${escapeHtml(ri.label)}</span>
        <div class="reason-track"><div class="reason-fill" style="width:${g.n/max*100}%;background:${ri.color}"></div></div>
        <span class="reason-val"><b>${g.n}</b> · ${g.days}d</span></div>`; }).join('')
      : `<div class="empty-insight"><span class="big">✓</span>No delayed or late features</div>`}
  </div>`;
  // 3. pipeline
  const stageCounts = STAGE_OPTIONS.map(o => ({o, n: rows.filter(r => r.stage === o.v).length}));
  const smax = Math.max(1, ...stageCounts.map(x => x.n));
  const pipe = `<div class="card">
    <div class="card-h"><h3>Pipeline by stage</h3><span class="card-sub">click a bar to filter</span></div>
    <div class="pipe">${stageCounts.map(({o, n}) => `<div class="pipe-col ${filters.stage===o.v?'active':''}" data-stage-filter="${o.v}" title="${o.label}: ${n}">
      <span class="pipe-n">${n}</span><div class="pipe-bar" style="height:${Math.max(4, n/smax*90)}px;background:${o.color}"></div><span class="pipe-l">${o.v}</span></div>`).join('')}</div>
  </div>`;
  const el = $('#insights');
  el.innerHTML = health + reasons + pipe;
  el.querySelectorAll('[data-sched]').forEach(x => x.onclick = () => { filters.schedule = filters.schedule === x.dataset.sched ? '' : x.dataset.sched; filters.reason = ''; refreshTickets(); });
  el.querySelectorAll('[data-reason-filter]').forEach(x => x.onclick = () => { const k = x.dataset.reasonFilter; filters.reason = filters.reason === k ? '' : k; filters.schedule = ''; refreshTickets(); });
  const arb = el.querySelector('#addReasonBtn');
  if(arb) arb.onclick = e => { e.stopPropagation(); askCustomReason(id => { if(id){ toast(`Added “${reasonInfo(id).label}” to the reason list`); refreshTickets(); } }, 'Add a delay reason', 'It will appear in every reason list and in this chart.'); };
  el.querySelectorAll('[data-stage-filter]').forEach(x => x.onclick = () => { filters.stage = filters.stage === x.dataset.stageFilter ? '' : x.dataset.stageFilter; refreshTickets(); });
}

// Planned working days per stage, from the Gantt feature LINKED to this ticket (by ticket ID;
// the name is only a fallback). The latest "new requirements" line wins. {} when there's no plan.
const normName = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
function ganttFeatureFor(row, proj){
  const feats = ((proj || getActiveProject()).ganttBoard || {}).features || [];
  let m = feats.filter(f => f.ticketId === row.id);
  if(!m.length && row.task) m = feats.filter(f => !f.ticketId && squash(f.task) === squash(row.task));
  return m[m.length - 1] || null;
}
function ganttDaysFor(row, proj){
  const f = ganttFeatureFor(row, proj);
  if(!f || !f.gantt) return {};
  const out = {};
  ganttPlanSegments(f.gantt).forEach(seg => { if(seg.type === 'work') out[seg.stage] = (out[seg.stage] || 0) + seg.workingDays; });
  return out;
}
// ACTUAL calendar days spent in each stage, from the stage history (recorded since the tracker started logging it)
function stageActuals(row){
  const h = (row.stageHistory || []).filter(x => x && x.at).slice().sort((a, b) => a.at < b.at ? -1 : 1);
  const out = {};
  h.forEach((e, i) => {
    if(e.stage === 'PROD') return;
    const end = i + 1 < h.length ? new Date(h[i+1].at) : (isDelivered(row) && row.deliveredAt ? new Date(row.deliveredAt + 'T12:00:00') : new Date());
    const d = Math.max(0, Math.round((end - new Date(e.at)) / 86400000));
    out[e.stage] = (out[e.stage] || 0) + d;
  });
  return out;
}
/* ---------- UAT & release journey: shared → feedback → back to dev → shared again → sign-off → production ---------- */
const UAT_EVENTS = {
  shared:    {label:'Shared with business for UAT', btn:'Share for UAT',     color:'#0D9488'},
  feedback:  {label:'Business feedback received',   btn:'Feedback received', color:'#D97706'},
  backtodev: {label:'Back to dev to fix feedback',  btn:'Back to dev',       color:'#DC2626'},
  signoff:   {label:'Business sign-off',            btn:'Signed off',        color:'#2563EB'},
  prod:      {label:'Released to production',       btn:'Released to prod',  color:'#16A34A'},
};
const UAT_NEXT = { none:['shared'], shared:['feedback','signoff'], feedback:['backtodev','signoff'], backtodev:['shared'], signoff:['prod'], prod:[] };
const expandedUat = new Set();
function uatSorted(row){ return (row.uatLog || []).map((e, i) => Object.assign({i}, e)).sort((a, b) => a.date === b.date ? a.i - b.i : (a.date < b.date ? -1 : 1)); }
function uatInfo(row){
  const log = uatSorted(row);
  let round = 0; const rounds = []; const waits = [];
  log.forEach((e, k) => {
    if(e.type === 'shared'){ round++; e.round = round; const nx = log.slice(k + 1).find(x => x.type === 'feedback' || x.type === 'signoff'); if(nx) waits.push(diffDays(e.date, nx.date)); }
    else e.round = round;
  });
  const last = log[log.length - 1] || null;
  return { log, rounds: round, last, state: last ? last.type : 'none', avgWait: waits.length ? Math.round(waits.reduce((a, b) => a + b, 0) / waits.length * 10) / 10 : null };
}
function uatHTML(row){
  const u = uatInfo(row), today = todayISO();
  const relevant = u.log.length || row.stage === 'DEV' || row.stage === 'UAT';
  if(!relevant) return isDelivered(row) ? '<span class="uat-muted">—</span>' : '<span class="uat-muted">Not in UAT yet</span>';
  let cls = 'idle', text = 'Not shared with business yet';
  if(u.state === 'shared'){ const d = diffDays(u.last.date, today); cls = d >= 7 ? 'late' : d >= 3 ? 'warn' : 'wait'; text = `Round ${u.rounds} · with business since ${fmtDate(u.last.date)} · ${d < 1 ? 'shared today' : 'waiting ' + plural(d, 'day')}`; }
  else if(u.state === 'feedback'){ cls = 'fb'; text = `Round ${u.rounds} · feedback received ${fmtDate(u.last.date)}`; }
  else if(u.state === 'backtodev'){ cls = 'dev'; text = `Round ${u.rounds} · back in dev since ${fmtDate(u.last.date)}`; }
  else if(u.state === 'signoff'){ cls = 'ok'; text = `Signed off ${fmtDate(u.last.date)} · ready for production`; }
  else if(u.state === 'prod'){ cls = 'live'; text = `Live ${fmtDate(u.last.date)} · ${plural(u.rounds, 'UAT round')}`; }
  const acts = (UAT_NEXT[u.state] || []).map(t => `<button type="button" class="uat-act edit-only" data-uat-act="${t}" style="--ec:${UAT_EVENTS[t].color}">${t === 'shared' && u.rounds ? 'Share again (round ' + (u.rounds + 1) + ')' : UAT_EVENTS[t].btn}</button>`).join('');
  const open = expandedUat.has(row.id);
  let h = `<div class="uat-box"><span class="uat-status ${cls}">${text}</span>`;
  if(u.avgWait !== null) h += `<span class="uat-meta">Business response: ${u.avgWait < 1 ? 'same day' : plural(u.avgWait, 'day')} on average</span>`;
  if(acts) h += `<div class="uat-acts">${acts}</div>`;
  if(u.log.length){
    h += `<button type="button" class="uat-toggle ${open ? 'open' : ''}" data-uat-toggle>${ICON.chev}${open ? 'Hide' : 'Show'} timeline (${plural(u.log.length, 'step')})</button>`;
    if(open){

  const parts = [];
  if(days) parts.push(`plan ${plural(days, 'day')}`);

function scheduleHTML(r, s){

  if(s.state === 'delayed'){
    late = true;
    if(s.overdue > 0) meta = `Overdue by ${s.overdue}d${s.slip > 0 ? ` · slipped ${signedDays(s.slip)}` : ''}`;
    else if(s.slip > 0) meta = `Slipped ${signedDays(s.slip)} vs original plan`;

  } else if(s.state === 'ahead'){
    meta = s.slip < 0 ? `Pulled in ${signedDays(s.slip)} vs original plan` : 'Ahead of plan';

function handleDeliveryChange(row, iso){
  const prev = row.delivery || lastKnownDate(row);
  row.delivery = iso;
  if(!iso){ scheduleSave(); refreshTickets(); return; }
  if(!row.baselineDate && !row.dateChanges.length){
    row.baselineDate = iso;          // first date ever set = original plan
    scheduleSave(); refreshTickets(); return;
  }
  if(prev && prev !== iso){
    const ch = { id: uid('chg'), from: prev, to: iso, at: new Date().toISOString(), reason: '', note: '' };
    row.dateChanges.push(ch);
    scheduleSave(); refreshTickets();
    openReasonModal(row, ch);
  } else { scheduleSave(); refreshTickets(); }
}

  if(sv) sv.onchange = () => { chosen = sv.value; o.querySelectorAll('.chip').forEach(x => x.classList.remove('sel')); o.querySelector('#otherBox').style.display = 'none'; };
  let catTouched = false;
  o.querySelector('#otherCat').onchange = () => { catTouched = true; };
  o.querySelector('#otherReason').addEventListener('input', e => { if(!catTouched) o.querySelector('#otherCat').value = guessCat(e.target.value); });
  o.querySelector('#mSave').onclick = () => {
    if(chosen === OTHER_OPTION){
      const txt = o.querySelector('#otherReason').value.trim();
      if(!txt){ o.querySelector('#otherReason').focus(); toast('Type the reason, or pick another one'); return; }
      chosen = ensureCustomReason(txt, o.querySelector('#otherCat').value);
    }
    if(sh > 0 && !chosen){
      const chips = o.querySelector('.chips');
      chips.classList.remove('need'); void chips.offsetWidth; chips.classList.add('need');
      toast('Pick a reason (or “Other…” to type one) — or choose “Classify later”');
      return;
    }
    ch.reason = chosen; ch.note = o.querySelector('#reasonNote').value.trim();
    closeModal(); scheduleSave(); refreshTickets(); flashRow(row.id);
    toast(chosen ? `Logged: ${reasonInfo(chosen).label}` : 'Date change logged');
  };
  o.querySelector('#mLater').onclick = () => {
    const note = o.querySelector('#reasonNote').value.trim();
    if(note){ ch.note = note; scheduleSave(); refreshTickets(); }
    closeModal(); if(sh > 0) toast('Date change logged — reason marked unclassified');
  };
  o.querySelector('#mCorrection').onclick = () => {
    const i = row.dateChanges.indexOf(ch);
    if(i > -1) row.dateChanges.splice(i, 1);
    const prevCh = row.dateChanges[row.dateChanges.length - 1];
    if(prevCh) prevCh.to = ch.to; else row.baselineDate = ch.to;
    closeModal(); scheduleSave(); refreshTickets(); toast('Date corrected — not logged as a change');
  };
}
function flashRow(id){ const tr = document.querySelector(`tr[data-row-id="${id}"]`); if(tr){ tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash'); } }

/* ---------- delegated events for the sprint tables ---------- */
const sc$ = $('#sprintsContainer');
function ctx(el){
  const tr = el.closest('tr[data-row-id]'), sec = el.closest('.sprint');
  const sprint = sec ? findSprintInActive(sec.dataset.sprintId) : null;
  const row = tr && sprint ? sprint.rows.find(r => r.id === tr.dataset.rowId) : null;
  return { sprint, row, tr };
}
sc$.addEventListener('click', e => {
  const t = e.target;
  const { sprint, row } = ctx(t);
  if(!sprint) return;
  if(t.closest('[data-toggle]')){ sprint.collapsed = !sprint.collapsed; scheduleSave(); renderSprints(); return; }
  if(t.closest('[data-add-task]')){
    const r = newRow(data.nextTicketNo++); sprint.rows.push(r); sprint.collapsed = false;
    scheduleSave(); refreshTickets();
    const inp = document.querySelector(`tr[data-row-id="${r.id}"] .task-name`); if(inp) inp.focus();
    return;
  }
  if(t.closest('[data-delete-sprint]')){
    const proj = getActiveProject(), i = proj.sprints.indexOf(sprint);
    if(sprint.rows.length && !confirm(`Delete sprint "${sprint.name}" and its ${plural(sprint.rows.length,'ticket')}?`)) return;
    proj.sprints.splice(i, 1); scheduleSave(); refreshTickets();
    toast(`Sprint “${sprint.name}” deleted`, 'Undo', () => { getActiveProject().sprints.splice(i, 0, sprint); scheduleSave(); refreshTickets(); }, 7000);
    return;
  }
  if(!row) return;
  const act = t.closest('[data-action]');
  if(act){
    const a = act.dataset.action, idx = sprint.rows.indexOf(row);
    if(a === 'up' && idx > 0) [sprint.rows[idx-1], sprint.rows[idx]] = [sprint.rows[idx], sprint.rows[idx-1]];
    else if(a === 'down' && idx < sprint.rows.length - 1) [sprint.rows[idx+1], sprint.rows[idx]] = [sprint.rows[idx], sprint.rows[idx+1]];
    else if(a === 'duplicate'){
      const clone = JSON.parse(JSON.stringify(row));
      clone.id = uid('row'); clone.ticketNo = data.nextTicketNo++;
      clone.stageHistory = [{ stage: clone.stage, at: new Date().toISOString() }];
      clone.dateChanges.forEach(c => c.id = uid('chg'));
      sprint.rows.splice(idx + 1, 0, clone);
      toast(`Duplicated as #${clone.ticketNo}`);
    } else if(a === 'delete'){
      sprint.rows.splice(idx, 1);
      const sid = sprint.id;
      toast(`Ticket #${row.ticketNo} deleted`, 'Undo', () => { const s = findSprintInActive(sid); if(s){ s.rows.splice(idx, 0, row); scheduleSave(); refreshTickets(); } }, 7000);
    }
    scheduleSave(); refreshTickets(); return;
  }
  const ps = t.closest('[data-pstep]');
  if(ps){ trackDelivery(row, () => setRowStage(row, ps.dataset.pstep)); trackWaiting(row); scheduleSave(); refreshTickets(); return; }
  if(t.closest('[data-rag]')){ row.highlight = RAG_CYCLE[(RAG_CYCLE.indexOf(row.highlight) + 1) % RAG_CYCLE.length]; scheduleSave(); refreshTickets(); return; }
  const ua = t.closest('[data-uat-act]');
  if(ua){ addUatEvent(row, ua.dataset.uatAct); scheduleSave(); refreshTickets(); flashRow(row.id); toast(`${UAT_EVENTS[ua.dataset.uatAct].label} · ${fmtDate(todayISO())}`); return; }
  if(t.closest('[data-uat-toggle]')){ expandedUat.has(row.id) ? expandedUat.delete(row.id) : expandedUat.add(row.id); renderSprints(); return; }
  const ud = t.closest('[data-uat-del]');
  if(ud){
    const i = row.uatLog.findIndex(e => e.id === ud.dataset.uatDel);
    if(i > -1){ const [rm] = row.uatLog.splice(i, 1); scheduleSave(); refreshTickets(); toast('Step removed', 'Undo', () => { row.uatLog.splice(i, 0, rm); scheduleSave(); refreshTickets(); }); }
    return;
  }
  const lv = t.closest('[data-live]');
  if(lv){
    if(document.body.classList.contains('present')) return;
    const k = 'live' + lv.dataset.live;
    row[k] = LIVE_CYCLE[(LIVE_CYCLE.indexOf(row[k] || '') + 1) % LIVE_CYCLE.length];
    scheduleSave(); refreshTickets(); return;
  }
  const er = t.closest('[data-edit-reason]');
  if(er){
    if(document.body.classList.contains('present')) return;
    reasonEditKey = er.dataset.editReason;
    renderSprints();
    const sel = document.querySelector(`tr[data-row-id="${row.id}"] select[data-reason-key="${reasonEditKey}"]`);
    if(sel){ sel.focus(); try{ sel.showPicker(); }catch(_){} }
    return;
  }
  const ntr = t.closest('[data-note-to-reason]');
  if(ntr){
    const c = row.dateChanges.find(c => c.id === ntr.dataset.noteToReason);
    if(c && c.note.trim()){ c.reason = ensureCustomReason(c.note); c.note = ''; scheduleSave(); refreshTickets(); toast(`Reason set: ${reasonInfo(c.reason).label}`); }
    return;
  }
  if(t.closest('[data-hist]')){ expandedHistory.has(row.id) ? expandedHistory.delete(row.id) : expandedHistory.add(row.id); renderSprints(); renderFilterBar(); return; }
  const del = t.closest('[data-change-del]');
  if(del){
    const i = row.dateChanges.findIndex(c => c.id === del.dataset.changeDel);
    if(i > -1){
      const [removed] = row.dateChanges.splice(i, 1);
      scheduleSave(); refreshTickets();
      toast('History entry removed', 'Undo', () => { row.dateChanges.splice(i, 0, removed); scheduleSave(); refreshTickets(); });
    }
  }
});
sc$.addEventListener('change', e => {
  const t = e.target;
  if(t.classList.contains('dp-native')) return;
  const { sprint, row } = ctx(t);
  if(!sprint || !row) return;
  if(t.matches('select[data-field]')){
    const f = t.dataset.field;
    trackDelivery(row, () => { row[f] = t.value; });
    trackWaiting(row);
  } else if(t.matches('[data-sched-override]')){ row.scheduleOverride = t.value; }
  else if(t.matches('[data-delay-reason], [data-change-reason]')){
    const c = t.matches('[data-change-reason]') ? row.dateChanges.find(c => c.id === t.dataset.changeReason) : null;
    const apply = v => { if(c) c.reason = v; else row.delayReason = v; };
    reasonEditKey = null;
    if(t.value === OTHER_OPTION){
      askCustomReason(id => { if(id){ apply(id); scheduleSave(); toast(`Reason set: ${reasonInfo(id).label}`); } refreshTickets(); });
      return;
    }
    apply(t.value);
  }
  else if(t.matches('[data-move-select]')){
    const target = findSprintInActive(t.value); if(!target) return;
    sprint.rows.splice(sprint.rows.indexOf(row), 1); target.rows.push(row);
    toast(`Moved to ${target.name}`);
  } else return;
  scheduleSave(); refreshTickets();
});
sc$.addEventListener('input', e => {
  const t = e.target;
  if(t.classList.contains('dp-text')) return;
  if(t.tagName === 'TEXTAREA') autoGrow(t);
  const { row } = ctx(t);
  if(!row) return;
  if(t.matches('input[data-field], textarea[data-field]')){
    const f = t.dataset.field;
    row[f] = f === 'ticketNo' ? (t.value.trim() && !isNaN(t.value) ? Number(t.value) : t.value) : t.value;
    if(f === 'blocker'){ t.classList.toggle('has-value', !!t.value); trackWaiting(row); }
    scheduleSave();
  } else if(t.matches('[data-custom-col]')){ row.custom[t.dataset.customCol] = t.value; scheduleSave(); }
  else if(t.matches('[data-uat-note]')){ const e = row.uatLog.find(x => x.id === t.dataset.uatNote); if(e){ e.note = t.value; scheduleSave(); } }
  else if(t.matches('[data-change-note]')){ const c = row.dateChanges.find(c => c.id === t.dataset.changeNote); if(c){ c.note = t.value; scheduleSave(); } }
});
sc$.addEventListener('focusout', e => {
  const t = e.target;
  if(t.matches('select[data-reason-key]') && reasonEditKey === t.dataset.reasonKey){
    // closed the dropdown without changing anything → back to the chip
    setTimeout(() => { if(reasonEditKey === t.dataset.reasonKey && !document.getElementById('modalOverlay')){ reasonEditKey = null; renderSprints(); } }, 150);
    return;
  }
  if(t.matches('[data-sprint-name]')){
    const { sprint } = ctx(t);
    if(sprint){ const v = t.textContent.trim() || 'Untitled sprint'; if(v !== sprint.name){ sprint.name = v; scheduleSave(); } }
  } else if(t.matches('[data-label]')){
    const k = t.dataset.label, v = t.textContent.trim();
    if(v && v !== data.labels[k]){ data.labels[k] = v; scheduleSave(); renderSprints(); }
  } else if(t.matches('[data-custom-label]')){
    const col = data.customColumns.find(c => c.id === t.dataset.customLabel), v = t.textContent.trim();
    if(col && v && v !== col.label){ col.label = v; scheduleSave(); renderSprints(); }
  } else if(t.matches('[data-field="assignee"], [data-field="blocker"]')){
    renderStats(); renderFilterBar();
  }
});
sc$.addEventListener('keydown', e => {
  if(e.key === 'Enter' && e.target.matches('[contenteditable]')){ e.preventDefault(); e.target.blur(); }
});
sc$.addEventListener('mousedown', e => {
  const rc = e.target.closest('[data-remove-col]');
  if(!rc) return;
  const id = rc.dataset.removeCol;
  if(confirm('Remove this column? Its values are deleted for every ticket in every project.')){
    data.customColumns = data.customColumns.filter(c => c.id !== id);
    data.projects.forEach(p => p.sprints.forEach(s => s.rows.forEach(r => { delete r.custom[id]; })));
    scheduleSave(); renderSprints();
  }
});
sc$.addEventListener('dpcommit', e => {
  const w = e.target, iso = e.detail.iso, { sprint, row } = ctx(w);
  if(!sprint) return;
  if(w.dataset.dp === 'delivery' && row) handleDeliveryChange(row, iso);
  else if(w.dataset.dp === 'uatEvent' && row){
    const e = row.uatLog.find(x => x.id === w.dataset.ev);
    if(e && iso){ e.date = iso; if(e.type === 'prod') row.deliveredAt = iso; scheduleSave(); refreshTickets(); }
  }
  else if(w.dataset.dp === 'sprintStart'){ sprint.startDate = iso; scheduleSave(); renderSprints(); }
  else if(w.dataset.dp === 'sprintEnd'){ sprint.endDate = iso; scheduleSave(); renderSprints(); }
});

   GANTT VIEW (unchanged logic, dates now dd/mm/yyyy)

const GANTT_STAGES = [
  {v:'BR',label:'BR',color:'#419cd0'},
  {v:'DSN',label:'UI / UX',color:'#55b46b'},
  {v:'DEV',label:'DEV',color:'#e8ac28'},
  {v:'UAT',label:'UAT',color:'#de665e'},
  {v:'PROD',label:'PROD',color:'#9964bd'}
];
function ganttDefaultPlan(){ return {startDate:todayISO(),stages:GANTT_STAGES.map(s=>({stage:s.v,days:0,blocker:'',gapDays:0}))}; }
function countWorkingDays(start, end){
  let n = 0;
  for(let d=+start; d<+end; d+=86400000){ const dow = new Date(d).getUTCDay(); if(dow !== 5 && dow !== 6) n++; }
  return n;
}
function ganttPlanSegments(plan){
  if(!plan.startDate) return [];
  let cursor = new Date(plan.startDate+'T00:00:00Z');
  const segs = [];
  plan.stages.forEach(s=>{
    const days=Number(s.days)||0, gapDays=Number(s.gapDays)||0, blocker=(s.blocker||'').trim();
    if(days>0){ const start=new Date(cursor); cursor=new Date(+cursor+days*86400000); segs.push({type:'work',stage:s.stage,days,workingDays:countWorkingDays(start,cursor),start,end:new Date(cursor),blocker}); }
    if(gapDays>0){ const start=new Date(cursor); cursor=new Date(+cursor+gapDays*86400000); segs.push({type:'gap',stage:s.stage,days:gapDays,start,end:new Date(cursor),blocker}); }
  });
  return segs;
}
function ganttWeekendBg(start,count,dayPx){
  const stops=[];
  for(let i=0;i<count;i++){ const dow=new Date(+start+i*86400000).getUTCDay(); const c=(dow===5||dow===6)?'rgba(96,116,133,0.14)':'transparent'; stops.push(`${c} ${i*dayPx}px`,`${c} ${(i+1)*dayPx}px`); }
  return `linear-gradient(to right, ${stops.join(',')})`;
}
function ganttAddRevision(board, row){
  const rootId = row.revisionOf || row.id;
  const rev = { id: uid('gf'), task: row.task, revisionOf: rootId, revisionNote: '', ticketId: row.ticketId || '', gantt: ganttDefaultPlan() };
  rev.gantt.startDate = '';
  const idx = board.features.indexOf(row);
  let insertAt = idx;
  for(let i=idx+1;i<board.features.length;i++){ const f=board.features[i]; if(f.id===rootId || f.revisionOf===rootId) insertAt=i; else break; }
  board.features.splice(insertAt+1,0,rev);
  return rev;
}

          const left=Math.max(0,(seg.start-start)/86400000),right=Math.min(count,(seg.end-start)/86400000);
          if(right<=left) return '';
          const s=GANTT_STAGES.find(s=>s.v===seg.stage);
          const barLeft=left*dayPx, barWidth=Math.max(1,(right-left)*dayPx-2);
          const range=`${dmy(seg.start)} to ${dmy(new Date(+seg.end-86400000))}`;
          if(seg.type==='gap'){ const gl=seg.blocker||`Gap ${seg.days}d`; return `<button class="gantt-seg gap" data-gantt-edit="${row.id}" style="left:${barLeft}px;width:${barWidth}px" title="${escapeHtml(`${s.label} — paused: ${gl} · ${seg.days} day(s) · ${range}`)}">⏸ ${escapeHtml(gl)}</button>`; }
          const blocked=!!seg.blocker;
          const label=(blocked?'🚩 ':'')+s.label+' '+seg.workingDays+'d';
          const tt=`${s.label}: ${seg.workingDays} working day(s) (${seg.days} calendar) · ${range}`+(blocked?` · ⚠ ${seg.blocker}`:'');
          return `<button class="gantt-seg${blocked?' blocked':''}" data-gantt-edit="${row.id}" style="left:${barLeft}px;width:${barWidth}px;background:${s.color}" title="${escapeHtml(tt)}">${escapeHtml(label)}</button>`+
            (blocked?`<span class="gantt-callout" data-gantt-edit="${row.id}" style="left:${barLeft}px;max-width:${Math.max(barWidth,60)}px" title="${escapeHtml(seg.blocker)}">🚩 ${escapeHtml(seg.blocker)}</span>`:'');
        }).join('');
        const finish=segs.length?(segs[segs.length-1].end-start)/86400000:null;
        const milestone=finish!==null&&finish>=0&&finish<=count?`<span class="gantt-milestone" style="left:${Math.min(width-6,finish*dayPx)}px" title="Delivery: ${dmy(new Date(+segs[segs.length-1].end-86400000))}"></span>`:'';
        const revBadge=row.revisionOf?`<span class="gantt-rev-badge" title="New requirements received${row.revisionNote?': '+escapeHtml(row.revisionNote):''}">↻ New requirements${row.revisionNote?' — '+escapeHtml(row.revisionNote):''}</span>`:'';
        return `<div class="gantt-feature-row"><div class="gantt-feature-label${row.revisionOf?' is-revision':''}">${revBadge}<span class="gantt-feature-name">${escapeHtml(row.task)}${(()=>{const t=row.ticketId&&proj.sprints.flatMap(x=>x.rows).find(r=>r.id===row.ticketId);return t?`<span class="gantt-link-badge" title="Linked to ticket ${escapeHtml(String(t.ticketNo||''))} · ${escapeHtml(t.task.trim())}">🔗 ${t.ticketNo?'#'+escapeHtml(String(t.ticketNo)):'linked'}</span>`:`<span class="gantt-link-badge none" title="Not linked to a ticket — click ✎ to link">not linked</span>`;})()}</span><button class="gantt-add-rev-btn edit-only" data-gantt-addrev="${row.id}" title="New requirements received — add a new line">↻</button><button class="gantt-edit-btn edit-only" data-gantt-edit="${row.id}" title="Edit">✎</button></div><div class="gantt-feature-track" style="width:${width}px;background-image:${trackBg}">${bars||'<span class="gantt-unscheduled">'+(segs.length?'Outside displayed date range — edit dates':'Click ✎ to enter stage durations')+'</span>'}${milestone}</div></div>`;
      }).join('')}
    </div></div>
    ${rows.length?'':'<div class="gantt-empty"><strong>Your plan starts here.</strong><p>Add a feature, then enter its start date and stage durations.</p><p>Example: eKYC · BR 5 days · UI / UX 10 days</p></div>'}
  </div>`;
  const save=()=>{scheduleSave();renderGanttView();};
  container.querySelector('#ganttAddFeatureBtn').onclick=()=>{ const row={id:uid('gf'),task:'New feature',ticketId:'',gantt:ganttDefaultPlan()}; rows.push(row); ganttEditingRowId=row.id; save(); container.querySelector('#ganttNameInput').focus(); };
  container.querySelectorAll('[data-gantt-edit]').forEach(b=>b.onclick=()=>{ if(document.body.classList.contains('present')) return; ganttEditingRowId=b.dataset.ganttEdit; renderGanttView(); });
  container.querySelectorAll('[data-gantt-addrev]').forEach(b=>b.onclick=()=>{ const src=rows.find(r=>r.id===b.dataset.ganttAddrev); if(!src) return; ganttEditingRowId=ganttAddRevision(board,src).id; save(); });
  if(editing){
    container.querySelector('#ganttNameInput').onchange=e=>{editing.task=e.target.value.trim()||'Untitled feature';save();};
    container.querySelector('#ganttTicketSel').onchange=e=>{editing.ticketId=e.target.value; board.features.filter(f=>f.revisionOf===(editing.revisionOf||editing.id)).forEach(f=>f.ticketId=e.target.value); save(); toast(e.target.value?'Linked: the ticket now shows these stage days':'Link removed');};
    const rn=container.querySelector('#ganttRevNoteInput'); if(rn) rn.onchange=e=>{editing.revisionNote=e.target.value.trim();save();};
    container.querySelectorAll('[data-gantt-stage-input]').forEach(i=>i.onchange=()=>{ if(!i.checkValidity()){i.reportValidity();return;} editing.gantt.stages.find(s=>s.stage===i.dataset.ganttStageInput).days=Number(i.value)||0; save(); });
    container.querySelectorAll('[data-gantt-stage-gap]').forEach(i=>i.onchange=()=>{ if(!i.checkValidity()){i.reportValidity();return;} editing.gantt.stages.find(s=>s.stage===i.dataset.ganttStageGap).gapDays=Number(i.value)||0; save(); });
    container.querySelectorAll('[data-gantt-stage-blocker]').forEach(i=>i.onchange=()=>{ editing.gantt.stages.find(s=>s.stage===i.dataset.ganttStageBlocker).blocker=i.value.trim(); save(); });
    container.querySelector('#ganttClosePanelBtn').onclick=()=>{ganttEditingRowId=null;renderGanttView();};
    container.querySelector('#ganttAddRevBtn').onclick=()=>{ ganttEditingRowId=ganttAddRevision(board,editing).id; save(); };
    container.querySelector('#ganttDeleteBtn').onclick=()=>{ if(confirm('Remove this line from the Gantt plan?')){ rows.splice(rows.indexOf(editing),1); ganttEditingRowId=null; save(); } };
  }
}
$('#ganttContainer').addEventListener('dpcommit', e => {
  const k = e.target.dataset.dp, iso = e.detail.iso, board = getActiveProject().ganttBoard;
  if(k === 'ganttStart' || k === 'ganttEnd'){

/* ============================================================
   INSIGHTS VIEW — the leadership view across products
   ============================================================ */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m-1]} ${y}`; };
function scopeProjects(){ return insightsScope === 'all' ? data.projects : data.projects.filter(p => p.id === insightsScope); }
function scopeEntries(projects){
  const out = [];
  (projects || scopeProjects()).forEach(proj => proj.sprints.forEach(sprint => sprint.rows.forEach(row => out.push({ row, proj, sprint, s: rowSchedule(row) }))));
  return out;
}
const shipDateOf = r => r.deliveredAt || r.delivery || '';
function metricsOf(entries){
  const shipped = entries.filter(e => e.s.delivered);
  const onPlan = shipped.filter(e => e.s.state === 'early' || e.s.state === 'ontime').length;
  const late = shipped.filter(e => e.s.state === 'late');
  const causes = causeTotals(entries);
  const top = causes.list[0];
  return {
    total: entries.length,
    shipped: shipped.length,
    onPlanPct: shipped.length ? Math.round(onPlan / shipped.length * 100) : null,
    late: late.length,
    avgLate: late.length ? Math.round(late.reduce((a, e) => a + e.s.lateBy, 0) / late.length) : 0,
    delayedNow: entries.filter(e => e.s.state === 'delayed').length,
    inFlight: entries.filter(e => !e.s.delivered && e.row.delivery).length,
    backlog: entries.filter(e => !e.s.delivered && !e.row.delivery).length,
    waiting: entries.filter(e => isWaiting(e.row)).length,
    topCause: top ? `${top.label} (${top.days}d)` : '—',
    outsidePct: causes.total ? Math.round(causes.outside / causes.total * 100) : null,
  };
}
// Days lost per delay CATEGORY, counted on every push-out of a date (same basis as the leadership deck)
function causeTotals(entries){
  const g = {}; let total = 0, outside = 0;
  entries.forEach(({row}) => (row.dateChanges || []).forEach(c => {
    if(!c.from || !c.to) return;
    const d = diffDays(c.from, c.to); if(d <= 0) return;
    const k = reasonCat(c.reason) || 'none';
    (g[k] = g[k] || {days:0, n:0}); g[k].days += d; g[k].n++;
    total += d; if(catInfo(k).outside) outside += d;
  }));
  const list = Object.entries(g).map(([k, v]) => ({k, label: catInfo(k).label, color: catInfo(k).color, days: v.days, n: v.n})).sort((a, b) => b.days - a.days);
  return {list, total, outside};
}

      <div class="seg" id="insScope">${[{id:'all', name:'All products'}].concat(data.projects.map(p => ({id:p.id, name:p.name, color:p.color}))).map(p => `<button class="${insightsScope===p.id?'active':''}" data-scope="${p.id}">${p.color ? `<span class="dot" style="background:${p.color}"></span>` : ''}${escapeHtml(p.name)}</button>`).join('')}</div>

    </div>

    ${insKpi('Delayed now', m.delayedNow, `${m.inFlight} in flight · ${m.backlog} in backlog`, '#DC2626')}
    ${insKpi('Waiting on others', m.waiting, 'blocked or awaiting feedback', '#B45309')}

  </section>
  <div class="ins-grid">

  c.querySelectorAll('[data-scope]').forEach(b => b.onclick = () => { insightsScope = b.dataset.scope; renderInsightsView(); });

  c.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => {

    render(); window.scrollTo({top: $('#filterBar').offsetTop - 80, behavior:'smooth'});

    const [pid, rid] = b.dataset.openRow.split('|');
    data.activeProjectId = pid; filters = emptyFilters(); activeView = 'tickets'; render();
    const tr = document.querySelector(`tr[data-row-id="${rid}"]`);
    if(tr){ tr.scrollIntoView({block:'center', behavior:'smooth'}); flashRow(rid); }
  });
  const snap = c.querySelector('#snapSave'); if(snap) snap.onclick = saveSnapshot;
  c.querySelectorAll('[data-snap-del]').forEach(b => b.onclick = () => {
    const i = data.snapshots.findIndex(x => x.id === b.dataset.snapDel); if(i < 0) return;
    const [rm] = data.snapshots.splice(i, 1); scheduleSave(); renderInsightsView();

function onInsightsDate(e){
  const w = e.target; if(w.dataset.dp !== 'waitingSince') return;
  const [pid, rid] = w.dataset.ref.split('|');

  row.waitingSince = e.detail.iso; scheduleSave(); renderInsightsView();

function insKpi(label, num, sub, color){
  return `<div class="ins-kpi" style="--k:${color}"><div class="kpi-label"><span class="kd"></span>${escapeHtml(label)}</div><div class="kpi-num">${num}</div><div class="kpi-sub">${escapeHtml(sub)}</div></div>`;
}
const projDot = p => `<span class="pdot" style="background:${p.color}" title="${escapeHtml(p.name)}"></span>`;

/* ---- 1. Plan vs actual: days early / late against the ORIGINAL plan, one bar per feature ---- */
function planVsActualHTML(entries){
  const items = [];
  entries.forEach(e => {
    const {s, row} = e;
    let v = null, kind = '';
    if(s.delivered){ if(s.deliveredDelta) { v = s.deliveredDelta; kind = 'shipped'; } }
    else if(s.state === 'delayed'){ v = s.lateBy; kind = 'flight'; }
    else if(s.slip < 0){ v = s.slip; kind = 'flight'; }
    // respect a manually set status (✎): never show "late" for a feature marked early / on time, etc.
    if(v && ((s.state === 'ontime') || (s.state === 'early' && v > 0) || ((s.state === 'late' || s.state === 'delayed') && v < 0))) v = null;
    if(v) items.push(Object.assign({v, kind}, e));
  });
  items.sort((a, b) => b.v - a.v);
  const shown = planShowAll ? items : items.slice(0, 14);
  const max = Math.max(1, ...items.map(i => Math.abs(i.v)));
  const onTime = entries.filter(e => e.s.state === 'ontime').length;
  const rows = shown.map(i => {
    const w = Math.abs(i.v) / max * 100;
    const late = i.v > 0;
    const bar = `<div class="pva-bar ${late ? 'late' : 'early'} ${i.kind === 'flight' ? 'flight' : ''}" style="width:${w}%"></div>`;
    return `<div class="pva-row" data-open-row="${i.proj.id}|${i.row.id}" title="Open in the roadmap">
      <div class="pva-name">${projDot(i.proj)}<span class="pva-task">${escapeHtml((i.row.task || 'Untitled').trim())}</span>${usesLiveChannels(i.proj) ? (liveSummary(i.row) ? `<span class="pva-tag">${escapeHtml(liveSummary(i.row))}</span>` : '') : i.row.releaseType ? `<span class="pva-tag">${escapeHtml(releaseLabel(i.row.releaseType))}</span>` : ''}${i.kind === 'flight' ? '<span class="pva-tag fl">in flight</span>' : ''}</div>
      <div class="pva-axis"><div class="pva-half left">${late ? '' : bar}</div><div class="pva-zero"></div><div class="pva-half right">${late ? bar : ''}</div></div>
      <div class="pva-val ${late ? 'late' : 'early'}">${late ? '+' : '−'}${Math.abs(i.v)}d ${late ? 'late' : 'early'}</div>
    </div>`;
  }).join('');
  return `<div class="card-h"><h3>Plan vs. actual</h3><span class="card-sub">days early or late against the original plan · ${onTime} delivered exactly on plan not shown</span></div>
    <div class="pva-legend"><span><i class="lg early"></i>Early</span><span><i class="lg late"></i>Late</span><span><i class="lg flight"></i>Still in flight (so far)</span></div>
    ${items.length ? `<div class="pva">${rows}</div>${items.length > 14 ? `<button class="link-btn" id="planMore">${planShowAll ? 'Show top 14' : `Show all ${items.length}`}</button>` : ''}` : '<div class="empty-insight"><span class="big">✓</span>Everything is on its original plan</div>'}`;
}

/* ---- 2. Monthly trend: features shipped (stacked by product) + % on or before plan ---- */
function trendHTML(entries, projects){
  const now = todayISO().slice(0, 7);
  const shippedMonths = entries.filter(e => e.s.delivered && shipDateOf(e.row)).map(e => shipDateOf(e.row).slice(0, 7)).filter(x => x <= now);
  if(!shippedMonths.length) return `<div class="card-h"><h3>Monthly trend</h3></div><div class="empty-insight">Nothing shipped yet</div>`;
  let start = shippedMonths.sort()[0];
  const months = [];
  for(let [y, mo] = start.split('-').map(Number); ; ){
    const key = `${y}-${pad(mo)}`; months.push(key);
    if(key >= now) break; mo++; if(mo > 12){ mo = 1; y++; }
  }
  const last = months.slice(-12);
  const per = last.map(k => {
    const inM = entries.filter(e => e.s.delivered && shipDateOf(e.row).slice(0, 7) === k);
    const byProj = projects.map(p => inM.filter(e => e.proj.id === p.id).length);
    const ok = inM.filter(e => e.s.state === 'early' || e.s.state === 'ontime').length;
    return {k, n: inM.length, byProj, pct: inM.length ? Math.round(ok / inM.length * 100) : null};
  });
  const W = 1300, H = 280, L = 20, R = 52, T = 30, B = 36;
  const iw = W - L - R, ih = H - T - B, step = iw / per.length, bw = Math.min(46, step * 0.55);
  const maxN = Math.max(1, ...per.map(p => p.n));
  const y = n => T + ih - n / maxN * ih;
  const yp = p => T + ih - p / 100 * ih;
  let svg = '';
  [0, 25, 50, 75, 100].forEach(g => { svg += `<line x1="${L}" x2="${W-R}" y1="${yp(g)}" y2="${yp(g)}" stroke="#E2E8F0" stroke-width="1"/><text x="${W-R+6}" y="${yp(g)+4}" font-size="11" fill="#94A3B8">${g}%</text>`; });
  per.forEach((p, i) => {
    const cx = L + step * i + step / 2;
    let acc = 0;
    p.byProj.forEach((n, j) => { if(!n) return; const h = n / maxN * ih; svg += `<rect x="${cx - bw/2}" y="${y(acc + n)}" width="${bw}" height="${h}" rx="3" fill="${projects[j].color}" opacity="0.85"><title>${escapeHtml(projects[j].name)} · ${monthLabel(p.k)}: ${n} shipped</title></rect>`; acc += n; });
    if(p.n) svg += `<text x="${cx}" y="${y(p.n) - 6}" text-anchor="middle" font-size="13" font-weight="700" fill="#334155" stroke="#fff" stroke-width="3" paint-order="stroke">${p.n}</text>`;
    svg += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-size="13" fill="#64748B">${MONTHS[+p.k.slice(5) - 1]}</text>`;
  });
  const pts = per.map((p, i) => p.pct === null ? null : [L + step * i + step / 2, yp(p.pct), p.pct]).filter(Boolean);
  if(pts.length > 1) svg += `<polyline points="${pts.map(p => p[0] + ',' + p[1]).join(' ')}" fill="none" stroke="#16A34A" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach(p => { svg += `<circle cx="${p[0]}" cy="${p[1]}" r="4.5" fill="#fff" stroke="#16A34A" stroke-width="2.5"><title>${p[2]}% on or before plan</title></circle><text x="${p[0] + 9}" y="${p[1] - 9}" font-size="12" font-weight="700" fill="#15803D" stroke="#fff" stroke-width="4" paint-order="stroke">${p[2]}%</text>`; });
  return `<div class="card-h"><h3>Monthly trend</h3><span class="card-sub">features shipped per month · green line = % shipped on or before plan</span></div>
    <div class="trend-legend">${projects.map(p => `<span><i style="background:${p.color}"></i>${escapeHtml(p.name)} shipped</span>`).join('')}<span><i class="ln"></i>% on or before plan</span></div>
    <svg class="trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="Features shipped per month and percent on or before plan">${svg}</svg>`;
}

/* ---- 3. Delay causes by category ---- */
function causesHTML(entries){
  const {list, total, outside} = causeTotals(entries);
  const max = Math.max(1, ...list.map(x => x.days));
  return `<div class="card-h"><h3>Days lost, by cause</h3><span class="card-sub">${total} days across every push-out</span></div>
    ${list.length ? list.map(x => `<div class="reason-row" style="cursor:default"><span class="reason-name" title="${escapeHtml(x.label)}"><span class="sw" style="background:${x.color}"></span>${escapeHtml(x.label)}</span><div class="reason-track"><div class="reason-fill" style="width:${x.days/max*100}%;background:${x.color}"></div></div><span class="reason-val"><b>${x.days}d</b> · ${Math.round(x.days/total*100)}%</span></div>`).join('') +
      `<p class="ins-note"><b>${Math.round(outside / total * 100)}%</b> of the days lost were outside the team (business, vendor or regulatory).</p>`
      : '<div class="empty-insight"><span class="big">✓</span>No date push-outs recorded</div>'}`;
}

/* ---- 4. Data quality: what's missing, per product, click to fix ---- */
function qualityHTML(entries, projects){
  const tiles = Object.entries(QUALITY).map(([k, q]) => {
    const per = projects.map(p => ({p, n: entries.filter(e => e.proj.id === p.id && q.test(e.row, e.s, e.proj)).length}));
    const n = per.reduce((a, x) => a + x.n, 0);
    return `<div class="dq-tile ${n ? 'warn' : 'ok'}"><div class="dq-top"><span class="dq-n">${n}</span><span class="dq-l">${escapeHtml(q.label)}</span></div>
      ${n ? `<div class="dq-links">${per.filter(x => x.n).map(x => `<button class="link-btn" data-goto="${x.p.id}|${k}">${escapeHtml(x.p.name)}: ${x.n} → fix</button>`).join('')}</div>` : '<div class="dq-links ok">All set</div>'}</div>`;
  }).join('');
  return `<div class="card-h"><h3>Data quality</h3><span class="card-sub">fill these in so the numbers stay trustworthy</span></div><div class="dq">${tiles}</div>`;
}

/* ---- 5. Waiting on others, oldest first ---- */
function waitingHTML(entries){
  const today = todayISO();
  const list = entries.filter(e => isWaiting(e.row)).map(e => Object.assign({days: e.row.waitingSince ? diffDays(e.row.waitingSince, today) : null}, e))
    .sort((a, b) => (b.days ?? -1) - (a.days ?? -1));
  const age = d => d === null ? '<span class="age none">no date</span>' : d >= 30 ? `<span class="age red">${d} days</span>` : d >= 14 ? `<span class="age amber">${d} days</span>` : `<span class="age">${d} days</span>`;
  return `<div class="card-h"><h3>Waiting on others</h3><span class="card-sub">blocked or awaiting feedback, oldest first · amber 14+ days, red 30+ days</span></div>
    ${list.length ? `<div class="tbl-wrap"><table class="ins-table"><tr><th>Product</th><th>Feature</th><th>Waiting for</th><th>Owner</th><th>Waiting since</th><th>Age</th></tr>
    ${list.map(e => `<tr><td>${projDot(e.proj)}${escapeHtml(e.proj.name)}</td><td><button class="link-btn strong" data-open-row="${e.proj.id}|${e.row.id}">${escapeHtml((e.row.task || 'Untitled').trim())}</button></td>
      <td>${escapeHtml((e.row.blocker || '').trim() || (e.row.comment || '').trim().split('\n')[0] || e.row.trackerStatus)}</td>
      <td>${e.row.assignee ? escapeHtml(e.row.assignee) : '<span class="muted">—</span>'}</td>
      <td>${dpHTML(e.row.waitingSince, `data-dp="waitingSince" data-ref="${e.proj.id}|${e.row.id}"`)}</td><td>${age(e.days)}</td></tr>`).join('')}
    </table></div>` : '<div class="empty-insight"><span class="big">✓</span>Nothing is waiting on others</div>'}`;
}

/* ---- 6. Now / Next / Later (+ recently shipped) ---- */
function nowNextHTML(entries){
  const today = todayISO();
  const endOfMonth = (() => { const d = new Date(); return toLocalISODate(new Date(d.getFullYear(), d.getMonth() + 1, 0)); })();
  const cols = { shipped:[], now:[], next:[], later:[] };
  entries.forEach(e => {
    const r = e.row;
    if(e.s.delivered){ const sd = shipDateOf(r); if(sd && diffDays(sd, today) <= 30 && sd <= today) cols.shipped.push(e); return; }
    if(r.stage === 'DEV' || r.stage === 'UAT' || (r.delivery && r.delivery <= endOfMonth)) cols.now.push(e);
    else if(r.delivery) cols.next.push(e);
    else cols.later.push(e);
  });
  const byDate = (a, b) => (a.row.delivery || '9') < (b.row.delivery || '9') ? -1 : 1;
  cols.now.sort(byDate); cols.next.sort(byDate); cols.shipped.sort((a, b) => shipDateOf(b.row) < shipDateOf(a.row) ? -1 : 1);
  const card = e => `<button class="nn-card" data-open-row="${e.proj.id}|${e.row.id}" style="--sc:${SCHEDULE[e.s.state].color}">
    <span class="nn-name">${projDot(e.proj)}${escapeHtml((e.row.task || 'Untitled').trim())}</span>
    <span class="nn-meta">${STAGE_OPTIONS.find(o => o.v === e.row.stage)?.label || ''}${e.s.delivered ? ' · ' + fmtDate(shipDateOf(e.row)) : e.row.delivery ? ' · due ' + fmtDate(e.row.delivery) : ''} · <b style="color:${SCHEDULE[e.s.state].color}">${SCHEDULE[e.s.state].label}</b></span></button>`;
  const col = (title, sub, list) => `<div class="nn-col"><div class="nn-h"><b>${title}</b><span>${list.length}</span></div><p class="nn-sub">${sub}</p>${list.map(card).join('') || '<p class="nn-empty">—</p>'}</div>`;
  return `<div class="card-h"><h3>Now · Next · Later</h3><span class="card-sub">the roadmap at a glance, for leadership</span></div>
    <div class="nn">${col('Shipped', 'last 30 days', cols.shipped)}${col('Now', 'in build or test, or due this month', cols.now)}${col('Next', 'planned with a date', cols.next)}${col('Later', 'backlog, no date yet', cols.later)}</div>`;
}

/* ---- 7. Monthly snapshots: freeze the numbers each month for before/after comparisons ---- */
function snapshotMetrics(){
  const out = { all: metricsOf(scopeEntries(data.projects)) };
  data.projects.forEach(p => { out[p.id] = Object.assign({name: p.name}, metricsOf(scopeEntries([p]))); });
  return out;
}
function saveSnapshot(){
  const month = todayISO().slice(0, 7);
  const existing = data.snapshots.find(x => x.month === month);
  if(existing && !confirm(`Replace the snapshot already saved for ${monthLabel(month)}?`)) return;
  const snap = { id: uid('snap'), month, savedAt: new Date().toISOString(), metrics: snapshotMetrics() };
  if(existing) data.snapshots.splice(data.snapshots.indexOf(existing), 1, snap); else data.snapshots.push(snap);
  data.snapshots.sort((a, b) => a.month < b.month ? -1 : 1);
  scheduleSave(); renderInsightsView(); toast(`Snapshot saved for ${monthLabel(month)}`);
}
function snapshotsHTML(){
  const key = insightsScope;
  const list = (data.snapshots || []).slice().reverse();
  const month = todayISO().slice(0, 7);
  const cell = v => v === null || v === undefined ? '—' : v;
  return `<div class="card-h"><h3>Monthly snapshots</h3><span class="card-sub">freeze this month’s numbers to compare before and after</span>
    <button class="tbtn primary edit-only" id="snapSave">📸 Save snapshot for ${monthLabel(month)}</button></div>
    ${list.length ? `<div class="tbl-wrap"><table class="ins-table"><tr><th>Month</th><th>Shipped (total)</th><th>On or before plan</th><th>Delayed</th><th>In flight</th><th>Backlog</th><th>Waiting</th><th>Top cause</th><th></th></tr>
    ${list.map(sn => { const m = sn.metrics[key]; if(!m) return `<tr><td>${monthLabel(sn.month)}</td><td colspan="8" class="muted">No data for this product in this snapshot</td></tr>`;
      return `<tr><td><b>${monthLabel(sn.month)}</b><br><span class="muted">saved ${fmtStamp(sn.savedAt)}</span></td><td>${m.shipped}</td><td>${m.onPlanPct === null ? '—' : m.onPlanPct + '%'}</td><td>${cell(m.delayedNow)}</td><td>${cell(m.inFlight)}</td><td>${cell(m.backlog)}</td><td>${cell(m.waiting)}</td><td>${escapeHtml(m.topCause || '—')}</td><td><button class="hist-del edit-only" data-snap-del="${sn.id}" title="Delete snapshot">×</button></td></tr>`; }).join('')}
    </table></div>` : `<p class="ins-note">No snapshots yet. Save one at the start of each month; this table then shows how the numbers move over time.</p>`}`;
}

/* ============================================================
   TOP-LEVEL ACTIONS
   ============================================================ */
$('#addSprintBtn').onclick = () => {
  const proj = getActiveProject();
  proj.sprints.push(newSprint(`Sprint ${proj.sprints.length + 1}`));
  scheduleSave(); refreshTickets();
  window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
};
$('#addTicketBtn').onclick = () => {
  if(activeView !== 'tickets'){ activeView = 'tickets'; renderViewbar(); }
  const proj = getActiveProject();
  if(!proj.sprints.length) proj.sprints.push(newSprint('Sprint 1'));
  const sprint = proj.sprints[proj.sprints.length - 1];
  sprint.collapsed = false;
  const r = newRow(data.nextTicketNo++); sprint.rows.push(r);
  filters = emptyFilters();
  scheduleSave(); renderActiveView();
  const inp = document.querySelector(`tr[data-row-id="${r.id}"] .task-name`);
  if(inp){ inp.scrollIntoView({block:'center', behavior:'smooth'}); inp.focus({preventScroll:true}); }
};
function setPresent(on){
  document.body.classList.toggle('present', on);
  $('#presentBtn').classList.toggle('on', on);
  $('#presentLabel').textContent = on ? 'Exit presentation' : 'Present';
  const u = new URL(location.href);
  if(on) u.searchParams.set('view', 'exec'); else u.searchParams.delete('view');
  history.replaceState(null, '', u);
}
$('#presentBtn').onclick = () => setPresent(!document.body.classList.contains('present'));

$('#moreBtn').onclick = e => {
  const present = document.body.classList.contains('present');
  const m = openMenu(e.currentTarget, `
    ${present ? '' : `<button data-m="addcol">＋ Add custom column</button><button data-m="cols">☰ Show / hide columns</button><button data-m="reasons">🏷 Manage delay reasons</button><hr>`}
    <button data-m="link">🔗 Copy presentation link</button>
    <button data-m="print">🖨 Print / save as PDF</button><hr>
    <button data-m="export">⬆ Export data (backup)</button>
    ${present ? '' : `<button data-m="import">⬇ Import data</button>`}`);
  m.querySelectorAll('[data-m]').forEach(b => b.onclick = () => {
    const k = b.dataset.m; closeMenus();
    if(k === 'addcol'){
      const label = prompt('New column name (e.g. Owner, Module):');
      if(label && label.trim()){
        const col = { id: uid('col'), label: label.trim() };
        data.customColumns.push(col);
        data.projects.forEach(p => p.sprints.forEach(s => s.rows.forEach(r => { r.custom[col.id] = ''; })));
        scheduleSave(); renderSprints();
      }
    } else if(k === 'cols') openColumnsMenu();
    else if(k === 'reasons') openManageReasons();
    else if(k === 'link'){
      const u = new URL(location.href); u.searchParams.set('view', 'exec');
      navigator.clipboard.writeText(u.toString()).then(() => toast('Presentation link copied — opens in read-only view'), () => prompt('Copy this link:', u.toString()));
    }
    else if(k === 'print') window.print();
    else if(k === 'export') showExportModal();
    else if(k === 'import') showImportModal();
  });
};
/* ---------- Manage delay reasons: rename, set category, merge duplicates, delete unused ---------- */
function reasonUsage(){
  const u = {};
  data.projects.forEach(p => p.sprints.forEach(s => s.rows.forEach(r => {
    (r.dateChanges || []).forEach(c => { if(c.reason) u[c.reason] = (u[c.reason] || 0) + 1; });
    if(r.delayReason) u[r.delayReason] = (u[r.delayReason] || 0) + 1;
  })));
  return u;
}
function replaceReasonEverywhere(from, to){
  data.projects.forEach(p => p.sprints.forEach(s => s.rows.forEach(r => {
    (r.dateChanges || []).forEach(c => { if(c.reason === from) c.reason = to; });
    if(r.delayReason === from) r.delayReason = to;
  })));
}
function openManageReasons(){
  const u = reasonUsage();
  const customs = data.customReasons || [];
  const o = openModal(`<h3>Manage delay reasons</h3>
    <p class="m-sub">Every reason belongs to one category, which is what the charts count. Rename a reason, change its category, or merge duplicates into one.</p>
    <div class="mr-wrap">
    <table class="mr-table"><tr><th>Reason</th><th>Category</th><th>Used</th><th>Merge into…</th><th></th></tr>
    ${REASONS.map(r => `<tr class="mr-builtin"><td>${escapeHtml(r.label)}</td><td><span class="mr-cat" style="--rc:${catInfo(r.cat).color}">${escapeHtml(catInfo(r.cat).label)}</span></td><td>${u[r.v] || 0}</td><td colspan="2" class="mr-muted">built-in</td></tr>`).join('')}
    ${customs.map(r => `<tr data-rid="${r.v}">
      <td><input class="mr-label" value="${escapeHtml(r.label)}" maxlength="60"></td>
      <td><select class="mr-catsel">${REASON_CATS.map(c => `<option value="${c.v}" ${r.cat===c.v?'selected':''}>${escapeHtml(c.label)}</option>`).join('')}</select></td>
      <td>${u[r.v] || 0}</td>
      <td><select class="mr-merge"><option value="">—</option>${allReasons().filter(x => x.v !== r.v).map(x => `<option value="${x.v}">${escapeHtml(x.label)}</option>`).join('')}</select></td>
      <td>${u[r.v] ? '' : `<button class="mr-del" title="Delete (not used anywhere)">✕</button>`}</td></tr>`).join('')}
    </table></div>
    <div class="modal-actions"><button class="btn primary" id="mDone">Done</button></div>`);
  o.querySelector('.modal-box').style.maxWidth = '900px';
  const reopen = () => { scheduleSave(); refreshTickets(); openManageReasons(); };
  o.querySelectorAll('tr[data-rid]').forEach(tr => {
    const r = customs.find(x => x.v === tr.dataset.rid); if(!r) return;
    tr.querySelector('.mr-label').onchange = e => { const v = e.target.value.trim(); if(v){ r.label = v; scheduleSave(); refreshTickets(); } };
    tr.querySelector('.mr-catsel').onchange = e => { r.cat = e.target.value; scheduleSave(); refreshTickets(); };
    tr.querySelector('.mr-merge').onchange = e => {
      const to = e.target.value; if(!to) return;
      if(!confirm(`Merge “${r.label}” into “${reasonInfo(to).label}”? Every use is moved over and “${r.label}” is removed.`)){ e.target.value = ''; return; }
      replaceReasonEverywhere(r.v, to);
      data.customReasons = data.customReasons.filter(x => x.v !== r.v);
      reopen(); toast('Reasons merged');
    };
    const del = tr.querySelector('.mr-del');
    if(del) del.onclick = () => { data.customReasons = data.customReasons.filter(x => x.v !== r.v); reopen(); };
  });
  o.querySelector('#mDone').onclick = closeModal;
}
function openColumnsMenu(){
  const vis = data.columnVisibility;
  const items = [['assignee','Assignee'],['schedule','Schedule status'],['reasons','Delay reasons'],['release','Release type'],['uat','UAT & release'],['effort','Effort'],['highlight','RAG'],['blocker','Blocker'],['comment','Comment']];
  const m = openMenu($('#moreBtn'), `<div class="cp-title">Show columns</div>` + items.map(([k,l]) => `<label><input type="checkbox" data-col-vis="${k}" ${vis[k]?'checked':''}> ${l}</label>`).join(''));
  m.querySelectorAll('[data-col-vis]').forEach(cb => cb.onchange = () => { data.columnVisibility[cb.dataset.colVis] = cb.checked; scheduleSave(); renderSprints(); });
}
function showExportModal(){
  const text = JSON.stringify(data, null, 2);
  const o = openModal(`<h3>Export data</h3><p class="m-sub">Your full dashboard data. Keep a copy somewhere safe as a backup.</p><textarea class="code" readonly spellcheck="false"></textarea>
    <div class="modal-actions"><button class="btn" id="mDl">Download .json</button><button class="btn" id="mCancel">Close</button><button class="btn primary" id="mCopy">Copy to clipboard</button></div>`);
  const ta = o.querySelector('textarea'); ta.value = text;
  o.querySelector('#mCancel').onclick = closeModal;
  o.querySelector('#mCopy').onclick = async e => { try{ await navigator.clipboard.writeText(text); }catch(_){ ta.select(); document.execCommand('copy'); } e.target.textContent = 'Copied!'; };
  o.querySelector('#mDl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type:'application/json'})); a.download = `roadmap-backup-${todayISO()}.json`; a.click(); };
}
function showImportModal(){
  const o = openModal(`<h3>Import data</h3><p class="m-sub">Paste previously exported data. This replaces everything for everyone viewing this dashboard.</p><textarea class="code" spellcheck="false"></textarea>
    <div class="modal-actions"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mImport">Import</button></div>`);
  o.querySelector('#mCancel').onclick = closeModal;
  o.querySelector('#mImport').onclick = () => {
    let parsed;
    try{ parsed = JSON.parse(o.querySelector('textarea').value); }catch(e){ alert("That isn't valid exported data (couldn't read it as JSON)."); return; }
    if(!parsed || !Array.isArray(parsed.projects) || !parsed.projects.length){ alert("That isn't valid exported data (no projects found)."); return; }
    if(!confirm('Replace all current data for everyone viewing this dashboard?')) return;
    data = migrateData(parsed); closeModal(); render(); scheduleSave();
  };
}

if(new URLSearchParams(location.search).get('view') === 'exec') setPresent(true);
if(['gantt','tickets'].includes(new URLSearchParams(location.search).get('tab'))) activeView = new URLSearchParams(location.search).get('tab');
render();          // draw the empty shell immediately, then load shared data
loadData();
